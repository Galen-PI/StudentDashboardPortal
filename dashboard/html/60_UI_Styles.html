  border-radius: 9px; width: 100%; max-width: 560px; max-height: 88vh;
  overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-modal);
}
.explainer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding:var(--space-16) var(--space-22); border-bottom: 2px solid var(--accent-dim); flex-shrink: 0;
}
.explainer-header h3 { font-size: var(--text-xl); font-weight: 700; }
.explainer-body      { overflow-y: auto; padding:var(--space-20) var(--space-22); flex: 1; display: flex; flex-direction: column; gap:var(--space-14); }
.explainer-intro     { font-size: var(--text-md); color: var(--text-muted); line-height: 1.65; }
.explainer-levels    { display: flex; flex-direction: column; gap:var(--space-6); }
.explainer-level     { padding:var(--space-9) var(--space-12); border-radius: 4px; font-size: var(--text-md); border-left: 2px solid transparent; }
.explainer-level.high    { background: color-mix(in srgb, var(--high) 8%, transparent);   color: var(--high);    border-left-color: var(--high); }
.explainer-level.medium  { background: color-mix(in srgb, var(--medium) 8%, transparent); color: var(--medium);  border-left-color: var(--medium); }
.explainer-level.low     { background: color-mix(in srgb, var(--low) 8%, transparent);    color: var(--low);     border-left-color: var(--low); }
.explainer-level.unknown { background: var(--bg3);            color: var(--text-muted); border-left-color: var(--neutral); }
.explainer-group       { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding:var(--space-13); }
.explainer-group-title { font-size: var(--text-sm); font-weight: 700; color: var(--text-muted); margin-bottom:var(--space-8); text-transform: uppercase; letter-spacing: 0.5px; }
.explainer-item {
  display: flex; align-items: flex-start; gap:var(--space-10); padding:var(--space-5) 0;
  border-bottom: 1px solid var(--border); font-size: var(--text-base); color: var(--text-soft); line-height: 1.5;
}
.explainer-item:last-child { border-bottom: none; }
.explainer-pts  { font-weight: 700; font-size: var(--text-sm); color: var(--accent); white-space: nowrap; min-width: 32px; padding-top:var(--space-1); }
.explainer-note { font-size: var(--text-sm); color: var(--text-muted); line-height: 1.65; font-style: italic; }

/* ── Risk Sparkline ──────────────────────────────────────── */
.sparkline-section       { padding:var(--space-14); }
.sparkline-section h3    { margin-bottom:var(--space-8); }
.sparkline-section svg text { font-family: var(--font); }

/* ── Tools Sidebar ───────────────────────────────────────── */
.sidebar-overlay {
  position: fixed; inset: 0; background: rgba(8,6,4,.55);
  z-index: 180; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
}
.sidebar-overlay.open { opacity: 1; pointer-events: all; }

.sidebar {
  position: fixed; top: 0; right: 0; bottom: 0; width: 296px;
  background: var(--bg2); border-left: 1px solid var(--border-bright);
  box-shadow: var(--shadow-modal); z-index: 190;
  display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform 0.22s ease-out;
}
.sidebar.open { transform: translateX(0); }

.sidebar-header {
  display: flex; align-items: center; justify-content: space-between;
  padding:var(--space-16) var(--space-18); border-bottom: 2px solid var(--accent-dim);
  background: var(--bg3); flex-shrink: 0;
}
.sidebar-header h2 { font-size: var(--text-lg); font-weight: 700; color: var(--text); }
.sidebar-body      { padding:var(--space-12) var(--space-14); overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap:var(--space-3); }

.sidebar-section-label {
  font-size: var(--text-xs); font-weight: 700; color: var(--text-muted);
  padding:var(--space-10) var(--space-4) var(--space-4);
  text-transform: uppercase; letter-spacing: 0.6px;
}
.sidebar-section-sublabel {
  font-size: var(--text-xs); font-weight: 700; color: var(--text-muted);
  padding:var(--space-2) var(--space-4) var(--space-6);
  text-transform: uppercase; letter-spacing: 0.5px;
}
.sidebar-btn {
  display: flex; align-items: center; gap:var(--space-11);
  width: 100%; padding:var(--space-10) var(--space-13); border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg3);
  color: var(--text); font-size: var(--text-md); font-weight: 600;
  font-family: var(--font); cursor: pointer; text-align: left;
  /* Indent on hover — psychologically suggests depth and selection */
  transition: background 0.15s, border-color 0.15s, padding-left 0.18s;
}
.sidebar-btn svg        { width: 15px; height: 15px; color: var(--accent-dim); flex-shrink: 0; }
.sidebar-btn:hover      { border-color: var(--border-bright); background: var(--bg4); padding-left:var(--space-17); }
.sidebar-btn:active     { padding-left:var(--space-19); }
.sidebar-btn .sb-label  { flex: 1; }
.sidebar-btn .sb-desc   { font-size: var(--text-sm); color: var(--text-muted); font-weight: 400; margin-top:var(--space-1); line-height: 1.4; }
.sidebar-btn-inner      { display: flex; flex-direction: column; }

.sidebar-divider { height: 1px; background: var(--border); margin:var(--space-5) 0; }

.sidebar-role-wrap { padding:var(--space-4); }
