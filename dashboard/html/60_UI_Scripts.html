function openMergeModal()        { renderMergePanel(); document.getElementById('mergeModal').classList.remove('hidden'); }
function closeMergeModal(e)      { if (e && e.target !== document.getElementById('mergeModal')) return; document.getElementById('mergeModal').classList.add('hidden'); }
function closeMergeModalButton() { document.getElementById('mergeModal').classList.add('hidden'); }

function _mergeSourceSummary(p) {
  const parts = [];
  if (p.academic)        parts.push(p.academic.type || 'Academic');
  if (p.hasTrades)       parts.push('Trades: ' + (p.trades?.[0]?.tarName || '?'));
  if (p.tradeComplete)   parts.push('Trade Complete');
  if (p.hasTime)         parts.push('Time logged');
  if (p.hasIntervention) parts.push('WIR');
  if (!parts.length)     parts.push('No data');
  return parts.join(', ');
}

function renderMergePanel(sourceId, targetId) {
  const sorted  = [...allProfiles].sort((a, b) => a.displayName.localeCompare(b.displayName));
  const options = sorted.map(p => `<option value="${esc(p.id)}">${esc(p.displayName)} — ${esc(_mergeSourceSummary(p))}</option>`).join('');
  const source  = sourceId ? allProfiles.find(x => x.id === sourceId) : null;
  const target  = targetId ? allProfiles.find(x => x.id === targetId) : null;

  let preview = '';
  if (source && target) {
    if (source.id === target.id) {
      preview = `<div class="merge-warning">Source and target are the same student — pick two different profiles.</div>`;
    } else {
      preview = `<div class="merge-preview"><b>${esc(source.displayName)}</b> will be merged into <b>${esc(target.displayName)}</b>.<br><br>
        Any data the target is missing will be copied from the source. The target's existing data takes priority.
        <b>${esc(source.displayName)}</b> will no longer appear after the next refresh.</div>
      <div class="merge-warning">${_warnGlyph} This cannot be easily undone. Double-check these are the same person before merging.</div>`;
    }
  } else {
    preview = `<div class="merge-preview">Select the duplicate profile (source) and the one to keep (target).</div>`;
  }

  const canMerge = source && target && source.id !== target.id;
  document.getElementById('mergePanelBody').innerHTML = `
    <div class="merge-row"><label>Duplicate profile (will be merged away)</label>
      <select id="mergeSource" onchange="onMergeSelectChange()"><option value="">— Select student —</option>${options}</select></div>
    <div class="merge-row"><label>Keep this profile (merge target)</label>
      <select id="mergeTarget" onchange="onMergeSelectChange()"><option value="">— Select student —</option>${options}</select></div>
    ${preview}
    <div class="override-actions">
      <button class="btn-override" ${canMerge ? '' : 'disabled style="opacity:.5;cursor:not-allowed;"'} onclick="confirmMergeWithDialog()">Merge</button>
      <button class="btn-override danger" onclick="closeMergeModalButton()">Cancel</button>
    </div>
    <div id="mergeError" class="override-error"></div>
    <div id="mergeSaved" class="override-saved">Merged — refreshing…</div>
  `;
  if (sourceId) document.getElementById('mergeSource').value = sourceId;
  if (targetId) document.getElementById('mergeTarget').value = targetId;
}

function onMergeSelectChange() {
  renderMergePanel(document.getElementById('mergeSource').value, document.getElementById('mergeTarget').value);
}

function confirmMergeWithDialog() {
  const sourceId = document.getElementById('mergeSource').value;
  const targetId = document.getElementById('mergeTarget').value;
  if (!sourceId || !targetId || sourceId === targetId) return;
  const source = allProfiles.find(x => x.id === sourceId);
  const target = allProfiles.find(x => x.id === targetId);
  if (!source || !target) return;
  themedConfirm(
    `"${source.displayName}" will be removed from the dashboard after the next refresh. This is difficult to undo.`,
    { title: `Merge "${source.displayName}" into "${target.displayName}"?`, okLabel: 'Merge', danger: true }
  ).then(ok => {
    if (ok) confirmMerge(sourceId, targetId);
  });
}

function confirmMerge(sourceId, targetId) {
  const btn = document.querySelector('#mergePanelBody .btn-override');
  if (btn) { btn.disabled = true; btn.textContent = 'Merging…'; }
  google.script.run
    .withSuccessHandler(() => {
      const flash = document.getElementById('mergeSaved');
      if (flash) flash.classList.add('show');
      google.script.run
        .withSuccessHandler(result => { onDataLoaded(result); closeMergeModalButton(); })
        .withFailureHandler(onError)
        .refreshData();
    })
    .withFailureHandler(err => {
      const msg = typeof err === 'string' ? err : (err?.message || 'Merge failed — please try again.');
      const box = document.getElementById('mergeError');
      if (box) { box.textContent = msg; box.classList.add('show'); }
      if (btn) { btn.disabled = false; btn.textContent = 'Merge'; }
    })
    .mergeStudents(sourceId, targetId, _currentEmployeeId, _currentRole);
}

function _renderTradeSummary() {
  const search = (document.getElementById('tradeSummarySearch').value || '').toLowerCase().trim();
  const byTrade = {};

  allProfiles.forEach(p => {
    (p.trades || []).forEach(t => {
      const name = t.tarName || 'Unknown';
      (byTrade[name] = byTrade[name] || []).push({
        displayName: p.displayName,
        staffPct:    t.staffPct,
        studentPct:  t.studentPct,
        overallPct:  t.overallPct,
        complete:    false,
      });
    });
    // Students who've finished a trade drop out of p.trades[] entirely (per the existing "Trade Complete" card logic elsewhere) —
    if (p.tradeComplete && (!p.trades || !p.trades.length) && p.completedTrades && p.completedTrades.length) {
      p.completedTrades.forEach(name => {
        (byTrade[name] = byTrade[name] || []).push({
          displayName: p.displayName, staffPct: 100, studentPct: 100, overallPct: 100, complete: true,
        });
      });
    }

  const tradeNames = Object.keys(byTrade).sort();

    container.innerHTML = '<div style="padding:16px;text-align:center;color:var(--text-muted);font-style:italic;">No trade data loaded.</div>';
    return;
  }

  const sections = tradeNames.map(trade => {
    let students = byTrade[trade];
    if (search) students = students.filter(s => s.displayName.toLowerCase().includes(search));
    if (!students.length) return '';
    students.sort((a, b) => (b.overallPct ?? -1) - (a.overallPct ?? -1));

    return `
      <div class="info-section" style="margin-bottom:14px;">
        <h3 style="margin-bottom:8px;">${esc(trade)}
          <span style="font-size:11px;font-weight:400;color:var(--text-muted);margin-left:6px;">${students.length} student${students.length !== 1 ? 's' : ''}</span>
        </h3>
        <table style="width:100%;border-collapse:collapse;font-size:12px;">
          <thead>
            <tr style="background:var(--bg4);border-bottom:2px solid var(--border);">
              <th style="padding:6px 8px;text-align:left;color:var(--text-muted);font-size:10px;font-weight:700;text-transform:uppercase;">Student</th>
              <th style="padding:6px 8px;text-align:center;color:var(--text-muted);font-size:10px;font-weight:700;text-transform:uppercase;">Staff %</th>
              <th style="padding:6px 8px;text-align:center;color:var(--text-muted);font-size:10px;font-weight:700;text-transform:uppercase;">Student %</th>
              <th style="padding:6px 8px;text-align:center;color:var(--text-muted);font-size:10px;font-weight:700;text-transform:uppercase;">Overall %</th>
            </tr>
          </thead>
          <tbody>
            ${students.map(s => `
              <tr style="border-bottom:1px solid var(--border);">
                <td style="padding:6px 8px;font-weight:600;color:var(--text);">${esc(s.displayName)}</td>
                <td style="padding:6px 8px;text-align:center;">${s.staffPct != null ? s.staffPct.toFixed(1) + '%' : '—'}</td>
                <td style="padding:6px 8px;text-align:center;">${s.studentPct != null ? s.studentPct.toFixed(1) + '%' : '—'}</td>
                <td style="padding:6px 8px;text-align:center;font-weight:700;color:${s.complete ? 'var(--low)' : 'var(--text)'};">${s.overallPct != null ? s.overallPct.toFixed(1) + '%' : '—'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }).filter(Boolean);

  container.innerHTML = sections.length
    ? sections.join('')
    : '<div style="padding:16px;text-align:center;color:var(--text-muted);font-style:italic;">No students match that search.</div>';
}

function openScheduleUpload() {
  document.getElementById('scheduleUploadModal').classList.remove('hidden');
  document.getElementById('scheduleFileInput').value = '';
  document.getElementById('scheduleUploadStatus').textContent = '';
  document.getElementById('scheduleUploadStatus').className = 'schedule-status';
  document.getElementById('scheduleUploadBtn').disabled = true;
  document.getElementById('schedulePreview').innerHTML = '';
  document.getElementById('schedulePreview').classList.add('hidden');

  // Default the week picker to this week's Monday — covers the
  // normal Monday/Wednesday/Friday re-upload case with zero clicks;
  // only needs changing when deliberately backfilling or fixing a
  // past week.
  const monday = _mondayOfWeek_(new Date());
  const picker = document.getElementById('scheduleWeekPicker');
  picker.value = _dateToInputValue_(monday);
  _updateScheduleWeekLabel_(monday);
}

// Snaps any selected date to that week's Monday — a real calendar
// picker showing individual days, but the meaningful unit here is
// always the whole week, so whatever day gets clicked resolves to
// its Monday automatically.
function _mondayOfWeek_(date) {
  const day = date.getDay(); // 0=Sun ... 6=Sat
  const diff = day === 0 ? -6 : 1 - day;
  const monday = new Date(date.getFullYear(), date.getMonth(), date.getDate() + diff);
  return monday;
}

function _dateToInputValue_(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function _updateScheduleWeekLabel_(monday) {
  const friday = new Date(monday); friday.setDate(monday.getDate() + 4);
  const fmt = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const label = document.getElementById('scheduleWeekLabel');
  const isCurrentWeek = _dateToInputValue_(monday) === _dateToInputValue_(_mondayOfWeek_(new Date()));
  label.textContent = `Week of ${fmt(monday)} – ${fmt(friday)}` + (isCurrentWeek ? ' (current week)' : ' — backfilling a past week');
}

function onScheduleWeekPicked(input) {
  if (!input.value) return;
  // Parse as a local date, not UTC — a plain 'yyyy-MM-dd' parsed via
  // `new Date(str)` treats it as UTC midnight, which can roll back a
  // day in US timezones. Split and construct locally instead.
  const [y, m, d] = input.value.split('-').map(Number);
  const picked = new Date(y, m - 1, d);
  const monday = _mondayOfWeek_(picked);
  input.value = _dateToInputValue_(monday); // snap the visible picker to the Monday too
  _updateScheduleWeekLabel_(monday);
}

function closeScheduleUpload() {
  clearInterval(_scheduleUploadTimerInterval);
  document.getElementById('scheduleUploadModal').classList.add('hidden');
}

// Mirrors SCHEDULE_VALID_PERIODS on the server exactly — Period 4 is

const MANUAL_SCHEDULE_VALID_PERIODS = {
  M:  [1, 2, 3, 5, 6],
  T:  [1, 2, 3, 5, 6, 7],
  W:  [1, 2, 3, 5, 6],
  TH: [1, 2, 3, 5, 6, 7],

function _updateManualScheduleWeekLabel_(monday) {

  const fmt = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

function _renderManualScheduleGrid() {
  const grid = document.getElementById('manualScheduleGrid');
  let html = `<table style="width:100%;border-collapse:collapse;font-size:12px;">
    <thead><tr>
      <th style="padding:6px 8px;text-align:left;color:var(--text-muted);font-size:10px;text-transform:uppercase;">Period</th>
      ${MANUAL_SCHEDULE_DAYS.map(d => `<th style="padding:6px 8px;text-align:left;color:var(--text-muted);font-size:10px;text-transform:uppercase;">${MANUAL_SCHEDULE_DAY_LABELS[d]}</th>`).join('')}
    </tr></thead><tbody>`;
  MANUAL_SCHEDULE_PERIODS.forEach(period => {
    html += `<tr><td style="padding:4px 8px;font-weight:700;color:var(--text-muted);">${period}</td>`;
    MANUAL_SCHEDULE_DAYS.forEach(day => {
      const valid = MANUAL_SCHEDULE_VALID_PERIODS[day].includes(period);
      if (!valid) {
        html += `<td style="padding:4px;background:var(--bg3);"></td>`;
      } else {
        html += `<td style="padding:4px;">
          <input type="text" placeholder="Class" data-period="${period}" data-day="${day}" data-field="class"
            style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--font);font-size:12px;padding:5px 6px;margin-bottom:3px;box-sizing:border-box;">
          <input type="text" placeholder="Location" data-period="${period}" data-day="${day}" data-field="location"
            style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--font);font-size:11px;padding:4px 6px;box-sizing:border-box;">

  grid.innerHTML = html;

function confirmManualScheduleSave() {
  const select      = document.getElementById('manualScheduleStudent');
  const studentId   = select.value;
  const studentName = select.options[select.selectedIndex] ? select.options[select.selectedIndex].dataset.name : '';
  const status      = document.getElementById('manualScheduleStatus');

  if (!studentId) {

    status.className   = 'schedule-status err';
    return;
  }

  const entries = [];
  document.querySelectorAll('#manualScheduleGrid input[data-field="class"]').forEach(classInput => {
    const className = classInput.value.trim();
    if (!className) return;
    const period = classInput.dataset.period;
    const day    = classInput.dataset.day;
    const locationInput = document.querySelector(`#manualScheduleGrid input[data-field="location"][data-period="${period}"][data-day="${day}"]`);
    entries.push({ period, day, className, location: locationInput ? locationInput.value.trim() : '' });
  });

  if (!entries.length) {
    status.textContent = '✕ Enter at least one class period.';

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled    = false;
      btn.textContent = 'Save Schedule';
      if (result.error) {
        status.textContent = '✕ ' + result.error;
        status.className   = 'schedule-status err';

      setTimeout(() => closeManualScheduleEntry(), 1800);
    })
    .withFailureHandler(function(err) {
      btn.disabled    = false;
      btn.textContent = 'Save Schedule';
      status.textContent = '✕ ' + (err && err.message ? err.message : 'Save failed — please try again.');

function onScheduleFileSelected(input) {
  const file = input.files[0];
  if (!file) return;

  const status = document.getElementById('scheduleUploadStatus');
  status.textContent = 'Reading file…';
  status.className = 'schedule-status';

  if (!file.name.toLowerCase().endsWith('.xlsx') && !file.name.toLowerCase().endsWith('.xls')) {
    status.textContent = '✕ Please upload an .xls or .xlsx file.';
    status.className = 'schedule-status err';
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const bytes  = new Uint8Array(e.target.result);
      let binary   = '';
      const chunk  = 8192;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
      }
      const base64 = btoa(binary);

      const preview = document.getElementById('schedulePreview');
      preview.innerHTML = `
        <div class="schedule-preview-row">
          <span class="sp-label">File</span><span class="sp-val">${file.name}</span>
        </div>
        <div class="schedule-preview-row">
          <span class="sp-label">Size</span><span class="sp-val">${(file.size / 1024).toFixed(1)} KB</span>
        </div>
        <div class="schedule-preview-row">
          <span class="sp-label">Status</span><span class="sp-val" style="color:var(--ok)">Ready to upload</span>
        </div>
      `;
      preview.classList.remove('hidden');
      preview.dataset.base64 = base64;

      status.textContent = 'Ready to upload — parsing will happen on the server.';
      status.className = 'schedule-status ok';
      document.getElementById('scheduleUploadBtn').disabled = false;

    } catch(err) {
      status.textContent = '✕ Could not read file: ' + err.message;
      status.className = 'schedule-status err';
    }
  };
  reader.readAsArrayBuffer(file);
}

let _scheduleUploadTimerInterval = null;

function confirmScheduleUpload() {
  const preview = document.getElementById('schedulePreview');
  const base64  = preview.dataset.base64;
  if (!base64) return;

  const btn    = document.getElementById('scheduleUploadBtn');
  const status = document.getElementById('scheduleUploadStatus');

  btn.disabled       = true;
  btn.textContent    = 'Uploading…';
  status.className   = 'schedule-status';

  // No way to get real progress out of a single google.script.run call,
  // so instead of a static "Sending to server…" that never changes (and
  // looks identical whether it's working or frozen), show an elapsed
  // timer plus honest, time-based phase guesses — this is what's
  // actually happening in the background: convert the file to Sheets
  // format (the slow part, usually a few seconds), then parse and
  // write. A person watching a number tick up knows it's alive; a
  // static sentence gives them nothing to go on.
  const startTime = Date.now();
  clearInterval(_scheduleUploadTimerInterval);
  let _scheduleUploadDone = false;
  const updateStatus = () => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    let phase = 'Converting file format…';
    if (elapsed > 8)  phase = 'Reading student schedules…';
    if (elapsed > 15) phase = 'Still working — larger files can take a bit longer…';
    if (elapsed > 30) phase = 'Still going — if this passes a minute, the upload may have stalled; try again if so.';
    status.textContent = `${phase} (${elapsed}s)`;
  };
  updateStatus();
  _scheduleUploadTimerInterval = setInterval(updateStatus, 1000);

  // Hang-recovery, same reasoning as the dashboard Refresh button fix:
  // if google.script.run genuinely never calls back (network stall,
  // Apps Script silently dropping the response), there needs to be a
  // way out besides refreshing the whole page.
  setTimeout(() => {
    if (_scheduleUploadDone) return;
    clearInterval(_scheduleUploadTimerInterval);
    btn.textContent = 'Upload Schedule';
    btn.disabled    = false;
    status.textContent = "✕ This is taking much longer than expected and may have stalled. If you try again and it turns out this upload actually did go through in the background, re-uploading the same file/week is safe — it'll just update the same week's data again.";
    status.className   = 'schedule-status err';
  }, 90000);

  function finish() {
    _scheduleUploadDone = true;
    clearInterval(_scheduleUploadTimerInterval);
  }

  google.script.run
    .withSuccessHandler(function(result) {
      finish();
      btn.textContent = 'Upload Schedule';
      if (result.error) {
        status.textContent = '✕ ' + result.error;
        status.className   = 'schedule-status err';
        btn.disabled       = false;
        return;
      }

      const addedList   = result.added   || [];
      const droppedList = result.dropped || [];
      const hasDiff     = addedList.length > 0 || droppedList.length > 0;

      const diffHtml = hasDiff ? `
        <div style="margin-top:10px;font-size:12px;">
          ${addedList.length ? `<div style="margin-bottom:4px;"><span style="color:var(--ok);font-weight:700;">+ ${addedList.length} added:</span> ${esc(addedList.map(s => s.name || s.id).join(', '))}</div>` : ''}
          ${droppedList.length ? `<div><span style="color:var(--high);font-weight:700;">− ${droppedList.length} dropped:</span> ${esc(droppedList.map(s => s.name || s.id).join(', '))}</div>` : ''}
        </div>` : '';

      if ((result.skippedCount && result.skippedCount > 0) || hasDiff) {
        const skippedNames = (result.skipped || [])
          .map(s => s.name ? s.name : (s.sheet ? 'Tab: ' + s.sheet : 'Unknown'))
          .join(', ');
        status.innerHTML = `
          <div style="color:var(--ok);margin-bottom:6px;">✓ Saved ${result.studentCount} student${result.studentCount !== 1 ? 's' : ''} for ${esc(result.weekLabel)}</div>
          ${result.skippedCount ? `<div style="color:var(--warn);font-size:12px;">${_warnGlyph} ${result.skippedCount} skipped: ${esc(skippedNames)}</div>` : ''}
          ${diffHtml}
          <div style="margin-top:10px;">
            <button class="btn-override" onclick="closeScheduleUpload()" style="max-width:160px;">Close</button>
          </div>`;
        status.className = 'schedule-status';
        // Don't auto-close so staff can read the skipped/added/dropped list
      } else {
        status.textContent = `✓ Saved ${result.studentCount} student${result.studentCount !== 1 ? 's' : ''} for ${result.weekLabel}`;
        status.className   = 'schedule-status ok';
        setTimeout(() => closeScheduleUpload(), 1800);
      }
    })
    .withFailureHandler(function(err) {
      finish();
      btn.textContent    = 'Upload Schedule';
      btn.disabled       = false;
      status.textContent = '✕ Upload failed: ' + (err?.message || 'Please try again.');
      status.className   = 'schedule-status err';
    })
    .saveWeeklySchedule(base64, _currentRole, document.getElementById('scheduleWeekPicker').value);
}

// Reads every selected file in parallel, converting each to base64 —
// same conversion the single-file path uses, just done for N files
// instead of one. Preview rows appear once ALL files have finished
// reading, each with its own week picker defaulted blank (deliberate —
// there's no reliable way to guess which historical week a given file
// belongs to, so this forces a real choice rather than a guess).
function onBulkScheduleFilesSelected(input) {
  const files = Array.from(input.files || []);
  if (!files.length) return;

  const status = document.getElementById('bulkScheduleUploadStatus');
  status.textContent = `Reading ${files.length} file${files.length !== 1 ? 's' : ''}…`;
  status.className = 'schedule-status';

  const badExt = files.find(f => !f.name.toLowerCase().endsWith('.xlsx') && !f.name.toLowerCase().endsWith('.xls'));
  if (badExt) {
    status.textContent = `✕ "${badExt.name}" isn't an .xls or .xlsx file.`;
    status.className = 'schedule-status err';
    return;
  }

  const readOne = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const bytes = new Uint8Array(e.target.result);
        let binary = '';
        const chunk = 8192;
        for (let i = 0; i < bytes.length; i += chunk) {
          binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
        }
        resolve({ fileName: file.name, base64: btoa(binary), weekLabelKey: '' });
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error('Could not read ' + file.name));
    reader.readAsArrayBuffer(file);
  });

  Promise.all(files.map(readOne))
    .then(results => {
      _bulkScheduleFiles = results;
      document.getElementById('bulkSchedulePreviewList').innerHTML = results.map((f, i) => `
        <div style="display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:8px 12px;">
          <div style="flex:1;font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(f.fileName)}</div>
          <input
            type="date"
            onchange="onBulkScheduleWeekPicked(${i}, this)"
            style="background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--font);font-size:12.5px;padding:5px 8px;"
          >
        </div>`).join('');
      status.textContent = `${results.length} file${results.length !== 1 ? 's' : ''} loaded — pick a week for each before uploading.`;
      status.className = 'schedule-status ok';
      _refreshBulkScheduleUploadReadiness_();
    })
    .catch(err => {
      status.textContent = '✕ ' + err.message;
      status.className = 'schedule-status err';
    });
}

// Snaps the picked date to that week's Monday, same as the single-file
// modal, and records it against the right file by index.
function onBulkScheduleWeekPicked(index, inputEl) {
  if (!inputEl.value) return;
  const [y, m, d] = inputEl.value.split('-').map(Number);
  const monday = _mondayOfWeek_(new Date(y, m - 1, d));
  const mondayStr = _dateToInputValue_(monday);
  inputEl.value = mondayStr;
  if (_bulkScheduleFiles[index]) _bulkScheduleFiles[index].weekLabelKey = mondayStr;
  _refreshBulkScheduleUploadReadiness_();
}

// Enables the upload button only once every loaded file has a week
// picked — half-assigned batches are more likely to be a mistake than
// intentional, so this doesn't let a partial batch through silently.
function _refreshBulkScheduleUploadReadiness_() {
  const btn = document.getElementById('bulkScheduleUploadBtn');
  const allPicked = _bulkScheduleFiles.length > 0 && _bulkScheduleFiles.every(f => f.weekLabelKey);
  btn.disabled = !allPicked;
}

// Wraps the callback-based google.script.run API in a Promise so the
// chunked upload below can just await each call instead of nesting
// success/failure handlers per chunk.
function _runServerCall(fnName, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      [fnName](...args);
  });
}

// Sends files in small groups instead of one giant call — two real
// platform ceilings made "send everything at once" unsafe: Apps
// Script's hard execution-time limit per call (6 min on a personal
// account), and a payload-size limit on what google.script.run can
// send in a single request. Base64-encoded .xlsx files add up fast
// (about 33% larger than the raw file), and a batch of just 4 hit
// that ceiling in testing. Chunking keeps every single call small and
// fast regardless of how many files you select in total.
const BULK_SCHEDULE_CHUNK_SIZE = 2;

async function confirmBulkScheduleUpload() {
  if (!_bulkScheduleFiles.length || !_bulkScheduleFiles.every(f => f.weekLabelKey)) return;

  const btn    = document.getElementById('bulkScheduleUploadBtn');
  const status = document.getElementById('bulkScheduleUploadStatus');
  btn.disabled    = true;
  btn.textContent = 'Uploading…';

  const chunks = [];
  for (let i = 0; i < _bulkScheduleFiles.length; i += BULK_SCHEDULE_CHUNK_SIZE) {
    chunks.push(_bulkScheduleFiles.slice(i, i + BULK_SCHEDULE_CHUNK_SIZE));
  }

  const allResults = [];
  let anyChunkFailedOutright = false;

  for (let c = 0; c < chunks.length; c++) {
    status.textContent = `Uploading batch ${c + 1} of ${chunks.length} (${chunks[c].length} file${chunks[c].length !== 1 ? 's' : ''})…`;
    status.className = 'schedule-status';

    try {
      const result = await _runServerCall(
        'saveWeeklySchedulesBulk',
        chunks[c].map(f => ({ base64Data: f.base64, weekLabelKeyOverride: f.weekLabelKey })),
        _currentRole
      );
      if (result && result.results) {
        allResults.push(...result.results);
      } else {
        anyChunkFailedOutright = true;
        chunks[c].forEach(f => allResults.push({ success: false, weekLabelKeyOverride: f.weekLabelKey, error: (result && result.error) || 'Unknown error for this batch.' }));
      }
    } catch (err) {
      anyChunkFailedOutright = true;
      chunks[c].forEach(f => allResults.push({ success: false, weekLabelKeyOverride: f.weekLabelKey, error: (err && err.message) || 'This batch failed to send.' }));
    }
  }

  btn.textContent = 'Upload All';
  btn.disabled    = false;

  const succeeded = allResults.filter(r => r.success).length;
  const lines = allResults.map(r => {
    const label = r.weekLabelKeyOverride || '(unknown week)';
    return r.success
      ? `<div style="color:var(--ok);">✓ ${esc(label)} — ${r.result && r.result.studentCount || 0} students</div>`
      : `<div style="color:var(--high);">✕ ${esc(label)} — ${esc(r.error || 'failed')}</div>`;
  }).join('');

  status.innerHTML = `
    <div style="margin-bottom:6px;">${succeeded} of ${allResults.length} uploaded successfully${anyChunkFailedOutright ? ' (one or more batches failed to send entirely — see below)' : ''}.</div>
    <div style="display:flex;flex-direction:column;gap:2px;font-size:12px;">${lines}</div>
    <div style="margin-top:10px;"><button class="btn-override" onclick="closeBulkScheduleUpload()" style="max-width:160px;">Close</button></div>`;
  status.className = 'schedule-status';
}

const ROSTER_TRADE_COURSES    = ["BCT","Carpentry","CNA","Culinary Arts","Pharmacy Tech",
                                  "Security& Protective","Security&Protect 2","OTP-MFR","OTP/ACT"];
const ROSTER_ACADEMIC_COURSES = ["HSE/HSD1","HSD 2","HSD3"];

  document.getElementById('rosterFileInput').value = '';

function _rosterIsMatch(courseName, list) {
  const lower = courseName.toLowerCase();
  return list.some(kw => lower.includes(kw.toLowerCase()));
}

function _rosterSplitIntoBlocks(rows) {
  const blocks = [];
  let current = [];
  rows.forEach(row => {
    const isBlank = !row || row.every(c => c === null || c === undefined || String(c).trim() === "");
    if (isBlank) {
      if (current.length > 0) { blocks.push(current); current = []; }
    } else {
      current.push(row);
    }
  });
  if (current.length > 0) blocks.push(current);
  return blocks;
}

function _rosterParseStudentBlock(block) {
  if (!block || block.length === 0) return null;

  const headerCell = block[0][0] ? String(block[0][0]) : "";
  const lines = headerCell.split("\n").map(l => l.trim()).filter(l => l !== "");
  if (lines.length < 2) return null;

  const studentName = lines[0].replace(/\s+/g, " ").trim();
  const idMatch     = lines[1].match(/\d{5,}/);
  if (!idMatch) return null;
  const studentId   = idMatch[0];

  const latestStatus = {};
  block.slice(2).forEach(row => {
    const courseName = row[1] ? String(row[1]).trim() : "";
    const status     = row[6] ? String(row[6]).trim() : "";
    if (!courseName || !status) return;
    if (_rosterIsMatch(courseName, ROSTER_TRADE_COURSES) || _rosterIsMatch(courseName, ROSTER_ACADEMIC_COURSES)) {
      latestStatus[courseName] = status;
    }
  });

  let tradeFound = false, tradeComplete = true;
  let academicFound = false, academicComplete = true;

  Object.entries(latestStatus).forEach(([courseName, status]) => {
    const inProgress = status === "Currently Enrolled";
    if (_rosterIsMatch(courseName, ROSTER_TRADE_COURSES)) {
      tradeFound = true;
      if (inProgress) tradeComplete = false;
    }
    if (_rosterIsMatch(courseName, ROSTER_ACADEMIC_COURSES)) {
      academicFound = true;
      if (inProgress) academicComplete = false;
    }
  });

  return {
    id:               studentId,
    name:             studentName,
    tradeComplete:    (tradeFound    && tradeComplete)    ? "Complete" : "",
    academicComplete: (academicFound && academicComplete) ? "Complete" : ""
  };
}

function handleRosterUpload() {
  const file = document.getElementById("rosterFileInput").files[0];
  const status = document.getElementById('rosterUploadStatus');
  const log    = document.getElementById('rosterUploadLog');
  const btn    = document.getElementById('rosterUploadBtn');

  if (!file) { status.textContent = "Please select a file."; status.className = 'schedule-status err'; return; }

  status.textContent = "Reading file…";
  status.className   = 'schedule-status';
  log.textContent    = '';
  btn.disabled = true;

  const reader = new FileReader();
  reader.onerror = () => { status.textContent = "FileReader failed."; status.className = 'schedule-status err'; btn.disabled = false; };

  reader.onload = function(e) {
    try {
      const data     = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: "array", cellDates: false });
      const sheet    = workbook.Sheets[workbook.SheetNames[0]];
      const rows     = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null, blankrows: true });

      const dataRows = rows.slice(5);
      const blocks   = _rosterSplitIntoBlocks(dataRows);
      const results  = [];

      blocks.forEach(block => {
        const student = _rosterParseStudentBlock(block);
        if (student) {
          results.push(student);
          log.textContent += `✓ ${student.name} | Trade: ${student.tradeComplete || '—'} | Academic: ${student.academicComplete || '—'}\n`;
        }
      });
      log.scrollTop = log.scrollHeight;

      status.textContent = `Parsed ${results.length} students. Writing to sheet…`;

      google.script.run
        .withSuccessHandler(result => {
          btn.disabled = false;
          status.textContent = `:) Done! ${result.added} added, ${result.updated} updated.`;
          status.className   = 'schedule-status ok';
          showToast(`Roster verified — ${result.added} added, ${result.updated} updated.`);
          refreshData();
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          status.textContent = "Error: " + (err?.message || 'Save failed — please try again.');
          status.className   = 'schedule-status err';
        })
        .writeResults(results);

    } catch(err) {
      btn.disabled = false;
      status.textContent = "Error: " + err.message;
      status.className   = 'schedule-status err';
      log.textContent += "Exception: " + err.stack;
    }
  };

  reader.readAsArrayBuffer(file);
}

function esc(str) {

// Plain-text version of an HTML snippet, for use in title="" tooltips (title attributes can't render markup, only plain text).
function _stripTags(html) {
  return String(html ?? '').replace(/<[^>]*>/g, '').trim();

function pct(v)    { return v !== null && v !== undefined ? (+v).toFixed(1) + '%' : '—'; }
function pctStr(v) {
  if (v === null || v === undefined || v === '') return '—';
  const n = parseFloat(String(v).replace('%', ''));
  return isNaN(n) ? '—' : n.toFixed(1) + '%';
}
function num(v) { return v !== null && v !== undefined ? (+v).toFixed(1) : '—'; }

// Single source of truth for "This Week" display, used everywhere
// it shows up (table, cards, Overview, CSV export, print doc, Action
// View) instead of duplicating this branching in each spot — that
// duplication is exactly how the old 'NWH' ambiguity spread
// everywhere in the first place. Returns { label, kind } — kind is
// for callers that want to color/style differently per state.
function computeThisWeekDisplay_(p) {
  // Top-level fields, computed for EVERY student regardless of
  // whether they have academic course data — NOT p.academic.thisWeek*,
  // which only exists when p.academic itself exists, silently
  // skipping trade/unassigned detection for exactly the pure-trades
  // students it matters most for.
  const assigned = p.thisWeekAssignedHours;
  const source   = p.thisWeekSource;
  const workedHours = p.thisWeekWorkedHours;
  if (assigned === undefined && source === undefined) return { label: '—', kind: 'none' };

  // Prefer the REAL schedule-derived trade flag (this week's actual
  // schedule, or a majority vote across recent real weeks) — only
  // fall back to the static hasTrades/tradeComplete program flags
  // when the schedule-derived value is unknown (null), since those
  // don't reflect what a SPECIFIC week's schedule shows (e.g. MyPace
  // 1/2, the pre-assignment period, isn't trade time even for a
  // student who'll eventually be trade-assigned).
  const hasTradeAssignment = p.thisWeekHasTrade !== null && p.thisWeekHasTrade !== undefined
    ? p.thisWeekHasTrade
    : !!(p.hasTrades || p.tradeComplete);
  const isRealOrPattern = source === 'real_upload' || source === 'fallback_pattern';

  // Confirmed (not guessed) zero academic hours this week — either a
  // real trade week, or if there's no trade assignment at all, this
  // is a student with nothing assigned yet (typically brand new).
  if (assigned === 0 && isRealOrPattern) {
    return hasTradeAssignment
      ? { label: 'In Trades', kind: 'trades' }
      : { label: 'Currently Unassigned Hours', kind: 'unassigned' };
  }

  // Genuinely has academic hours assigned this week (real schedule
  // confirms it), but no time log has been pasted yet. Before
  // Wednesday, this is just blank — nothing wrong, just not time yet
  // to expect a number. From Wednesday on (hours logged Mon-Wed),
  // treat it as an honest 0 if still nothing's been logged.
  if (workedHours === null && assigned > 0 && isRealOrPattern) {
    const day = new Date().getDay(); // 0 Sun, 1 Mon, 2 Tue, 3 Wed...
    const pastWednesdayGrace = day === 0 || day >= 3;
    return pastWednesdayGrace
      ? { label: '0.0 h', kind: 'worked-zero' }
      : { label: '—', kind: 'none' };
  }

  if (source === 'no_data_yet') return { label: 'Not Uploaded Yet', kind: 'no_data' };
  if (source === 'uncertain')   return { label: 'Needs Review',     kind: 'uncertain' };

  if (workedHours !== null && workedHours !== undefined) return { label: (+workedHours).toFixed(1) + ' h', kind: 'worked' };
  // Nothing above matched — no recognized source, no logged hours.
  // Usually means this week's schedule genuinely hasn't landed for
  // this student and there's no history to fall back on either.
  return { label: 'No Current Schedule', kind: 'no_current_schedule' };
}

function formatTimestamp(iso) {
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' })
      + ', ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  } catch(e) { return '—'; }
}

function copyId(event, id) {
  event.stopPropagation();
  const el   = event.currentTarget;
  const orig = el.textContent;

  function _showCopied() {
    el.textContent = 'Copied!';
    el.classList.add('copied');
    setTimeout(() => { el.textContent = orig; el.classList.remove('copied'); }, 1500);
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(id).then(_showCopied).catch(() => {
      // Clipboard API failed (e.g. non-HTTPS); fall back
      const ta = document.createElement('textarea');
      ta.value = id; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      _showCopied();
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = id; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    _showCopied();
  }
}

async function saveQuickEdit() {
  if (!_qeStudentId) return;
  const id        = _qeStudentId;
  const acStatus  = document.getElementById('qeAcademicStatus').value;
  const trStatus  = document.getElementById('qeTradeStatus').value;

  btn.disabled = true; btn.textContent = 'Saving…';
  statusEl.textContent = ''; statusEl.className = 'qe-status';

  if (acStatus)  saves.push(() => new Promise(res => google.script.run.withSuccessHandler(res).withFailureHandler(res).setOverride(id, 'academic_status', acStatus, '', 'staff')));

  if (tradeName) saves.push(() => new Promise(res => google.script.run.withSuccessHandler(res).withFailureHandler(res).setOverride(id, 'trade_name',      tradeName, '', 'staff')));
  if (noteText)  saves.push(() => new Promise(res => google.script.run.withSuccessHandler(res).withFailureHandler(res).addStudentNote(id, noteText, _currentEmployeeId, _currentRole)));

const HISTORY_TYPE_LABELS = {
  academic_status: { label: 'Academic status' },
  trade_status:    { label: 'Trade status'    },
  trade_name:      { label: 'Trade name'      },
  risk_level:      { label: 'Risk level'      },

function renderHistory(changes) {
  document.getElementById('historyLoading').style.display = 'none';
  if (!changes || !changes.length) {
    document.getElementById('historyEmpty').classList.remove('hidden');
    return;
  }

  const list = document.getElementById('historyList');
  list.innerHTML = changes.map(c => {
    const meta    = HISTORY_TYPE_LABELS[c.type] || { label: c.type };
    const profile = allProfiles.find(x => x.id === c.studentId);
    const name    = profile ? profile.displayName : c.studentId;
    const when    = c.date ? formatTimestamp(c.date) : '—';
    const who     = c.setBy || 'staff';

    let valueDisplay = esc(c.value);
    if (c.type === 'note' && c.value && c.value.length > 60) valueDisplay = esc(c.value.slice(0, 60)) + '…';

    const canRevert = c.type !== 'note' && c.type !== 'staff_note';
    const initials  = name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();

    return `<div class="history-item">
      <div class="history-icon">${initials}</div>
      <div class="history-detail">
        <div class="history-name">${esc(name)}</div>
        <div class="history-change">${esc(meta.label)}${c.value ? ` → <strong>${valueDisplay}</strong>` : ''}</div>
        <div class="history-meta">by ${esc(who)} · ${when}</div>
      </div>
      ${canRevert ? `<button class="btn-revert" onclick="confirmRevert(this,'${esc(c.studentId)}','${esc(c.type)}',${c.rowIndex})">Undo</button>` : ''}
    </div>`;
  }).join('');
}

function confirmRevert(btn, studentId, type, rowIndex) {
  themedConfirm(
    `The override will be removed and the dashboard will recompute that field.`,
    { title: `Undo this "${type}" change?`, okLabel: 'Undo', danger: true }
  ).then(ok => {
    if (!ok) return;
    btn.disabled = true; btn.textContent = '…';
    google.script.run
      .withSuccessHandler(() => {
        const p = allProfiles.find(x => x.id === studentId);
        if (p) {
          if (type === 'academic_status') p.academicStatusOverride = null;
          if (type === 'trade_status')    p.tradeStatusOverride    = null;
          if (type === 'trade_name')      p.tradeNameOverride      = null;

      .revertChange(studentId, type, rowIndex, _currentRole);
  });
}

let _customColumns = [];               // ordered array of column names

function _loadCustomColumns() {

function promptAddCustomColumn() {
  const name = (prompt('Name for the new column:') || '').trim();
  if (!name) return;
  if (_customColumns.some(c => c.toLowerCase() === name.toLowerCase())) {
    alert('A column named "' + name + '" already exists.');
    return;
  }
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result || result.success === false) { alert(result && result.error ? result.error : 'Failed to add column.'); return; }
      _customColumns.push(result.columnName);
      _renderCustomColumnHeaders();
      applyFilters();
    })
    .withFailureHandler(function(err) { alert(err && err.message ? err.message : 'Failed to add column.'); })
    .addCustomColumn(name, _currentRole);

function confirmRemoveCustomColumn(name) {
  if (!confirm('Remove the "' + name + '" column and all its values for every student? This cannot be undone.')) return;
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result || result.success === false) { alert(result && result.error ? result.error : 'Failed to remove column.'); return; }
      _customColumns = _customColumns.filter(c => c.toLowerCase() !== name.toLowerCase());
      Object.keys(_customColumnValuesByStudent).forEach(sid => { delete _customColumnValuesByStudent[sid][name]; });
      _renderCustomColumnHeaders();
      applyFilters();
    })
    .withFailureHandler(function(err) { alert(err && err.message ? err.message : 'Failed to remove column.'); })
    .removeCustomColumn(name, _currentRole);
}

const WT_STEPS = [
  { title: 'Welcome', body: 'This is the student progress dashboard for Tulsa Job Corps. It pulls from your academic, trades, and intervention data automatically. Here\'s a quick look at the four things you\'ll use most.', target: null, position: 'center' },
  { title: 'Start with the red ones', body: 'Students marked Needs Attention have the highest risk scores based on academic pace, trade progress, and WIR flags. Check this filter first thing each morning.', target: '[data-risk="HIGH"]', position: 'below' },
  { title: 'Action view cuts through the noise', body: 'Switch to Action view when you want students grouped by what actually needs doing — critical interventions, graduation deadlines coming up, students with no hours this week.', target: '#btnActionView', position: 'below' },
  { title: 'Edit without opening the full record', body: 'The Edit button on each row lets you update a student\'s program, trade, or leave a note in a few seconds. You don\'t need to open the full detail view for quick changes.', target: '.btn-quick-edit', position: 'left' },
  { title: 'You\'re set', body: 'Use the filter chips to narrow the list. The menu in the top right has exports, merge tools, and change history. If something looks wrong on a student record, the Edit button is your first stop.', target: null, position: 'center' },
];
let _wtStep = 0;

function startWalkthrough() { _wtStep = 0; document.getElementById('wtBackdrop').classList.add('active'); _renderWtStep(); }

function skipWalkthrough() {
  document.getElementById('wtBackdrop').classList.remove('active');
  document.getElementById('wtSpotlight').style.display = 'none';
  document.getElementById('wtTooltip').style.display   = 'none';
  try {
    const key = 'dashWalkthroughDone_' + (_currentEmployeeId || 'anon');
    localStorage.setItem(key, '1');
  } catch(e) {}
}

function walkthroughNext() {
  _wtStep++;
  if (_wtStep >= WT_STEPS.length) { skipWalkthrough(); return; }
  _renderWtStep();
}

function _renderWtStep() {
  const step      = WT_STEPS[_wtStep];
  const spotlight = document.getElementById('wtSpotlight');
  const tooltip   = document.getElementById('wtTooltip');
  const isLast    = _wtStep === WT_STEPS.length - 1;

  document.getElementById('wtDots').innerHTML = WT_STEPS.map((_, i) =>
    `<div class="wt-dot ${i === _wtStep ? 'active' : ''}"></div>`).join('');
  document.getElementById('wtStepLabel').textContent = `Step ${_wtStep + 1} of ${WT_STEPS.length}`;
  document.getElementById('wtTitle').textContent     = step.title;
  document.getElementById('wtBody').textContent      = step.body;
  document.getElementById('wtNextBtn').textContent   = isLast ? 'Done' : 'Next →';

  if (step.target) {
    const el = document.querySelector(step.target);
    if (el) {
      const r = el.getBoundingClientRect(); const pad = 6;
      spotlight.style.display = 'block';
      spotlight.style.top     = (r.top    - pad) + 'px';
      spotlight.style.left    = (r.left   - pad) + 'px';
      spotlight.style.width   = (r.width  + pad * 2) + 'px';
      spotlight.style.height  = (r.height + pad * 2) + 'px';
      tooltip.style.display = 'block';
      tooltip.style.transform = '';
      const TW = 300, TH = 200, vw = window.innerWidth, vh = window.innerHeight;
      if (step.position === 'below')     { tooltip.style.top = Math.min(r.bottom + pad + 12, vh - TH - 16) + 'px'; tooltip.style.left = Math.min(Math.max(r.left, 16), vw - TW - 16) + 'px'; }
      else if (step.position === 'left') { tooltip.style.top = Math.max(r.top, 16) + 'px'; tooltip.style.left = Math.max(r.left - TW - 20, 16) + 'px'; }
      else                               { tooltip.style.top = Math.min(r.bottom + 12, vh - TH - 16) + 'px'; tooltip.style.left = Math.min(Math.max(r.left, 16), vw - TW - 16) + 'px'; }
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return;
    }
  }
  spotlight.style.display = 'none';
  tooltip.style.display   = 'block';
  tooltip.style.top = '50%'; tooltip.style.left = '50%'; tooltip.style.transform = 'translate(-50%, -50%)';
}

function _maybeStartWalkthrough() {
  try {
    const key = 'dashWalkthroughDone_' + (_currentEmployeeId || 'anon');
    if (localStorage.getItem(key)) return;
  } catch(e) { return; }
  setTimeout(startWalkthrough, 800);
}

function renderActionView(profiles) {
  const container = document.getElementById('actionGroups');
  const dateEl    = document.getElementById('actionViewDate');
  if (!container) return;
  if (dateEl) dateEl.textContent = new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });

  const groups = [
    { key: 'grad_critical', icon: ICONS.blocked,     cls: 'critical', title: 'Over Program Limit',               sub: 'Graduation window has passed — immediate action required',       test: p => String(p.intervention?.gradGap || '').includes('over limit') },
    { key: 'wir_critical',  icon: ICONS.alertTri,    cls: 'critical', title: 'Critical Intervention This Week',  sub: 'Program-deadline flag fired in the latest WIR — the most severe case the engine flags', test: p => String(p.intervention?.issueTags || p.intervention?.detectedPatterns || '').includes('PROGRAM_DEADLINE_CRITICAL') },
    { key: 'grad_watch',    icon: ICONS.calendar,    cls: 'high',     title: 'Graduation Deadline — Under 60 Days', sub: 'Students approaching the two-year program limit',             test: p => { const g = String(p.intervention?.gradGap || ''); if (g.includes('over limit')) return false; if (g.startsWith('🟡')) return true; const m = g.match(/(\d+)d left/); return !!m && parseInt(m[1], 10) <= 60; } },
    { key: 'wir_high',      icon: ICONS.flag,        cls: 'high',     title: 'High Intervention Priority',        sub: 'Admin priority is HIGH in the latest WIR',                      test: p => { const pri = (p.intervention?.adminPriority || '').toUpperCase(); const critg = String(p.intervention?.gradGap || ''); return pri === 'HIGH' && !critg.includes('over limit'); } },
    { key: 'followup',      icon: ICONS.checkCircle, cls: 'follow',   title: 'Follow-Up Due',                     sub: 'WIR follow-up date is today or in the past',                    test: p => { if (!p.intervention?.followUp) return false; const d = new Date(p.intervention.followUp); if (isNaN(d.getTime())) return false; const t = new Date(); t.setHours(0,0,0,0); return d <= t; } },

    { key: 'pacing_uncertain', icon: ICONS.alertTri, cls: 'medium',   title: 'Pacing Needs Review',                sub: 'Last 4 real weeks don\'t agree on a pattern — no schedule upload this week, worth a manual check', test: p => p.thisWeekSource === 'uncertain' && !p.thisWeekHasTrade },
    { key: 'pacing_estimated', icon: ICONS.clock,    cls: 'follow',   title: 'Pacing From Pattern, Not This Week\'s Upload', sub: 'No schedule uploaded yet for the current week — this week\'s hours are estimated from recent history', test: p => p.thisWeekSource === 'fallback_pattern' && !p.thisWeekHasTrade },
    { key: 'stale',         icon: ICONS.noData,      cls: 'medium',   title: 'No Recent Progress Updates',        sub: 'Progress % unchanged for 3+ weeks — possible data gap',          test: p => p.isStale === true },
  ];

  const placed = new Set();
  container.innerHTML = groups.map((g, groupIdx) => {
    const members = profiles.filter(p => { if (placed.has(p.id)) return false; return g.test(p); });
    members.forEach(p => placed.add(p.id));
    const bodyId  = 'ag-body-' + groupIdx;
    const isEmpty = members.length === 0;

    const rows = isEmpty
      ? `<div class="action-empty">No students in this group right now.</div>`
      : members.map(p => {

          <div class="ag-count ${g.cls}">${members.length}</div>

  }).join('');

function toggleActionGroup(header, bodyId) {

}

// 23. CSV export
function exportCSV() {
  const filtered = _getFilteredSorted();
  const headers  = ['Student','ID','Risk Level','Risk Score','Stale','Academic Type','Academic %','Pace','Days to Grad','This Week Hrs','Trade Name','Trade %','Trade Status','Days to ETAR','WIR Priority','WIR Urgency','Has Intervention','Total Time Hrs','Last Modified','Notes Count','No Data'];
  const csvRows  = [headers];

  filtered.forEach(p => {
    const effectiveTradeStatus = p.tradeStatusOverride || (p.tradeComplete ? 'COMPLETE' : p.hasTrades ? 'ACTIVE' : 'NOT_STARTED');
    const tradeName = p.tradeNameOverride || p.trades?.[0]?.tarName || (p.tradeComplete ? (p.completedTrades||[]).join('; ') : '');
    csvRows.push([
      p.displayName, p.academicId || '', p.risk.level, p.risk.score, p.isStale ? 'Yes' : 'No',
      p.academic?.type || '', p.academic?.percent ?? '', p.academic?.pace || '', p.academic?.daysToGrad ?? '',
      (p.academic ? computeThisWeekDisplay_(p).label : ''),
      tradeName, p.trades?.[0]?.overallPct ?? (p.tradeComplete ? 100 : ''), effectiveTradeStatus,
      p.trades?.[0]?.daysToETAR ?? '', p.intervention?.adminPriority || '', p.intervention?.urgency || '',
      p.hasIntervention ? 'Yes' : 'No', p.time?.totalHours ?? '',
      p.lastModified ? formatTimestamp(p.lastModified) : '', (p.notes || []).length, p.mappingMissing ? 'Yes' : 'No',
    ]);
  });

  const csv  = csvRows.map(row => row.map(cell => { const s = String(cell ?? '').replace(/"/g,'""'); return s.includes(',') || s.includes('"') || s.includes('\n') ? `"${s}"` : s; }).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'students_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function saveNote(studentId) {
  const input = document.getElementById('noteInput');
  const text  = (input ? input.value : '').trim();
  if (!text) return;
  input.disabled = true;
  google.script.run
    .withSuccessHandler(() => {
      const flash = document.getElementById('noteSaved');
      if (flash) { flash.classList.add('show'); setTimeout(() => flash.classList.remove('show'), 2500); }
      const p = allProfiles.find(x => x.id === studentId);
      if (p) {
        if (!p.notes) p.notes = [];
        p.notes.unshift({ text, setBy: 'staff', date: new Date().toISOString() });
        currentModalProfile = p;
        openModal(studentId);
      }
    })
    .withFailureHandler(err => {
      const box = document.getElementById('noteError');
      if (box) { box.textContent = (err?.message || 'Save failed — try again.'); box.classList.add('show'); setTimeout(() => box.classList.remove('show'), 4000); }
      if (input) input.disabled = false;
    })
    .addStudentNote(studentId, text, _currentEmployeeId, _currentRole);
}

function deleteNote(studentId, noteTimestamp) {
  themedConfirm('This note will be permanently removed.', { title: 'Delete this note?', okLabel: 'Delete', danger: true }).then(ok => {
    if (!ok) return;
    google.script.run
      .withSuccessHandler(() => {
        const p = allProfiles.find(x => x.id === studentId);
        if (p && p.notes) {
          p.notes = p.notes.filter(n => (n.date || '') !== noteTimestamp);
          currentModalProfile = p;
          openModal(studentId);
        }
      })
      .withFailureHandler(err => showToast(err?.message || 'Delete failed — try again.', 'error'))
      .deleteStudentNote(studentId, noteTimestamp, _currentRole);
  });
}

function riskTrendIcon(trend) {

  if (trend === 'down')   return '<span class="trend-down"  title="Risk decreasing">▼</span>';

}

// 25. Filter presets (custom)
const BUILTIN_PRESETS = {
  '__high_risk':        { risk: 'HIGH', type: 'ALL',            search: '' },
  '__unmapped':         { risk: 'ALL',  type: 'UNMAPPED',       search: '' },
  '__has_wir':          { risk: 'ALL',  type: 'INTERVENTION',   search: '' },
  '__trade_complete':   { risk: 'ALL',  type: 'TRADE_COMPLETE', search: '' },
  '__high_risk_trades': { risk: 'HIGH', type: 'TRADES',         search: '' },
  '__stale':            { risk: 'ALL',  type: 'ALL',            search: '', staleOnly: true },
};

function applyPreset(value) {
  if (!value) return;
  document.getElementById('presetSelect').value = '';
  const preset = BUILTIN_PRESETS[value] || _loadCustomPresets()[value];
  if (!preset) return;
  const riskBtn = document.querySelector(`[data-risk="${preset.risk || 'ALL'}"]`);
  if (riskBtn) { document.querySelectorAll('[data-risk]').forEach(b => b.classList.remove('active')); riskBtn.classList.add('active'); activeRisk = preset.risk || 'ALL'; }
  const typeBtn = document.querySelector(`[data-type="${preset.type || 'ALL'}"]`);
  if (typeBtn) { document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active')); typeBtn.classList.add('active'); activeType = preset.type || 'ALL'; }
  const searchEl = document.getElementById('searchInput');
  if (searchEl) searchEl.value = preset.search || '';

  if (preset.staleOnly) {
    _staleOnlyActive = true;
  } else {
    _staleOnlyActive = false;
  }
  applyFilters();
}

let _staleOnlyActive = false;
let _bulkSearchIds = null; // Set of profile IDs, or null when bulk search isn't active

// activeType checks: HS, HISET, GED    → based on examProgram (Name Mapping "examProgram" column), NOT academic.type —
function _getFilteredSorted() {
  let results = allProfiles.filter(p => {
    if (_bulkSearchIds && !_bulkSearchIds.has(p.id)) return false;
    if (activeRisk !== 'ALL' && activeRisk !== 'NOT_STARTED' && p.risk.level !== activeRisk) return false;
    if (activeRisk === 'NOT_STARTED') {
      const notStarted = p.academicStatusOverride === 'NOT_STARTED' || p.tradeStatusOverride === 'NOT_STARTED';
      if (!notStarted) return false;
    }
    if (activeType !== 'ALL') {
      if (activeType === 'HS'             && (!p.academic || p.academic.type !== 'HS'))    return false;
      if (activeType === 'HISET'          && p.examProgram !== 'HiSET')                    return false;
      if (activeType === 'GED'            && p.examProgram !== 'GED')                      return false;
      if (activeType === 'TRADES'         && (p.hasAcademic || !p.hasTrades))              return false;
      if (activeType.startsWith('TRADE:') && !(p.trades || []).some(t => t.tarName === activeType.slice(6))) return false;
      if (activeType === 'INTERVENTION'   && !p.hasIntervention)                           return false;
      if (activeType === 'TRADE_COMPLETE' && !p.tradeComplete)                             return false;
      if (activeType === 'HS_COMPLETE'    && !p.hsComplete) return false;
      if (activeType === 'UNMAPPED'       && !p.mappingMissing)                            return false;
    }
    const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();
    if (search) {
      const hay = (p.displayName + ' ' + (p.academicId||'') + ' ' + (p.tradesId||'')).toLowerCase();
      if (!hay.includes(search)) return false;
    }

    if (_staleOnlyActive && !p.isStale) return false;

    // Counselor trade filter
    if (_activeCounselorTrades) {
      const tradeName = (
        p.tradeNameOverride ||
        p.trades?.[0]?.tarName ||
        (p.tradeComplete ? (p.completedTrades?.[0] || '') : '')
      ).toLowerCase();
      if (!_activeCounselorTrades.has(tradeName)) return false;
    }
    if (_activeHSDFilter) {
     const studentId = p.academicId || p.id || '';
     const effectiveHSD = p.hsdOverride || _hsdAssignments[studentId];
     if (effectiveHSD !== _activeHSDFilter) return false;
    }
    if (_activeSubjectFilter) {
      const studentId = p.academicId || p.id || '';
      const subjects = _subjectAssignments[studentId] || [];
      if (!subjects.some(s => _activeSubjectFilter.includes(s))) return false;
    }
    if (_activeTradeAutoFilter) {
      const tradeName = (p.tradeNameOverride || p.trades?.[0]?.tarName || '').toLowerCase();
      const wanted = _activeTradeAutoFilter.trade.toLowerCase();
      const isUSN  = tradeName === 'usn';
      if (tradeName !== wanted && !(_activeTradeAutoFilter.includeUSN && isUSN)) return false;
    }

    return true;
  });

  const sortKey = document.getElementById('sortSelect').value;
  results.sort((a, b) => {
    // Pinned students always float to the top, whatever the sort.
    const aPinned = _pinnedIds.has(a.id), bPinned = _pinnedIds.has(b.id);
    if (aPinned !== bPinned) return aPinned ? -1 : 1;

    switch (sortKey) {
      case 'risk': {
        const o = { HIGH:0, MEDIUM:1, LOW:2, UNKNOWN:3 };
        return (o[a.risk.level]||3) - (o[b.risk.level]||3);
      }
      case 'academicPct':  return (b.academic?.percent ?? -1) - (a.academic?.percent ?? -1);
      case 'tradesPct':    return (b.trades?.[0]?.overallPct ?? -1) - (a.trades?.[0]?.overallPct ?? -1);
      case 'tradeName': {
        const an = (a.tradeNameOverride || a.trades?.[0]?.tarName || (a.tradeComplete ? (a.completedTrades||[])[0] : '') || '').toString();
        const bn = (b.tradeNameOverride || b.trades?.[0]?.tarName || (b.tradeComplete ? (b.completedTrades||[])[0] : '') || '').toString();
        if (!an && !bn) return a.displayName.localeCompare(b.displayName);
        if (!an) return 1; if (!bn) return -1;
        return an.localeCompare(bn) || a.displayName.localeCompare(b.displayName);
      }
      case 'daysLeft': return (a.academic?.daysToGrad ?? 9999) - (b.academic?.daysToGrad ?? 9999);
      default:         return a.displayName.localeCompare(b.displayName);
    }
  });

  return results;
}

function savePreset() {
  themedPrompt('Give this filter combination a name so you can reuse it later.', '', { title: 'Save preset' }).then(name => {
    if (!name) return;
    const key    = 'custom_' + Date.now();
    const preset = { name: name.trim(), risk: activeRisk, type: activeType, search: (document.getElementById('searchInput').value || '').trim() };
    const existing = _loadCustomPresets();
    existing[key] = preset;
    try { localStorage.setItem('dashPresets', JSON.stringify(existing)); } catch(e) {}
    _renderCustomPresets();
  });
}

function _loadCustomPresets() {
  try { return JSON.parse(localStorage.getItem('dashPresets') || '{}'); } catch(e) { return {}; }
}

function _renderCustomPresets() {
  const group = document.getElementById('customPresetsGroup');
  if (!group) return;
  const presets = _loadCustomPresets();
  const keys    = Object.keys(presets);
  group.innerHTML = keys.length
    ? keys.map(k => `<option value="${esc(k)}">${esc(presets[k].name)}</option>`).join('')
    : '<option disabled>No custom presets yet</option>';
}

function _wirePresetSelectListener() {
  const presetEl = document.getElementById('presetSelect');
  if (!presetEl) return;
  presetEl.addEventListener('change', function() {
    const val = this.value;
    if (!val || val.startsWith('__')) return;
    const presets = _loadCustomPresets();
    if (!presets[val]) return;
    applyPreset(val);
  });
}

// 26. Bulk selection + bulk actions
function toggleRowSelect(checkbox) {
  const id = checkbox.dataset.id;
  if (checkbox.checked) { selectedIds.add(id); checkbox.closest('tr').classList.add('row-selected'); }
  else                  { selectedIds.delete(id); checkbox.closest('tr').classList.remove('row-selected'); }
  updateBulkBar();
  const allChecks   = document.querySelectorAll('.row-check');
  const allChecked  = [...allChecks].every(c => c.checked);
  const someChecked = [...allChecks].some(c => c.checked);
  const selectAll   = document.getElementById('selectAll');
  if (selectAll) { selectAll.checked = allChecked; selectAll.indeterminate = someChecked && !allChecked; }
}

function toggleSelectAll(checkbox) {
  document.querySelectorAll('.row-check').forEach(c => {
    c.checked = checkbox.checked;
    const id = c.dataset.id;
    if (checkbox.checked) { selectedIds.add(id); c.closest('tr').classList.add('row-selected'); }
    else                  { selectedIds.delete(id); c.closest('tr').classList.remove('row-selected'); }
  });
  updateBulkBar();
}

function clearSelection() {
  selectedIds.clear();
  document.querySelectorAll('.row-check').forEach(c => { c.checked = false; c.closest('tr').classList.remove('row-selected'); });
  const sa = document.getElementById('selectAll');
  if (sa) { sa.checked = false; sa.indeterminate = false; }
  updateBulkBar();
}

function updateBulkBar() {
  const bar   = document.getElementById('bulkBar');
  const count = document.getElementById('bulkCount');
  if (!bar) return;
  if (selectedIds.size >= 2) { bar.classList.remove('hidden'); count.textContent = `${selectedIds.size} students selected`; }
  else                       { bar.classList.add('hidden'); }
}

const COL_VISIBILITY_KEYS = {
  risk: 'col-risk', status: 'col-status', academicPct: 'col-academic-pct',
  tradeName: 'col-trade-name', tradePct: 'col-trade-pct', thisWeek: 'col-thisweek',

  risk: true, status: true, academicPct: false,
  tradeName: true, tradePct: false, thisWeek: true,

function _applyColVisibility() {
  Object.entries(COL_VISIBILITY_KEYS).forEach(([key, cls]) => {
    document.querySelectorAll('.' + cls).forEach(el => el.classList.toggle('hidden-col', !_colVisibility[key]));
    const cb = document.getElementById('colToggle-' + key);
    if (cb) cb.checked = !!_colVisibility[key];
  });
  const anyShown = EXPANDABLE_COL_KEYS.some(k => _colVisibility[k]);
  const btn = document.getElementById('expandColsBtn');
  if (btn) { btn.textContent = anyShown ? '－' : '＋'; btn.classList.toggle('open', anyShown); btn.title = anyShown ? 'Hide extra columns' : 'Show more columns'; }
  try { localStorage.setItem('dashColVisibility', JSON.stringify(_colVisibility)); } catch(e) {}
}

function setColumnVisibility(key, visible) {
  _colVisibility[key] = visible;
  _applyColVisibility();
}

// The "+" button's original scope — only the 3 columns that were always hidden-by-default.
const EXPANDABLE_COL_KEYS = ['academicPct', 'tradePct', 'etar'];

function toggleExtraCols() {
  const anyShown = EXPANDABLE_COL_KEYS.some(k => _colVisibility[k]);
  const next = !anyShown;
  EXPANDABLE_COL_KEYS.forEach(k => _colVisibility[k] = next);
  _applyColVisibility();
}

function _restoreColumnVisibility() {
  try {
    const saved = localStorage.getItem('dashColVisibility');
    if (saved) {
      _colVisibility = Object.assign(_colVisibility, JSON.parse(saved));
    } else if (localStorage.getItem('dashColsExpanded')) {
      // Backward-compat with the old single-toggle preference.
      Object.keys(_colVisibility).forEach(k => _colVisibility[k] = true);
    }
  } catch(e) {}
  _applyColVisibility();
}

function setZoomLevel(level) {
  document.documentElement.classList.remove('zoom-sm', 'zoom-lg');
  if (level === 'sm' || level === 'lg') document.documentElement.classList.add('zoom-' + level);
  document.querySelectorAll('.zoom-control [data-zoom]').forEach(b => b.classList.toggle('active', b.dataset.zoom === level));
  try { localStorage.setItem('dashZoom', level); } catch(e) {}
}

function _restoreZoomLevel() {
  let level = 'md';
  try { level = localStorage.getItem('dashZoom') || 'md'; } catch(e) {}
  setZoomLevel(level);
}

function toggleDensity() {
  const isCompact = document.body.classList.toggle('density-compact');
  const cb = document.getElementById('densityCheckbox');
  if (cb) cb.checked = isCompact;
  try { localStorage.setItem('dashDensity', isCompact ? '1' : ''); } catch(e) {}
}

function _restoreDensity() {
  let isCompact = false;
  try { isCompact = localStorage.getItem('dashDensity') === '1'; } catch(e) {}
  if (isCompact) {
    document.body.classList.add('density-compact');
    const cb = document.getElementById('densityCheckbox');
    if (cb) cb.checked = true;
  }
}

async function confirmBulkNote() {
  const text = (document.getElementById('bulkNoteInput').value || '').trim();
  if (!text) return;

  const ids  = [...selectedIds];
  const prog = document.getElementById('bulkNoteProgress');
  prog.textContent = `Saving note for ${ids.length} students…`;

  google.script.run
    .withSuccessHandler(function(result) {
      prog.textContent = `✓ Note added to ${result.count} students.`;
      ids.forEach(id => {
        const p = allProfiles.find(x => x.id === id);
        if (p) {
          if (!p.notes) p.notes = [];
          p.notes.unshift({ text, setBy: _currentEmployeeId, date: new Date().toISOString() });
        }
      });
      applyFilters();
      setTimeout(() => {
        document.getElementById('bulkNoteModal').classList.add('hidden');
        clearSelection();
      }, 1500);
    })
    .withFailureHandler(function(err) {
      const msg = err?.message || 'Save failed — please try again.';
      prog.textContent = '';
      const box = document.getElementById('bulkNoteError');
      box.textContent = msg.includes('lock') || msg.includes('saving')
        ? 'Another change is in progress — wait a moment and try again.'
        : msg;
      box.classList.add('show');
    })
    .bulkAddNote(ids, text, _currentEmployeeId, _currentRole);
}

async function confirmBulkStatus() {
  const acStatus = document.getElementById('bulkAcademicStatus').value;
  const trStatus = document.getElementById('bulkTradeStatus').value;
  if (!acStatus && !trStatus) { showToast('Select at least one status to apply.', 'error'); return; }

  const ids  = [...selectedIds];
  const prog = document.getElementById('bulkStatusProgress');
  prog.textContent = `Applying to ${ids.length} students…`;

  google.script.run
    .withSuccessHandler(function(result) {
      prog.textContent = `✓ Applied to ${result.count} students.`;
      ids.forEach(id => {
        const p = allProfiles.find(x => x.id === id);
        if (p) {
          if (acStatus) p.academicStatusOverride = acStatus;
          if (trStatus) p.tradeStatusOverride    = trStatus;

      applyFilters();
      setTimeout(() => {
        document.getElementById('bulkStatusModal').classList.add('hidden');
        clearSelection();
      }, 1500);
    })
    .withFailureHandler(function(err) {
      const msg = err?.message || 'Save failed — please try again.';
      prog.textContent = '';
      const box = document.getElementById('bulkStatusError');
      box.textContent = msg.includes('lock') || msg.includes('saving')

}

// 27. Risk sparkline
function buildRiskSparkline(p) {
  const snaps = (p.progressSnapshots || []).filter(s => s.score !== null && s.score !== undefined && s.date).sort((a, b) => a.date < b.date ? -1 : 1);
  if (snaps.length < 2) return '';

  const W = 260, H = 72, PAD = { t: 8, r: 8, b: 20, l: 28 };
  const innerW = W - PAD.l - PAD.r, innerH = H - PAD.t - PAD.b;
  const scores = snaps.map(s => s.score);
  const minS   = Math.max(0,   Math.min(...scores) - 10);
  const maxS   = Math.min(100, Math.max(...scores) + 10);
  const range  = maxS - minS || 1;
  const xScale = i => PAD.l + (i / (snaps.length - 1)) * innerW;
  const yScale = s => PAD.t + innerH - ((s - minS) / range) * innerH;
  const points   = snaps.map((s, i) => `${xScale(i).toFixed(1)},${yScale(s.score).toFixed(1)}`);
  const path     = 'M' + points.join('L');
  const fillPath = path + `L${xScale(snaps.length-1).toFixed(1)},${(PAD.t+innerH).toFixed(1)}L${PAD.l.toFixed(1)},${(PAD.t+innerH).toFixed(1)}Z`;
  const latest    = snaps[snaps.length - 1].score;
  const lineColor = latest >= 60 ? 'var(--high)' : latest >= 30 ? 'var(--medium)' : 'var(--low)';
  const fillColor = latest >= 60 ? 'color-mix(in srgb, var(--high) 12%, transparent)' : latest >= 30 ? 'color-mix(in srgb, var(--medium) 12%, transparent)' : 'color-mix(in srgb, var(--low) 12%, transparent)';
  const fmtDate   = d => { try { const dt = new Date(d); return (dt.getMonth()+1) + '/' + dt.getDate(); } catch(e) { return d; } };
  const dots      = snaps.map((s, i) => { const cx = xScale(i).toFixed(1), cy = yScale(s.score).toFixed(1), c = s.score >= 60 ? 'var(--high)' : s.score >= 30 ? 'var(--medium)' : 'var(--low)'; return `<circle cx="${cx}" cy="${cy}" r="3" fill="${c}" stroke="var(--bg3)" stroke-width="1.5"><title>${fmtDate(s.date)}: ${s.score}</title></circle>`; }).join('');
  const y30 = yScale(30).toFixed(1), y60 = yScale(60).toFixed(1);

  return `<div class="info-section sparkline-section">
    <h3>${ICONS.sparkline} Risk Score History <span style="font-weight:400;font-size:11px;color:var(--text-muted);">(${snaps.length} snapshots)</span></h3>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible;">
      ${minS < 60 && maxS > 60 ? `<line x1="${PAD.l}" y1="${y60}" x2="${W-PAD.r}" y2="${y60}" stroke="color-mix(in srgb, var(--high) 25%, transparent)" stroke-width="1" stroke-dasharray="3,3"/><text x="${PAD.l-4}" y="${y60}" text-anchor="end" font-size="8" fill="var(--text-muted)" dominant-baseline="middle">60</text>` : ''}
      ${minS < 30 && maxS > 30 ? `<line x1="${PAD.l}" y1="${y30}" x2="${W-PAD.r}" y2="${y30}" stroke="color-mix(in srgb, var(--medium) 25%, transparent)" stroke-width="1" stroke-dasharray="3,3"/><text x="${PAD.l-4}" y="${y30}" text-anchor="end" font-size="8" fill="var(--text-muted)" dominant-baseline="middle">30</text>` : ''}
      <path d="${fillPath}" fill="${fillColor}"/>
      <path d="${path}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      <text x="${PAD.l}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${fmtDate(snaps[0].date)}</text>
      <text x="${W-PAD.r}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${fmtDate(snaps[snaps.length-1].date)}</text>
      <text x="${xScale(snaps.length-1).toFixed(1)}" y="${(yScale(latest)-7).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="${lineColor}">${latest}</text>
    </svg>
  </div>`;
}

// 28. PRINT DOCUMENT BUILDERS
// Print output is a fully separate #printDoc element built from the same data already in memory (currentModalProfile, _transcriptData) —
function _escP(str) { return esc(str); } // alias for readability in this section

function _docId(studentId, kind) {
  const now = new Date();
  const stamp = now.getFullYear() +
    String(now.getMonth() + 1).padStart(2, '0') +
    String(now.getDate()).padStart(2, '0');
  return `DOC ${studentId || 'UNK'}-${kind}-${stamp}`;
}

function _fmtGeneratedStamp() {
  const now = new Date();
  const date = (now.getMonth() + 1) + '/' + now.getDate() + '/' + now.getFullYear();
  const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return `Generated ${date} \u00B7 ${time}`;
}

function _printMasthead(p, reportType, docKind) {
  const tags = [];
  if (p.academicId) tags.push('Academic ID ' + p.academicId);
  if (p.tradesId && p.tradesId !== p.academicId) tags.push('Trades ID ' + p.tradesId);
  if (p.academic && p.academic.type) tags.push(p.academic.type);
  if (p.hsComplete) tags.push('HS Complete');
  if (p.tradeComplete) tags.push('Trade Complete');

  return `
    <div class="masthead">
      <div class="masthead-top">
        <span class="masthead-org">Tulsa Job Corps Center &nbsp;&middot;&nbsp; U.S. Department of Labor / Employment and Training Administration</span>
        <span class="masthead-doc-id">${_escP(_docId(p.academicId || p.id, docKind))}</span>
      </div>
      <div class="masthead-body">
        <div>
          <div class="masthead-name">${_escP(p.displayName)}</div>
          <div class="masthead-tags">${tags.map(t => `<span>${_escP(t)}</span>`).join('')}</div>
        </div>
        <div class="masthead-right">
          <div class="report-type">${_escP(reportType)}</div>
          <div>${_fmtGeneratedStamp()}</div>
        </div>
      </div>
    </div>`;
}

function _printFooter() {
  return `
    <div class="doc-footer">
      <span>Tulsa Job Corps Center &middot; Student Progress Dashboard</span>
      <span>For internal staff use only &middot; Not for external distribution</span>
    </div>`;
}

function _dlRow(label, value) {
  return `<div class="dl-row"><span class="dl-label">${_escP(label)}</span><span class="dl-value">${_escP(value ?? '\u2014')}</span></div>`;
}

function _buildPrintOverviewDoc(p) {
  let html = _printMasthead(p, 'Student Overview Record', 'OV');

  if (p.academic) {
    const a = p.academic;
    const twdPrint = computeThisWeekDisplay_(p);
    const thisWk =
      twdPrint.kind === 'trades'      ? 'In trades this week'
      : twdPrint.kind === 'unassigned' ? twdPrint.label
      : twdPrint.kind === 'no_data'    ? 'Not uploaded yet this week'
      : twdPrint.kind === 'no_current_schedule' ? twdPrint.label
      : twdPrint.kind === 'uncertain'  ? 'Needs review'
      : twdPrint.label;
    const targetStatus = TargetDateEngine && a.targetDate
      ? (new Date(a.targetDate) < new Date() ? ' (overdue)' : '')
      : '';
    html += `
      <div class="section">
        <div class="section-title"><span>Academic</span></div>
        <div class="section-body">
          <div class="dl-grid">
            ${_dlRow('Type', a.type)}
            ${_dlRow('Progress', a.percent != null ? a.percent + '%' : null)}
            ${_dlRow('Total hours', num(a.hours) + ' h')}
            ${_dlRow('Start date', a.start)}
            ${_dlRow('Graduation date', a.graduation)}
            ${_dlRow('Days to graduation', a.daysToGrad != null ? a.daysToGrad + ' days' : null)}
            ${_dlRow('Credits remaining', a.credits)}
            ${_dlRow('Next milestone', a.nextMilestone)}
            ${_dlRow('Target date', a.targetDate ? a.targetDate + targetStatus : null)}
            ${_dlRow('This week', thisWk)}

          </div>
        </div>
      </div>`;
  }

  if (p.trades && p.trades.length) {
    html += `<div class="section"><div class="section-title"><span>Trades</span></div><div class="section-body">`;
    p.trades.forEach(t => {
      html += `<div style="font-weight:700;font-size:9.5px;margin-bottom:3px;">${_escP(t.tarName)}</div>
        <div class="dl-grid" style="margin-bottom:6px;">
          ${_dlRow('Overall %', pct(t.overallPct))}
