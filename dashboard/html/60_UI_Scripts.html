// 2. Themed dialog / toast helpers
function _ensureThemedDialogEl() {
  if (document.getElementById('themedDialog')) return;
  const el = document.createElement('div');
  el.id = 'themedDialog';
  el.className = 'modal-overlay hidden';
  el.innerHTML = `
    <div class="modal-box" style="max-width:420px;">
      <div class="modal-header">
        <h2 id="themedDialogTitle">Please confirm</h2>
      </div>
      <div class="modal-body" style="padding:20px 22px;">
        <p id="themedDialogMessage" style="font-size:13px;color:var(--text-soft);line-height:1.6;margin-bottom:4px;"></p>
        <div id="themedDialogInputWrap" class="override-row hidden" style="margin-top:12px;">
          <input type="text" id="themedDialogInput" style="background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--font);font-size:13px;padding:8px 10px;outline:none;width:100%;">
        </div>
        <div class="override-actions" style="margin-top:16px;">
          <button class="btn-override" id="themedDialogOk">Confirm</button>
          <button class="btn-override danger" id="themedDialogCancel">Cancel</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(el);
  el.addEventListener('click', e => { if (e.target === el) document.getElementById('themedDialogCancel').click(); });
}

function themedConfirm(message, opts) {
  opts = opts || {};
  _ensureThemedDialogEl();
  return new Promise(resolve => {
    const el        = document.getElementById('themedDialog');
    const okBtn      = document.getElementById('themedDialogOk');
    const cancelBtn  = document.getElementById('themedDialogCancel');
    document.getElementById('themedDialogTitle').textContent   = opts.title || 'Please confirm';
    document.getElementById('themedDialogMessage').textContent = message;
    document.getElementById('themedDialogInputWrap').classList.add('hidden');
    okBtn.textContent = opts.okLabel || 'Confirm';
    okBtn.className   = opts.danger ? 'btn-override danger' : 'btn-override';
    el.classList.remove('hidden');
    function cleanup(result) {
      el.classList.add('hidden');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      resolve(result);
    }
    function onOk()     { cleanup(true); }
    function onCancel() { cleanup(false); }
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
  });
}

function themedPrompt(message, defaultValue, opts) {
  opts = opts || {};
  _ensureThemedDialogEl();
  return new Promise(resolve => {
    const el         = document.getElementById('themedDialog');
    const inputWrap  = document.getElementById('themedDialogInputWrap');
    const input      = document.getElementById('themedDialogInput');
    const okBtn      = document.getElementById('themedDialogOk');
    const cancelBtn  = document.getElementById('themedDialogCancel');
    document.getElementById('themedDialogTitle').textContent   = opts.title || 'Enter a value';
    document.getElementById('themedDialogMessage').textContent = message;
    inputWrap.classList.remove('hidden');
    input.value = defaultValue || '';
    okBtn.textContent = opts.okLabel || 'Save';
    okBtn.className   = 'btn-override';
    el.classList.remove('hidden');
    setTimeout(() => input.focus(), 50);
    function cleanup(result) {
      el.classList.add('hidden');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      input.removeEventListener('keydown', onKey);
      resolve(result);
    }
    function onOk()     { cleanup(input.value.trim() || null); }
    function onCancel() { cleanup(null); }
    function onKey(e)   { if (e.key === 'Enter') onOk(); if (e.key === 'Escape') onCancel(); }
    input.addEventListener('keydown', onKey);
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
  });
}

function showToast(message, type, duration) {
  let toast = document.getElementById('themedToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'themedToast';
    toast.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:11px 20px;border-radius:7px;font-size:13px;font-weight:600;font-family:var(--font);box-shadow:var(--shadow-modal);z-index:500;opacity:0;transition:opacity 0.2s;pointer-events:none;max-width:420px;text-align:center;';
    document.body.appendChild(toast);
  }
  const isError = type === 'error';
  toast.textContent    = message;
  toast.style.background = 'var(--bg3)';
  toast.style.color      = isError ? 'var(--high)' : 'var(--ok)';
  toast.style.border     = '1px solid ' + (isError ? 'color-mix(in srgb, var(--high) 32%, transparent)' : 'color-mix(in srgb, var(--ok) 32%, transparent)');
  toast.style.opacity    = '1';
  clearTimeout(toast._hideTimer);
  toast._hideTimer = setTimeout(() => { toast.style.opacity = '0'; }, duration || 3400);
}

function _can(permission) {
  if (!_currentRole) return false;
  const perms = CLIENT_PERMISSIONS[_currentRole] || [];
  if (perms.includes('*')) {
    return !(_lockModeActive && _isEditPermission(permission)); // Admin unaffected unless lock is on for them too — see note below
  }
  if (_lockModeActive && _isEditPermission(permission)) return false;
  return perms.includes(permission);
}

// Permissions considered "editing" — blocked entirely while Lock Mode is on, regardless of role, so a Manager can browse without risk of
function _isEditPermission(permission) {
  return ['add_note', 'delete_note', 'edit_status', 'edit_risk', 'bulk_edit',
          'merge', 'manage_overrides', 'revert_changes', 'upload_schedule',
          'upload_roster', 'generate_wir', 'upload_etar', 'edit_transcript',
          'edit_timelog', 'archive_student'].includes(permission);
}
let _lockModeActive = false;

function toggleLockMode() {
  _lockModeActive = !_lockModeActive;
  try { localStorage.setItem('dashLockMode', _lockModeActive ? '1' : ''); } catch(e) {}
  _applyRoleUI();
  showToast(_lockModeActive ? 'Lock Mode on — editing disabled.' : 'Lock Mode off — editing enabled.');
  const btn = document.getElementById('lockModeBtn');
  if (btn) btn.classList.toggle('active', _lockModeActive);
}

function _canEdit(section) {
  if (section === 'transcript') return _can('edit_transcript');
  if (section === 'timelog')    return _can('edit_timelog');
  return false;
}

// 4. Bootstrap
document.addEventListener('DOMContentLoaded', () => {

  // Restore whatever theme was last saved — applyTheme() and applyCustomThemeNow() (60_UI_Dashboard.html) always wrote to localStorage
  _restoreSavedTheme_();

  document.getElementById('studentsBody').addEventListener('click', e => {
    const btn = e.target.closest('.detail-btn');
    if (btn) openModal(btn.dataset.id);
  });
  document.getElementById('cardsGrid').addEventListener('click', e => {
    const btn = e.target.closest('.detail-btn');
    if (btn) openModal(btn.dataset.id);
  });
  try { _lockModeActive = localStorage.getItem('dashLockMode') === '1'; } catch(e) {}
  _restoreColumnVisibility();
  _restoreZoomLevel();
  _restoreDensity();
  try {
    const savedRisk = localStorage.getItem('dashActiveRisk');
    if (savedRisk) {
      const riskBtn = document.querySelector('[data-risk="' + savedRisk + '"]');
      if (riskBtn) { document.querySelectorAll('[data-risk]').forEach(b => b.classList.remove('active')); riskBtn.classList.add('active'); activeRisk = savedRisk; }
    }
    const savedType = localStorage.getItem('dashActiveType');
    if (savedType && savedType.startsWith('TRADE:')) {
      const tradeBtn = document.querySelector('[data-type="TRADES"]');
      if (tradeBtn) {
        document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
        tradeBtn.classList.add('active');
        tradeBtn.textContent = savedType.slice(6);
        activeType = savedType;
        _tradeCycleIndex = _getDistinctTradeNames_().indexOf(savedType.slice(6));
      }
    } else if (savedType) {
      const typeBtn = document.querySelector('[data-type="' + savedType + '"]');
      if (typeBtn) { document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active')); typeBtn.classList.add('active'); activeType = savedType; }
    }
    const savedSort = localStorage.getItem('dashSortKey');
    if (savedSort) {
      const sortEl = document.getElementById('sortSelect');
      if (sortEl) sortEl.value = savedSort;
    }
  } catch(e) {}
  _renderCustomPresets();
  _wirePresetSelectListener();
  try {
    const savedRole = localStorage.getItem('dashRole');
    if (savedRole) {
      const roleEl = document.getElementById('roleSelect');
      if (roleEl) roleEl.value = savedRole;
    }
  } catch(e) {}
  if (window.innerWidth <= 768) {
    setView('cards');
    _currentView = 'cards';
    document.getElementById('btnCardView')?.classList.add('active');
    document.getElementById('btnTableView')?.classList.remove('active');
  }

  if (_currentRole) {
    document.getElementById('loginScreen').classList.add('hidden');
    _applyRoleUI();
    if (typeof applyRoleViewConfig === 'function') applyRoleViewConfig(_currentRole);
    _loadPinnedIds();
    loadData();
    initCounselorFilter();
    initTeacherFilter();
    initSubjectFilter();
    return;
  }

  // No server-provided role — try the remembered employee ID before falling back to the manual login screen, so a plain page refresh doesn't
  let rememberedId = null;
  try { rememberedId = localStorage.getItem('dashEmployeeId'); } catch(e) {}

  if (!rememberedId) {
    loadLoginAnnouncements(() => {
      document.getElementById('loginScreen').classList.remove('hidden');
    });
    return;
  }

  google.script.run
    .withSuccessHandler(function(result) {
      if (!result || result.error) {
        // Stored ID is no longer valid (removed from staff roles, etc.) — clear it and fall back to a normal manual login.
        try { localStorage.removeItem('dashEmployeeId'); } catch(e) {}
        loadLoginAnnouncements(() => {
          document.getElementById('loginScreen').classList.remove('hidden');
        });
        return;
      }
      _currentRole       = result.role;
      _currentName       = result.name;
      _currentEmployeeId = result.employeeId;
      _completeLogin();
    })
    .withFailureHandler(function() {
      // Network hiccup, not necessarily an invalid ID — don't clear storage, just fall back to manual login for this one load.
      loadLoginAnnouncements(() => {
        document.getElementById('loginScreen').classList.remove('hidden');
      });
    })
    .getRoleByEmployeeId(rememberedId);
});

// 5. Staff login
function staffLogin() {
  const input = document.getElementById('employeeIdInput');
  const id    = (input ? input.value : '').trim();
  if (!id) {
    _showLoginError('Please enter your Employee ID. If you do not know your Employee ID you can find it on CIS or Contact Admin');
    return;
  }

  const btn = document.getElementById('staffLoginBtn');
  btn.disabled    = true;
  btn.textContent = 'Signing in…';
  _hideLoginError();

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled    = false;
      btn.textContent = 'Sign In';
      if (result.error) { _showLoginError(result.error); return; }
      _currentRole       = result.role;
      _currentName       = result.name;
      _currentEmployeeId = result.employeeId;
      // Remembered so future page loads can silently re-validate this ID with the server instead of showing the login screen again.
      try { localStorage.setItem('dashEmployeeId', result.employeeId); } catch(e) {}
      _completeLogin();
    })
    .withFailureHandler(function() {
      btn.disabled    = false;
      btn.textContent = 'Sign In';
      _showLoginError('Something went wrong. Please try again.');
    })
    .getRoleByEmployeeId(id);
}

function _showLoginError(msg) {
  const el = document.getElementById('staffLoginError');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
}

function _hideLoginError() {
  const el = document.getElementById('staffLoginError');
  if (el) el.classList.remove('show');
}

function _completeLogin() {
  document.getElementById('loginScreen').classList.add('hidden');
  const wirLabel = document.getElementById('wirWeekLabel');
  if (wirLabel) wirLabel.textContent = _currentName + ' · ' + _currentRole;
  _applyRoleUI();
  if (typeof applyRoleViewConfig === 'function') applyRoleViewConfig(_currentRole);
  _loadPinnedIds();
  loadData();
  initCounselorFilter();
  initTeacherFilter();
  initSubjectFilter();
}

// Clears the remembered employee ID and reloads to the manual login screen — for a shared computer, or signing in as someone else.
function staffLogout() {
  try { localStorage.removeItem('dashEmployeeId'); } catch(e) {}
  // Reload the TOP window, not just this frame — if this dashboard is ever embedded in an iframe (doGet() sets XFrameOptionsMode.
  try {
    window.top.location.href = window.location.href;
  } catch(e) {
    location.reload();
  }
}

function loadLoginAnnouncements(callback) {
  google.script.run
    .withSuccessHandler(function(announcements) {
      const box = document.getElementById("loginAnnouncements");
      if (announcements && announcements.length) {
        box.innerHTML = `
          <strong>📢 Dashboard Updates</strong>
          <ul>
            ${announcements.map(a => `
              <li>${a.message}</li>
            `).join("")}
          </ul>
        `;
        box.classList.remove("hidden");
      }
      if (callback) callback();
    })
    .getDashboardAnnouncements();
}

function _applyRoleUI() {
  _setVisible('btnMergeProfiles',   _can('merge'));
  _setVisible('btnSendDigest',      _can('send_digest'));
  _setVisible('bulkNoteBtn',        _can('add_note'));
  _setVisible('bulkStatusBtn',      _can('bulk_edit'));
  _setVisible('btnGenerateWIR',     _can('generate_wir'));
  _setVisible('btnProductivity',    _can('send_digest'));   
  _setVisible('btnBulkPacing',      _can('bulk_edit')); 
  _setVisible('btnCreditReport',    _can('generate_wir'));

  document.querySelectorAll('[onclick*="openScheduleUpload"]').forEach(el => el.style.display = _can('upload_schedule') ? '' : 'none');
  document.querySelectorAll('[onclick*="openRosterUpload"]').forEach(el => el.style.display = _can('upload_roster') ? '' : 'none');

function _setVisible(id, visible) {
  const el = document.getElementById(id);
  if (el) el.style.display = visible ? '' : 'none';

// 6. Data loading
function loadData() {
  _dataLoadInFlight = true;
  setLoading(true);
  _startLoadTimeoutWatch();
  google.script.run
    .withSuccessHandler(onDataLoaded)
    .withFailureHandler(onError)
    .getDashboardData();
}

let _refreshTimerInterval = null;
let _dataLoadInFlight = false; // tracks ANY in-flight load (first load or refresh) — see _startLoadTimeoutWatch()

// Shared by the normal completion path (finish() below) and the timeout watchdog, so the Refresh button/timer can recover even if
function _resetRefreshButtonUI() {
  const btn   = document.getElementById('refreshBtn');
  const label = document.getElementById('refreshBtnLabel');
  clearInterval(_refreshTimerInterval);
  if (btn)   { btn.disabled = false; btn.style.opacity = ''; btn.style.pointerEvents = ''; }
  if (label) label.textContent = 'Refresh';
}

function refreshData() {
  const btn   = document.getElementById('refreshBtn');
  const label = document.getElementById('refreshBtnLabel');
  if (btn && btn.disabled) return;

  if (btn)   { btn.disabled = true; btn.style.opacity = '0.6'; btn.style.pointerEvents = 'none'; }

  const startTime = Date.now();
  if (label) label.textContent = 'Refreshing… 0:00';

  clearInterval(_refreshTimerInterval);
  _refreshTimerInterval = setInterval(() => {
    if (!label) return;
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const mins = Math.floor(elapsed / 60);
    const secs = elapsed % 60;
    label.textContent = `Refreshing… ${mins}:${String(secs).padStart(2, '0')}`;
  }, 1000);

  _dataLoadInFlight = true;
  setLoading(true);
  _startLoadTimeoutWatch();

  function finish(fn, arg) {
    _dataLoadInFlight = false;
    _resetRefreshButtonUI();
    fn(arg);
  }

  google.script.run
    .withSuccessHandler(result => finish(onDataLoaded, result))
    .withFailureHandler(err    => finish(onError, err))
    .refreshData();
}

function _startLoadTimeoutWatch() {
  if (_loadTimeoutHandle) clearTimeout(_loadTimeoutHandle);
  _loadTimeoutHandle = setTimeout(() => {
    if (_dataLoadInFlight) {
      _dataLoadInFlight = false;
      _resetRefreshButtonUI(); // recover the button/skeleton state even though the server call never called back
      showError("The page is taking much longer than expected to load. This usually means the connection to Google's servers was blocked. Try refreshing, or opening this dashboard in a different browser.");
    }
  }, 25000);
}

function onDataLoaded(result) {
  _dataLoadInFlight = false;
  setLoading(false);
  if (result.error) { showError(result.error); return; }

  allProfiles  = result.profiles || [];
  _hsMonthlyByStudent = result.hsMonthlyByStudent || {};
  _hsMonthlyCohort    = result.hsMonthlyCohort    || [];
  _tradeMonthlyCohort = result.tradeMonthlyCohort || [];
  _tabeCohort         = result.tabeCohort         || null;
  wirWeekLabel = result.wirWeekLabel || null;

  if (_pendingRoleAutoFilter && _pendingRoleAutoFilter.type === 'trade') {
    _activeTradeAutoFilter = { trade: _pendingRoleAutoFilter.value, includeUSN: !!_pendingRoleAutoFilter.includeUSN };
  }

  renderSummaryCards(result.metrics || {});
  if (_archivedCount === null) _loadArchivedCount();
  if (!_customColumnsLoaded) _loadCustomColumns();
  _lastRenderFingerprint = '';
  applyFilters();
  renderFreshnessBanner(result.lastUpdated, wirWeekLabel, result.rosterLastUpdated);
  document.getElementById('dashContent').classList.remove('hidden');
  if (result.lastUpdated) {
    const d = new Date(result.lastUpdated);
    document.getElementById('lastUpdated').textContent =
      'Updated ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  const wirLabel = document.getElementById('wirWeekLabel');
  if (wirLabel && !_currentName) {
    wirLabel.textContent = wirWeekLabel ? 'WIR: ' + wirWeekLabel : '';
  }
  _maybeStartWalkthrough();
}

function onError(err) {
  _dataLoadInFlight = false;
  setLoading(false);
  showError(typeof err === 'string' ? err : (err.message || 'Unknown error'));
}

// 7. Freshness banner
function renderFreshnessBanner(lastUpdated, wirLabel, rosterLastUpdated) {
  try {
    const banner  = document.getElementById('freshnessBanner');
    const sources = document.getElementById('freshnessSources');
    if (!banner || !sources) return;
    try { if (sessionStorage.getItem('freshnessDismissed')) return; } catch(e) {}
    const now   = new Date();
    const today = now.getDay();
    const hour  = now.getHours();
    const daysSinceFriday = today === 5 ? (hour >= 17 ? 0 : 7)
                          : today === 6 ? 1 : today === 0 ? 2 : today + 2;
    const lastFriday = new Date(now);
    lastFriday.setDate(now.getDate() - daysSinceFriday);
    const timeUpdateDays = [1, 3, 5];
    let daysSinceTime = 0;
    for (let d = 0; d <= 7; d++) {
      const checkDay = ((today - d) + 7) % 7;
      if (timeUpdateDays.includes(checkDay)) { daysSinceTime = d; break; }
    }
    const fmtDate = d => d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    const items = [
      { label: 'Academic', sub: 'updates daily',                cls: 'fi-today', tip: 'High School & HiSET data refreshes daily from Edgenuity' },
      { label: 'Trades',   sub: 'as of ' + fmtDate(lastFriday), cls: daysSinceFriday <= 1 ? 'fi-today' : 'fi-week', tip: 'Trade Summary & monthly % data updates every Friday' },
      { label: 'Time',     sub: daysSinceTime === 0 ? 'updated today' : daysSinceTime === 1 ? 'updated yesterday' : daysSinceTime + ' days ago', cls: daysSinceTime <= 1 ? 'fi-today' : daysSinceTime <= 3 ? 'fi-week' : 'fi-old', tip: 'Worked time data updates Monday, Wednesday, and Friday' },
      { label: 'WIR',      sub: wirLabel ? 'week of ' + wirLabel : 'not loaded', cls: wirLabel ? 'fi-week' : 'fi-old', tip: 'Weekly Intervention Report — one report per week' },
      { label: 'Roster',   sub: rosterLastUpdated ? 'as of ' + new Date(rosterLastUpdated).toLocaleDateString([], { month:'short', day:'numeric' }) : 'never run', cls: rosterLastUpdated ? 'fi-week' : 'fi-old', tip: 'Last time the roster upload tool was run to verify student status' },
    ];

    let sourcesHtml = items.map(i => `
      <span class="freshness-item ${i.cls}" title="${i.tip}">
        <span class="fi-dot"></span>
        <strong>${i.label}</strong>&nbsp;${i.sub}
      </span>`).join('');

    if (lastUpdated) {
      const lastUpdate = new Date(lastUpdated);
      const minsSince  = (Date.now() - lastUpdate.getTime()) / 60000;
      if (minsSince > 20) {
        sourcesHtml += `<span class="freshness-item fi-old">
          <span class="fi-dot"></span>
          <strong>Cache</strong>&nbsp;may be stale — last update ${Math.round(minsSince)} min ago
        </span>`;
      }
    }

    sources.innerHTML = sourcesHtml;
    banner.classList.remove('hidden');
  } catch(e) {}
}

function dismissFreshness() {
  document.getElementById('freshnessBanner').classList.add('hidden');
  try { sessionStorage.setItem('freshnessDismissed', '1'); } catch(e) {}
}

// 8. Summary cards
const DEFAULT_CARD_ORDER = [
  'high', 'total', 'medium', 'low', 'unknown',
  'tradeComplete', 'hsComplete', 'archived', 'wir', 'hasNotes',
];

// Resolves a CARD_DEFS metric path (e.g. 'riskCounts.HIGH') or a '_computed.*' key against the raw metrics object + the client-computed
function _resolveCardMetric(path, metrics, computed) {
  if (path.indexOf('_computed.') === 0) return computed[path.slice('_computed.'.length)];
  if (path === '_archivedCount') return _archivedCount ?? '…';
  return path.split('.').reduce((obj, k) => (obj == null ? undefined : obj[k]), metrics);
}

function renderSummaryCards(m) {
  _lastMetrics = m;
  const container = document.getElementById('summaryCards');

  // Values that need client-side logic (override-aware), not a straight passthrough from the server metrics object.
  const computed = {
    tradeComplete: allProfiles.filter(p =>
      p.tradeStatusOverride ? p.tradeStatusOverride === 'TRADE_COMPLETE' : !!p.tradeComplete
    ).length,
    hsComplete: allProfiles.filter(p =>
      p.academicStatusOverride ? p.academicStatusOverride === 'HS_COMPLETE' : !!p.hsComplete
    ).length,
  };

  const roleConfig = (typeof resolveRoleViewConfig === 'function') ? resolveRoleViewConfig(_viewingAsRole || _currentRole) : null;

  if (roleConfig && roleConfig.noSummaryCards) {
    container.innerHTML = '';
    container.style.display = 'none';
    return;
  }
  container.style.display = '';

  // null summaryCards (Admin, or a role not yet defined) → the original fixed order;
  const cardKeys = (roleConfig && roleConfig.summaryCards) ? roleConfig.summaryCards : DEFAULT_CARD_ORDER;

  const cardsHtml = cardKeys.map(key => {
    const def = CARD_DEFS[key];
    if (!def) return ''; // unknown key in a config — skip rather than throw

    if (def.type === 'expandable-tabe') {
      const autoExpand = roleConfig ? !!roleConfig.tabeAutoExpand : false;
      return renderTabeCardHtml(_tabeCohort, autoExpand);
    }

    const rawValue = _resolveCardMetric(def.metric, m, computed);
    const value = (rawValue ?? 0) + (def.suffix || '');
    const count = typeof rawValue === 'number' ? rawValue : null;
    const sub = def.sub || (count !== null ? (count === 1 ? 'student' : 'students') : '');

    if (def.hero) {
      const rc = m.riskCounts || {};
      const total = m.total || 0;
      const segs = [
        { key: 'HIGH',    cls: 'high',    label: 'Needs Attention' },
        { key: 'MEDIUM',  cls: 'medium',  label: 'Watch Closely' },
        { key: 'LOW',     cls: 'low',     label: 'On Track' },
        { key: 'UNKNOWN', cls: 'neutral', label: 'No Data Yet' },
      ];
      const barHtml = total ? segs.map(s => {
        const n = rc[s.key] || 0;
        const pct = (n / total) * 100;
        return pct > 0 ? `<div class="hero-breakdown-seg" style="width:${pct}%;background:var(--${s.cls === 'neutral' ? 'neutral' : s.cls})"></div>` : '';
      }).join('') : '';
      const legendHtml = segs.map(s => {
        const n = rc[s.key] || 0;
        return `<span><span class="dot" style="background:var(--${s.cls === 'neutral' ? 'neutral' : s.cls})"></span>${s.label} ${n}</span>`;
      }).join('');

      return `
      <div class="card card-${def.cls} card-hero">
        <div class="card-hero-headline">
          <div>
            <div class="card-label">${def.label}</div>
            <div class="card-value ${def.cls}">${value}</div>
          </div>
          <div class="card-sub">${sub}</div>
        </div>
        <div class="hero-breakdown">
          <div class="hero-breakdown-bar">${barHtml}</div>
          <div class="hero-breakdown-legend">${legendHtml}</div>
        </div>
        <button class="hero-action" onclick="jumpToRiskFilter('HIGH')">View list &rarr;</button>
      </div>`;
    }

    return `
    <div class="card card-${def.cls}" ${def.clickable ? `onclick="openArchivedModal()" style="cursor:pointer;"` : ''}>
      <div class="card-label">${def.label}</div>
      <div class="card-value ${def.cls}">${value}</div>
      <div class="card-sub">${sub}</div>
    </div>`;
  }).join('');

  container.innerHTML = cardsHtml;
}

// Jumps straight from the hero card to the filtered table/card list —
// reuses the existing chip-based filter machinery (setRiskFilter)
// rather than duplicating filter logic, then scrolls the list into view.
function jumpToRiskFilter(riskKey) {
  const chip = document.querySelector(`[data-risk="${riskKey}"]`);
  if (chip) setRiskFilter(chip);
  const list = document.getElementById('resultCount');
  if (list) list.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── TABE Progress card ─────────────────────────
function renderTabeCardHtml(cohort, autoExpand) {
  if (_tabeCardExpanded === null) _tabeCardExpanded = !!autoExpand;
  const expanded = _tabeCardExpanded;

  const math    = cohort && cohort.math;
  const reading = cohort && cohort.reading;

  function miniStat(label, subj) {
    if (!subj) return `<div class="card-tabe-mini"><div class="card-tabe-mini-label">${label}</div><div class="card-tabe-empty">Not enough data yet</div></div>`;
    const sign = subj.avgGain > 0 ? '+' : '';
    return `
      <div class="card-tabe-mini">
        <div class="card-tabe-mini-label">${label}</div>
        <div class="card-tabe-mini-value">${sign}${subj.avgGain}</div>
        <div class="card-tabe-mini-sub">${subj.improvedPct}% improved (${subj.improvedCount}/${subj.count})</div>
      </div>`;
  }

  function expandedSubject(label, subj) {
    if (!subj) return `<div><div class="card-tabe-subject-title">${label}</div><div class="card-tabe-empty">Not enough retest history yet to show gains.</div></div>`;
    const sign = subj.avgGain > 0 ? '+' : '';
    const levelChips = Object.entries(subj.levelCounts || {})
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([lvl, n]) => `<span class="card-tabe-level-chip">${esc(lvl)}: ${n}</span>`)
      .join('');
    return `
      <div>
        <div class="card-tabe-subject-title">${label}</div>
        <div class="card-tabe-stat-row"><span>Avg gain</span><b>${sign}${subj.avgGain}</b></div>
        <div class="card-tabe-stat-row"><span>Improved</span><b>${subj.improvedPct}% (${subj.improvedCount}/${subj.count})</b></div>
        <div class="card-tabe-levels">${levelChips || '<span class="card-tabe-empty">No level data</span>'}</div>
      </div>`;
  }

  return `
    <div class="card card-accent card-tabe ${expanded ? 'expanded' : ''}" onclick="toggleTabeCard()">
      <div class="card-tabe-header">
        <div class="card-label">TABE Progress</div>
        <span class="card-tabe-chevron">&#9656;</span>
      </div>
      <div class="card-tabe-summary-row">
        ${miniStat('Math', math)}
        ${miniStat('Reading', reading)}
      </div>
      ${expanded ? `
        <div class="card-tabe-expanded-body" onclick="event.stopPropagation()">
          ${expandedSubject('Math', math)}
          ${expandedSubject('Reading', reading)}
        </div>
      ` : ''}
    </div>`;
}

function toggleTabeCard() {
  _tabeCardExpanded = !_tabeCardExpanded;
  renderSummaryCards(_lastMetrics || {});
}

// 9. Filters (risk / type / counselor / teacher) + presets
function setRiskFilter(el) {
  document.querySelectorAll('[data-risk]').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  activeRisk = el.dataset.risk;
  try { localStorage.setItem('dashActiveRisk', activeRisk); } catch(e) {}
  applyFilters();
}

function setTypeFilter(el) {
  document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  activeType = el.dataset.type;
  try { localStorage.setItem('dashActiveType', activeType); } catch(e) {}
  applyFilters();
}

// Cycles the "Trades" tab through every distinct trade name found in
// the current data — CNA, then BCT, then Culinary, and so on — one
// trade at a time per click, filtering to only that trade. Wraps
// back to the first trade after the last.
let _tradeCycleIndex = -1;

function _getDistinctTradeNames_() {
  const names = new Set();
  allProfiles.forEach(p => (p.trades || []).forEach(t => { if (t.tarName) names.add(t.tarName); }));
  return [...names].sort();
}

function cycleTradeFilter(el) {
  const tradeNames = _getDistinctTradeNames_();
  if (!tradeNames.length) return;
  _tradeCycleIndex = (_tradeCycleIndex + 1) % tradeNames.length;
  const tradeName = tradeNames[_tradeCycleIndex];
  document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  el.textContent = tradeName;
  activeType = 'TRADE:' + tradeName;
  try { localStorage.setItem('dashActiveType', activeType); } catch(e) {}
  applyFilters();
}

// ── Bulk search ──────────────────────────────────────────────────
function openBulkSearch() {
  document.getElementById('bulkSearchModal').classList.remove('hidden');
  document.getElementById('bulkSearchStatus').textContent = '';
  if (_bulkSearchIds) {
    document.getElementById('bulkSearchStatus').textContent = `Bulk search active — showing ${_bulkSearchIds.size} student${_bulkSearchIds.size !== 1 ? 's' : ''}.`;
  }
}

function closeBulkSearch() {
  document.getElementById('bulkSearchModal').classList.add('hidden');
}

function confirmBulkSearch() {
  const raw = document.getElementById('bulkSearchInput').value || '';
  const tokens = raw.split(/[\n,]/).map(t => t.trim()).filter(Boolean);
  const status = document.getElementById('bulkSearchStatus');

  if (!tokens.length) {
    status.textContent = 'Paste at least one ID or name first.';
    return;
  }

  const matchedIds  = new Set();
  const unmatched   = [];

  tokens.forEach(token => {
    const lower = token.toLowerCase();
    const match = allProfiles.find(p =>
      (p.academicId && String(p.academicId).trim() === token) ||
      (p.displayName && p.displayName.toLowerCase().includes(lower))
    );
    if (match) matchedIds.add(match.id);
    else unmatched.push(token);
  });

  _bulkSearchIds = matchedIds;
  applyFilters();

  status.innerHTML = `Matched ${matchedIds.size} of ${tokens.length} entries.` +
    (unmatched.length ? `<br><span style="color:var(--high);">Not found: ${esc(unmatched.join(', '))}</span>` : '');
}

function clearBulkSearch() {
  _bulkSearchIds = null;
  document.getElementById('bulkSearchInput').value = '';
  document.getElementById('bulkSearchStatus').textContent = '';
  applyFilters();
  closeBulkSearch();
}

function applyFilters() {
  try { localStorage.setItem('dashSortKey', document.getElementById('sortSelect').value); } catch(e) {}
  const filtered = _getFilteredSorted();
  const sortKey     = document.getElementById('sortSelect').value;
  const fingerprint = _currentView + '|' + sortKey + '|' + filtered.map(p =>
    p.id + p.risk.score + '~' + p.thisWeekSource + '~' + p.thisWeekAssignedHours + '~' + p.thisWeekWorkedHours
  ).join(',');
  const countEl = document.getElementById('resultCount');
  countEl.textContent = `${filtered.length} student${filtered.length !== 1 ? 's' : ''}`;
  _renderFilterChips();
  if (fingerprint === _lastRenderFingerprint) return;
  _lastRenderFingerprint = fingerprint;
  selectedIds.clear();
  updateBulkBar();
  if      (_currentView === 'cards')  renderCards(filtered);
  else if (_currentView === 'action') renderActionView(filtered);
  else if (_currentView === 'productivity') { /* no-op — Productivity view has its own render pipeline (_loadProductivityData/_renderProductivityModal), independent of the risk/type/search filters */ }
  else                                renderTable(filtered);
}

// ── Active filter chips ───────────────────────────────────────
// The one thing people kept losing track of: forgetting a filter was set from days ago and wondering where half their students went.
function _renderFilterChips() {
  const box = document.getElementById('activeFilterChips');
  if (!box) return;
  const chips = [];

  if (activeRisk !== 'ALL') {
    const label = document.querySelector('[data-risk="' + activeRisk + '"]')?.textContent || activeRisk;
    chips.push({ label, onClear: "document.querySelector('[data-risk=\"ALL\"]').click()" });
  }
  if (activeType !== 'ALL') {
    const label = document.querySelector('[data-type="' + activeType + '"]')?.textContent || activeType;
    chips.push({ label, onClear: "document.querySelector('[data-type=\"ALL\"]').click()" });
  }
  const searchVal = (document.getElementById('searchInput')?.value || '').trim();
  if (searchVal) {
    chips.push({ label: 'Search: "' + searchVal + '"', onClear: "document.getElementById('searchInput').value=''; applyFilters();" });
  }
  if (_activeCounselorTrades) {
    const name = document.getElementById('counselorSelect')?.value || '';
    chips.push({ label: 'Counselor: ' + name, onClear: 'clearCounselorFilter()' });
  }
  if (_activeHSDFilter) {
    chips.push({ label: 'Teacher: ' + _activeHSDFilter, onClear: 'clearTeacherFilter()' });
  }
  if (_staleOnlyActive) {
    chips.push({ label: 'No Recent Updates', onClear: '_staleOnlyActive=false; applyFilters();' });
  }
  if (_activeSubjectFilter) {
    chips.push({ label: 'TABE: Reading/Math students', onClear: 'clearSubjectFilter()' });
  }
  if (_activeTradeAutoFilter) {
    chips.push({ label: 'Trade: ' + _activeTradeAutoFilter.trade + (_activeTradeAutoFilter.includeUSN ? ' + USN' : ''), onClear: 'clearTradeAutoFilter()' });
  }

  if (!chips.length) {
    box.innerHTML = '<span class="filter-chip filter-chip-neutral">Showing all students — no filters applied</span>';
    box.classList.add('show');
    return;
  }
  box.classList.add('show');
  box.innerHTML = chips.map(c =>
    `<span class="filter-chip">${esc(c.label)}<button class="filter-chip-x" onclick="${c.onClear}" title="Clear this filter">✕</button></span>`
  ).join('');
}

// ── Counselor filter ─────────────────────────────────────────
const COUNSELOR_STORAGE_KEY = 'tjc_counselor_filter';
let _counselorList = []; // full list from Staff Roles
let _activeCounselorTrades = null; // Set of trade names, or null = all

function initCounselorFilter() {
  google.script.run
    .withSuccessHandler(function(result) {
      if (result.error || !result.counselors || !result.counselors.length) {
        document.getElementById('counselorFilterBar').style.display = 'none';
        return;
      }
      _counselorList = result.counselors;
      const sel = document.getElementById('counselorSelect');
      result.counselors.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.name;
        opt.textContent = c.name + ' (' + c.trades.join(', ') + ')';
        sel.appendChild(opt);
      });

      // Restore saved selection
      const saved = localStorage.getItem(COUNSELOR_STORAGE_KEY);
      if (saved) {
        sel.value = saved;
        if (sel.value) _applySelectedCounselor(saved);
      }
    })
    .withFailureHandler(function() {
      document.getElementById('counselorFilterBar').style.display = 'none';
    })
    .getCounselorList();
}

function applyCounselorFilter() {
  const sel  = document.getElementById('counselorSelect');
  const name = sel.value;
  if (!name) {
    clearCounselorFilter();
    return;
  }
  localStorage.setItem(COUNSELOR_STORAGE_KEY, name);
  _applySelectedCounselor(name);
}

function _applySelectedCounselor(name) {
  const counselor = _counselorList.find(c => c.name === name);
  if (!counselor) return;
  _activeCounselorTrades = new Set(counselor.trades.map(t => t.toLowerCase()));
  document.getElementById('counselorClearBtn').style.display = '';
  document.getElementById('counselorFilterLabel').textContent =
    'Showing: ' + counselor.trades.join(', ');

  applyFilters();
}

function clearCounselorFilter() {
  _activeCounselorTrades = null;
  localStorage.removeItem(COUNSELOR_STORAGE_KEY);
  document.getElementById('counselorSelect').value = '';
  document.getElementById('counselorClearBtn').style.display = 'none';
  document.getElementById('counselorFilterLabel').textContent = '';
  applyFilters();
}

// ── Teacher filter ───────────────────────────────────────────
const TEACHER_STORAGE_KEY = 'tjc_teacher_filter';
let _hsdAssignments   = {};   // studentId -> 'HSD 2' | 'HSD3' | 'HSE/HSD1'
let _activeHSDFilter  = null; // currently selected HS class, or null = all
let _subjectAssignments   = {};   // studentId -> ['reading','math',...], from getStudentSubjectAssignments()
let _activeSubjectFilter  = null; // array of wanted subject keywords, or null = all — TABE Instructor auto-filter
let _activeTradeAutoFilter = null; // { trade, includeUSN } or null = all — Trade Instructor auto-filter
// Set by applyRoleViewConfig() (60_UI_RoleViews.html) before the data it depends on has necessarily loaded yet.
let _pendingRoleAutoFilter = null;

function initTeacherFilter() {
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result || result.success === false) {
        document.getElementById('teacherFilterBar').style.display = 'none';
        return;
      }
      _hsdAssignments = result.assignments || {};

      if (_pendingRoleAutoFilter && _pendingRoleAutoFilter.type === 'hsd') {
        const sel = document.getElementById('teacherSelect');
        if (sel) sel.value = _pendingRoleAutoFilter.value;
        _applySelectedTeacher(_pendingRoleAutoFilter.value);
        return; // role-driven filter takes precedence over a stale localStorage pick
      }

      // Restore saved selection
      const saved = localStorage.getItem(TEACHER_STORAGE_KEY);
      if (saved) {
        const sel = document.getElementById('teacherSelect');
        sel.value = saved;
        if (sel.value) _applySelectedTeacher(saved);
      }
    })
    .withFailureHandler(function() {
      document.getElementById('teacherFilterBar').style.display = 'none';
    })
    .getStudentHSDAssignments();
}

function applyTeacherFilter() {
  const sel = document.getElementById('teacherSelect');
  const hsdClass = sel.value;
  if (!hsdClass) {
    clearTeacherFilter();
    return;
  }
  localStorage.setItem(TEACHER_STORAGE_KEY, hsdClass);
  _applySelectedTeacher(hsdClass);
}

function _applySelectedTeacher(hsdClass) {
  _activeHSDFilter = hsdClass;

  document.getElementById('teacherClearBtn').style.display = '';
  document.getElementById('teacherFilterLabel').textContent = 'Showing: ' + hsdClass;

  applyFilters();
}

function clearTeacherFilter() {
  _activeHSDFilter = null;
  localStorage.removeItem(TEACHER_STORAGE_KEY);
  document.getElementById('teacherSelect').value = '';
  document.getElementById('teacherClearBtn').style.display = 'none';
  document.getElementById('teacherFilterLabel').textContent = '';
  applyFilters();
}

// ── Subject filter (TABE Instructor auto-filter) ────────────
// Loads studentId -> ['reading','math'] assignments once per session, same pattern as initTeacherFilter().
function initSubjectFilter() {
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result || result.success === false) return;
      _subjectAssignments = result.assignments || {};
      if (_pendingRoleAutoFilter && _pendingRoleAutoFilter.type === 'subject') {
        _activeSubjectFilter = _pendingRoleAutoFilter.value;
        applyFilters();
      }
    })
    .withFailureHandler(function() {})
    .getStudentSubjectAssignments();
}

function clearSubjectFilter() {
  _activeSubjectFilter = null;
  applyFilters();
}

function clearTradeAutoFilter() {
  _activeTradeAutoFilter = null;
  applyFilters();
}

        ${_customColumns.map(colName => {
          const val = (_customColumnValuesByStudent[p.id] && _customColumnValuesByStudent[p.id][colName]) || '';
          return `<td class="custom-col-td"><input type="text" value="${esc(val)}" data-student-id="${esc(p.id)}" data-column="${esc(colName)}"
            onblur="saveCustomColumnValueFromInput(this)"
            style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--font);font-size:12px;padding:4px 6px;box-sizing:border-box;"></td>`;
        }).join('')}
      </tr>`;
  }).join('');
  _applyColVisibility();
}

function interventionBadge(intervention) {
  if (!intervention) return '—';
  const p   = (intervention.adminPriority || intervention.priority || '').toUpperCase();
  const cls = p === 'CRITICAL' ? 'int-critical'
            : p === 'HIGH'     ? 'int-high'
            : p === 'MEDIUM'   ? 'int-medium'
            : 'int-low';
  return `<span class="int-badge ${cls}">${p || 'WIR'}</span>`;
}

function progressBar(pct, type) {
  if (pct === null || pct === undefined) return '<span style="color:var(--text-muted)">—</span>';
  const clamped    = Math.min(Math.max(pct, 0), 100);
  const colorClass = type === 'trades' ? 'trades'
                   : pct >= 75 ? 'good' : pct >= 40 ? 'warning' : 'danger';
  return `<div class="prog-wrap">
    <div class="prog-bar"><div class="prog-fill ${colorClass}" style="width:${clamped}%"></div></div>
    <span class="prog-label">${(+pct).toFixed(0)}%</span>
  </div>`;
}

function riskLevelLabel(level) {
  return { HIGH: 'Needs Attention', MEDIUM: 'Watch Closely', LOW: 'On Track', UNKNOWN: 'No Data Yet' }[level] || level;
}

// Builds a plain-text, newline-separated breakdown for a native title="" tooltip — e.g.
function riskScoreTooltip(p) {
  const risk = p?.risk;
  if (!risk) return '';
  const detailed = risk.flagsDetailed;
  if (!detailed || !detailed.length) {
    return 'Score: ' + (risk.score || 0) + ' / 200';
  }
  const lines = detailed.map(f => '+' + f.points + ' ' + f.label);
  lines.push('—');
  lines.push('Score: ' + (risk.score || 0) + ' / 200 (' + riskLevelLabel(risk.level) + ')');
  return lines.join('\n');
}

// 11. Shared student display builder
function _buildStudentDisplay(p) {
  const acPct      = p.academic?.percent ?? null;
  const trPct      = p.trades?.[0]?.overallPct ?? null;
  const daysToETAR = p.trades?.[0]?.daysToETAR ?? null;
  const riskLevel  = p.risk?.level || 'UNKNOWN';
  const acadType   = p.academic?.type || '';

  let tradeStatus = 'NOT_STARTED';
  if (p.tradeComplete)                      tradeStatus = 'COMPLETE';
  else if (p.trades && p.trades.length > 0)  tradeStatus = 'ACTIVE';
  const effectiveTradeStatus = p.tradeStatusOverride || tradeStatus;

  const ACADEMIC_STATUS_MAP = {
    HS:          { label: 'HS',          cls: 'tag-hs' },
    HISET:       { label: 'HISET',       cls: 'tag-hiset' },
    GED:         { label: 'GED',         cls: 'tag-ged' },
    HS_COMPLETE: { label: 'HS Complete', cls: 'tag-complete' },
    NOT_STARTED: { label: 'Not Started', cls: 'tag-warn' },
  };
  let academicTag = '';
  if (p.academicStatusOverride) {
    const m = ACADEMIC_STATUS_MAP[p.academicStatusOverride];
    if (m) academicTag = `<span class="type-tag ${m.cls}">${esc(m.label)}</span>`;
  } else if (p.hsComplete) {
    academicTag = '<span class="type-tag tag-complete">HS Complete</span>';
  } else if (acadType) {
    academicTag = `<span class="type-tag tag-${acadType.toLowerCase()}">${acadType}</span>`;
  }

  const TRADE_STATUS_MAP = {
    TRADES:         { label: 'Trades',         cls: 'tag-trades' },
    TRADE_COMPLETE: { label: 'Trade Complete', cls: 'tag-complete' },
    NOT_STARTED:    { label: 'Not Started',    cls: 'tag-warn' },
  };
  let tradesTag = '';
  if (p.tradeStatusOverride) {
    const m = TRADE_STATUS_MAP[p.tradeStatusOverride];
    if (m) tradesTag = `<span class="type-tag ${m.cls}">${esc(m.label)}</span>`;
  } else if (tradeStatus === 'COMPLETE') {
    tradesTag = '<span class="type-tag tag-complete">Trade Complete</span>';
  } else if (tradeStatus === 'ACTIVE') {
    tradesTag = '<span class="type-tag tag-trades">Trades</span>';
  } else {
    tradesTag = '<span class="type-tag tag-warn">Not Started</span>';
  }

  let tradesNameCell = '—';
  if (p.tradeNameOverride) {
    tradesNameCell = esc(p.tradeNameOverride);
  } else if (effectiveTradeStatus === 'ACTIVE' || effectiveTradeStatus === 'TRADES') {
    tradesNameCell = esc(p.trades?.[0]?.tarName || '—');
  } else if (effectiveTradeStatus === 'TRADE_COMPLETE' || effectiveTradeStatus === 'COMPLETE') {
    tradesNameCell = p.completedTrades?.length ? esc(p.completedTrades.join(', ')) : 'Completed';
  } else {
    tradesNameCell = '<span class="type-tag tag-warn">Not Started</span>';
  }

  const tradesPctCell = (effectiveTradeStatus === 'TRADE_COMPLETE' || effectiveTradeStatus === 'COMPLETE')
    ? '<span class="type-tag tag-complete">100%</span>'
    : progressBar(trPct, 'trades');

  const isUSNorNotStarted =
    p.academicStatusOverride === 'NOT_STARTED' ||
    p.tradeStatusOverride    === 'NOT_STARTED' ||
    p.tradeNameOverride      === 'USN'         ||
    (p.trades?.[0]?.tarName?.toUpperCase() === 'USN');

  let thisWkCell;
  if (p.hsComplete && p.tradeComplete) {
    thisWkCell = '<span class="in-trades-badge" style="background:var(--low-glow);color:var(--low);">Program Complete</span>';
  } else if (p.hsComplete) {
    thisWkCell = '<span class="in-trades-badge">Full Time Trades</span>';
  } else if (isUSNorNotStarted && p.hasTrades) {
    thisWkCell = '<span class="in-trades-badge">In Trades</span>';
  } else if (isUSNorNotStarted && !p.hasTrades) {
    thisWkCell = '<span style="color:var(--text-muted);font-size:12px;">—</span>';
  } else {
    const twd = computeThisWeekDisplay_(p);
    if (twd.kind === 'trades' || twd.kind === 'unassigned') {
      thisWkCell = `<span class="in-trades-badge">${esc(twd.label)}</span>`;
    } else if (twd.kind === 'no_data') {
      thisWkCell = `<span class="in-trades-badge" style="background:var(--bg4);color:var(--text-muted);" title="No schedule uploaded yet this week">${esc(twd.label)}</span>`;
    } else if (twd.kind === 'no_current_schedule') {
      thisWkCell = `<span class="in-trades-badge" style="background:var(--bg4);color:var(--text-muted);" title="No schedule on file for the current week for this student">${esc(twd.label)}</span>`;
    } else if (twd.kind === 'uncertain') {
      thisWkCell = `<span class="in-trades-badge" style="background:var(--medium-glow);color:var(--medium);" title="Recent weeks don't agree on a pattern — worth a manual check">${esc(twd.label)}</span>`;
    } else {
      thisWkCell = esc(twd.label);
    }
  }

  const etarCell = daysToETAR !== null
    ? `<span style="color:${daysToETAR < 30 ? 'var(--high)' : daysToETAR < 90 ? 'var(--medium)' : 'var(--low)'};font-weight:600">${daysToETAR}d</span>`
    : '—';

  const tradeName = p.tradeNameOverride
    || p.trades?.[0]?.tarName
    || (p.tradeComplete ? (p.completedTrades?.[0] || 'Complete') : null);

  return {
    acPct, trPct, riskLevel, acadType, tradeStatus, effectiveTradeStatus,
    academicTag, tradesTag,
    academicCell: academicTag + tradesTag || '<span class="type-tag">—</span>',
    tradesNameCell, tradesPctCell, thisWkCell, etarCell, tradeName,
    intBadge: p.hasIntervention ? interventionBadge(p.intervention) : '—',
    trendHtml: riskTrendIcon(p.riskTrend),
    currentCourseTargetDate: p.academic?.targetDate || null,
  };
}

// 12. Detail modal
let _savedTableScrollTop = null;

function openModal(id) {
  const p = allProfiles.find(x => x.id === id);
  if (!p) return;
  const tableWrap = document.querySelector('.table-wrap');
  if (tableWrap) _savedTableScrollTop = tableWrap.scrollTop;

  _resetTranscriptStateIfNewStudent(p);

  try {
    currentModalProfile = p;
    document.getElementById('modalName').textContent = p.displayName;
 
    const badges = [];
    if (p.hsComplete)                      badges.push('<span class="type-tag tag-complete">HS Complete</span>');
    if (p.academic)                        badges.push(`<span class="type-tag tag-${(p.academic.type || 'unknown').toLowerCase()}">${p.academic.type || 'Unknown'}</span>`);
    if (p.hasTrades)                       badges.push('<span class="type-tag tag-trades">Trades</span>');
    if (p.tradeComplete)                   badges.push(`<span class="type-tag tag-complete">Trade Complete${p.completedTrades?.length ? ' — ' + esc(p.completedTrades.join(', ')) : ''}</span>`);
    if (p.hasIntervention)                 badges.push(interventionBadge(p.intervention));
    badges.push(`<span class="risk-badge risk-${p.risk.level}" title="${esc(riskScoreTooltip(p))}">${riskLevelLabel(p.risk.level)}</span>`);
    if (p.mappingMissing && !p.hsComplete) badges.push('<span class="type-tag tag-warn">No Data</span>');
 
    document.getElementById('modalBadges').innerHTML = badges.join('');
    document.getElementById('modalBody').innerHTML   = buildModalBody(p);
    document.getElementById('detailModal').classList.remove('hidden');

    // Hours Required (Overview tab) needs the same data the Academic
    // Transcript tab uses, but Overview is the first tab shown, so
    // this can't wait for someone to click into Transcript first.
    // Fetch immediately on modal open (skipped if already cached for
    // this student from a prior Transcript tab visit this session),
    // and update just these two spans directly instead of a full
    // modal re-render, so it doesn't disturb anything else in progress.
    if (p.academicId && !_hoursRequiredData) {
      google.script.run
        .withSuccessHandler(function(hoursResult) {
          if (String(_transcriptStudentId) !== String(p.academicId)) return; // modal moved on to a different student
          _hoursRequiredData = (hoursResult && hoursResult.success) ? hoursResult : null;
          if (!_hoursRequiredData) return;
          const idSuffix = String(p.id || '').replace(/\W/g, '');
          const maxEl = document.getElementById('ov-hours-max-' + idSuffix);
          const minEl = document.getElementById('ov-hours-min-' + idSuffix);
          const unmatchedEl = document.getElementById('ov-hours-unmatched-' + idSuffix);
          if (maxEl) maxEl.textContent = _hoursRequiredData.maxRequired + ' h';
          if (minEl) minEl.textContent = _hoursRequiredData.minRequired + ' h';
          if (unmatchedEl) {
            const unmatched = _hoursRequiredData.unmatchedCourses || [];
            unmatchedEl.textContent = unmatched.length
              ? (unmatched.length + ' remaining class' + (unmatched.length === 1 ? '' : 'es') + ' not matched to Master Schedule Hours (not counted above): ' + unmatched.join(', '))
              : '';
          }
        })
        .withFailureHandler(function() { _hoursRequiredData = null; })
        .getHoursRequiredForTranscript(p.academicId);
    }
  } catch(err) {
    // Log the real detail to the console for debugging, but keep the person's screen calm — a toast, not a debug dump in a blank tab.
    console.error('Error opening modal for', p.displayName, err);
    showToast('Could not open details for ' + p.displayName + ' — try refreshing the page.', 'error');
  }
}

  if (p.academic) {
    const a = p.academic;
    const twdOverview = computeThisWeekDisplay_(p);
    const thisWkDisplay =
      twdOverview.kind === 'trades'      ? 'In Trades this week'
      : twdOverview.kind === 'unassigned' ? twdOverview.label
      : twdOverview.kind === 'no_data'    ? 'Not uploaded yet this week'

      <div class="info-row"><span class="label tip" data-tip="Overall percentage of academic coursework completed.">Progress ⓘ</span><div class="value">${a.percent !== null ? progressBar(a.percent, 'academic') : '—'}</div></div>
      <div class="info-row"><span class="label tip" data-tip="Total academic hours logged since enrollment.">Total Hours ⓘ</span><span class="value">${num(a.hours)} h</span></div>
      <div class="info-row"><span class="label tip" data-tip="Slowest realistic total — every remaining incomplete class taken at its full Master Schedule Hours allotment.">Total Hours Maximum Needed ⓘ</span><span class="value" id="ov-hours-max-${String(p.id || '').replace(/\W/g, '')}">${_hoursRequiredData && _transcriptStudentId === p.academicId ? _hoursRequiredData.maxRequired + ' h' : '…'}</span></div>
      <div class="info-row"><span class="label tip" data-tip="Fastest realistic total — every remaining incomplete class at its Master Schedule Hours minimum.">Total Hours Minimum Needed ⓘ</span><span class="value" id="ov-hours-min-${String(p.id || '').replace(/\W/g, '')}">${_hoursRequiredData && _transcriptStudentId === p.academicId ? _hoursRequiredData.minRequired + ' h' : '…'}</span></div>
      <div id="ov-hours-unmatched-${String(p.id || '').replace(/\W/g, '')}" style="font-size:11px;color:var(--text-muted);">${(_hoursRequiredData && _transcriptStudentId === p.academicId && _hoursRequiredData.unmatchedCourses && _hoursRequiredData.unmatchedCourses.length) ? (_hoursRequiredData.unmatchedCourses.length + ' remaining class' + (_hoursRequiredData.unmatchedCourses.length === 1 ? '' : 'es') + ' not matched to Master Schedule Hours (not counted above): ' + esc(_hoursRequiredData.unmatchedCourses.join(', '))) : ''}</div>
      <div class="info-row"><span class="label tip" data-tip="The date the student started their academic program.">Edgenuity Start Date ⓘ</span><span class="value">${esc(a.start || '—')}</span></div>

      <div class="info-row"><span class="label tip" data-tip="Course credits earned this week.">This Week Credits Earned ⓘ</span><span class="value">${num(a.thisWeekCredits)}</span></div>

    left += `<div class="info-section"><h3>${ICONS.risk} Risk Flags</h3><div class="risk-flags">`;

      tradesHtml += `<div class="trade-card">

          ['ETAR Start',         t.etarStart  || '—',  'Date the student started this trade.'],
          ['ETAR Projected End', t.etarProjectedEnd || '—', 'Estimated completion date at current pace.'],
          ['Days to ETAR',       t.daysToETAR != null ? t.daysToETAR + ' days' : '—', 'Days remaining until projected trade completion.'],

        ])}
      </div>`;
    });
    tradesHtml += '</div>';

  } else if (p.tradeComplete) {
    let tradesHtml = `<div class="info-section"><h3>${ICONS.trades} Trades</h3>`;
    (p.completedTrades || []).forEach(name => {
      tradesHtml += `<div class="trade-card">

        <div class="info-row"><span class="label">Note</span><span class="value">No longer on active Trade Summary — completion based on Trade Monthly history.</span></div>

  if (p.intervention) right += buildInterventionSection(p.intervention);

function buildInterventionSection(iv) {
  const p = (iv.adminPriority || iv.priority || '').toUpperCase();
  const priorityClass = p === 'CRITICAL' ? 'int-critical'
                      : p === 'HIGH'     ? 'int-high'
                      : p === 'MEDIUM'   ? 'int-medium'
                      : 'int-low';

  let html = `<div class="info-section intervention-section ${priorityClass}-border">
    <h3>${ICONS.wir} Weekly Check-In Report${iv.weekLabel ? `<span class="wir-week-chip">${esc(iv.weekLabel)}</span>` : ''}</h3>`;

  html += `<div class="wir-status-row">
    ${iv.adminPriority ? `<span class="wir-fact"><span class="wir-fact-label">Priority</span><span class="int-badge ${priorityClass}">${esc(iv.adminPriority)}</span></span>` : ''}
    ${iv.urgency       ? `<span class="wir-fact"><span class="wir-fact-label">Urgency</span><span class="urgency-badge urgency-${iv.urgency.toLowerCase()}">${esc(iv.urgency)}</span></span>` : ''}
    ${iv.status && iv.status.toUpperCase() !== p ? `<span class="wir-status-text">${esc(iv.status)}</span>` : ''}
  </div>`;

  if (iv.gradGap && String(iv.gradGap).trim()) {
    const g = String(iv.gradGap).trim();
    const isOver   = g.includes('over limit') || g.startsWith('⛔');
    const isYellow = g.startsWith('🟡');
    // Derived from the same theme tokens as everywhere else, instead of a hand-picked rgba snapshot that only matched the dark theme.
    const bgColor  = isOver ? 'var(--high-glow)' : isYellow ? 'var(--medium-glow)' : 'var(--accent-glow)';
    const txtColor = isOver ? 'var(--high)' : isYellow ? 'var(--medium)' : 'var(--low)';
    html += `<div style="background:${bgColor};border-radius:6px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;">
      <span style="font-size:11px;font-weight:600;color:var(--text-muted);">Grad Window</span>
      <span style="font-size:15px;font-weight:700;color:${txtColor}">${esc(g)}</span>
    </div>`;
  }

  if (iv.reason) html += `<div class="wir-reason">${esc(iv.reason)}</div>`;

  html += `<div class="wir-metrics">
    ${iv.percent        ? `<div class="wir-metric"><span class="wm-label">Progress</span><span class="wm-val">${pctStr(iv.percent)}</span></div>` : ''}
    ${iv.thisWeekHours  ? `<div class="wir-metric"><span class="wm-label">This Week</span><span class="wm-val">${esc(iv.thisWeekHours)}</span></div>` : ''}
    ${iv.credits        ? `<div class="wir-metric"><span class="wm-label">Credits</span><span class="wm-val">${esc(iv.credits)}</span></div>` : ''}
    ${iv.courseDaysLeft !== null && iv.courseDaysLeft !== undefined ? `<div class="wir-metric"><span class="wm-label">Course Days</span><span class="wm-val">${esc(String(iv.courseDaysLeft))}</span></div>` : ''}
    ${iv.streak     ? `<div class="wir-metric"><span class="wm-label">Streak</span><span class="wm-val">${esc(iv.streak)}</span></div>` : ''}
    ${iv.trajectory ? `<div class="wir-metric"><span class="wm-label">Trajectory</span><span class="wm-val">${esc(iv.trajectory)}</span></div>` : ''}
  </div>`;

  if (iv.issueTags) {
    const tags = iv.issueTags.split(';').map(t => t.trim()).filter(Boolean);
    if (tags.length) {
      const visible  = tags.slice(0, 3);
      const overflow = tags.slice(3);
      const uid      = 'wir-tags-' + Math.random().toString(36).slice(2, 7);
      html += '<div class="wir-tags">';
      html += visible.map(t => `<span class="wir-tag">${esc(t)}</span>`).join('');
      if (overflow.length) {
        html += `<span class="wir-tag" onclick="
          const el=document.getElementById('${uid}');const btn=this;
          if(el.style.display==='none'){el.style.display='contents';btn.textContent='− less';}
          else{el.style.display='none';btn.textContent='+${overflow.length} more';}
        " style="cursor:pointer;border-color:var(--border-bright);color:var(--accent-mid);">+${overflow.length} more</span>`;
        html += `<span id="${uid}" style="display:none;">${overflow.map(t => `<span class="wir-tag">${esc(t)}</span>`).join('')}</span>`;
      }
      html += '</div>';
    }
  }

  if (iv.instructorAction || iv.coordinatorAction) {
    html += '<div class="wir-actions">';
    if (iv.instructorAction)  html += `<div class="wir-action-box"><div class="wir-action-label">Instructor Action</div><div class="wir-action-text">${esc(iv.instructorAction)}</div></div>`;
    if (iv.coordinatorAction) html += `<div class="wir-action-box"><div class="wir-action-label">Coordinator Action</div><div class="wir-action-text">${esc(iv.coordinatorAction)}</div></div>`;
    html += '</div>';
  }

  const caseRows = [];
  if (iv.caseOwner)  caseRows.push(['Case Owner',  iv.caseOwner]);
  if (iv.caseStatus) caseRows.push(['Case Status', iv.caseStatus]);
  if (iv.focus)      caseRows.push(['Focus',       iv.focus]);
  if (iv.followUp)   caseRows.push(['Follow Up',   iv.followUp]);

  if (caseRows.length || iv.caseNotes) {
    const caseUid = 'case-' + Math.random().toString(36).slice(2, 7);
    html += `<div style="margin-top:8px;">
      <button onclick="
        const el=document.getElementById('${caseUid}');const wasHidden=el.classList.contains('hidden');
        el.classList.toggle('hidden', !wasHidden);
        this.textContent=wasHidden?'▾ Case details':'▸ Case details';
      " style="background:none;border:none;cursor:pointer;font-size:11px;font-weight:600;color:var(--text-muted);padding:4px 0;">
        ▸ Case details
      </button>
      <div id="${caseUid}" class="hidden">
        ${caseRows.length ? infoRows(caseRows) : ''}
        ${iv.caseNotes ? `<div class="wir-notes" style="margin-top:8px;"><div class="wir-notes-label">Case Notes</div><div class="wir-notes-text">${esc(iv.caseNotes)}</div></div>` : ''}
      </div>
    </div>`;
  }

  html += '</div>';
  return html;
}

// ── Academic / Trade monthly progress sections ──────────────
function buildHSMonthlySection(p) {
  if (!p.academic || p.academic.type !== 'HS') return '';

  const student = _hsMonthlyByStudent[p.academicId];
  if (!student || !student.months.length) return '';

  const uid = 'hsmonthly-' + (p.id || '').replace(/\W/g, '');

  let html = `<div class="info-section">
    <h3 onclick="toggleSection('${uid}', this)" style="cursor:pointer;">
      ${ICONS.sparkline} Academic Progress Over Time
      <span style="font-size:11px;font-weight:400;color:var(--text-muted);margin-left:6px;">${student.months.length} month${student.months.length !== 1 ? 's' : ''}</span>
      <span style="margin-left:auto;font-size:11px;color:var(--text-muted);">▾</span>
    </h3>
    <div id="${uid}">`;

  const totalGained = student.totalCreditsGained;
  html += `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;">
    <div style="background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center;">
      <div style="font-size:10px;font-weight:700;color:var(--text-muted);margin-bottom:4px;">Credits at Start</div>
      <div style="font-size:18px;font-weight:700;color:var(--text);">${student.earliestCredits ?? '—'}</div>
    </div>
    <div style="background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center;">
      <div style="font-size:10px;font-weight:700;color:var(--text-muted);margin-bottom:4px;">Credits Now</div>
      <div style="font-size:18px;font-weight:700;color:var(--text);">${student.latestCredits ?? '—'}</div>
    </div>
    <div style="background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center;">
      <div style="font-size:10px;font-weight:700;color:var(--text-muted);margin-bottom:4px;">Total Reduced</div>
      <div style="font-size:18px;font-weight:700;color:${totalGained > 0 ? 'var(--low)' : totalGained < 0 ? 'var(--high)' : 'var(--text)'};">${totalGained > 0 ? '-' + totalGained : totalGained}</div>
    </div>
  </div>`;

  html += `<table style="width:100%;border-collapse:collapse;font-size:12px;">
    <thead>
      <tr style="background:var(--bg4);border-bottom:2px solid var(--border);">
        <th style="padding:7px 10px;text-align:left;color:var(--text-muted);font-size:11px;font-weight:700;text-transform:uppercase;">Month</th>
        <th style="padding:7px 10px;text-align:center;color:var(--text-muted);font-size:11px;font-weight:700;text-transform:uppercase;">Start</th>
        <th style="padding:7px 10px;text-align:center;color:var(--text-muted);font-size:11px;font-weight:700;text-transform:uppercase;">End</th>
        <th style="padding:7px 10px;text-align:center;color:var(--text-muted);font-size:11px;font-weight:700;text-transform:uppercase;">Reduced</th>
        <th style="padding:7px 10px;text-align:center;color:var(--text-muted);font-size:11px;font-weight:700;text-transform:uppercase;">Status</th>
      </tr>
    </thead>
    <tbody>`;

  student.months.forEach(m => {
    // Treat both null and undefined as "no value" —
    const gained = (m.creditsGained === null || m.creditsGained === undefined) ? null : m.creditsGained;

    const color   = m.inProgress   ? 'var(--text-muted)'
                  : gained === null ? 'var(--text-muted)'
                  : gained > 0     ? 'var(--low)'
                  : gained === 0   ? 'var(--medium)'
                  : 'var(--high)';

    const gainStr = m.inProgress    ? '—'
                  : gained === null ? '—'
                  : gained > 0      ? '-' + gained
                  : gained === 0    ? '0'
                  : '+' + Math.abs(gained) + ' ' + _warnGlyph;

    const status  = m.inProgress ? '<span style="color:var(--text-muted);font-style:italic;">In Progress</span>'
                  : gained === null ? '<span style="color:var(--text-muted);">No Data</span>'
                  : gained < 0      ? `<span style="color:var(--high);">${_warnGlyph} Credits Added</span>`
                  : gained === 0    ? '<span style="color:var(--medium);">No Change</span>'
                  : '<span style="color:var(--low);">✓ Progress</span>';

    html += `<tr style="border-bottom:1px solid var(--border);">
      <td style="padding:8px 10px;font-weight:600;color:var(--accent-mid);">${esc(m.month)}</td>
      <td style="padding:8px 10px;text-align:center;">${m.startCredits ?? '—'}</td>
      <td style="padding:8px 10px;text-align:center;">${m.inProgress ? '<span style="color:var(--text-muted);font-style:italic;">Pending</span>' : (m.endCredits ?? '—')}</td>
      <td style="padding:8px 10px;text-align:center;font-weight:700;color:${color};">${gainStr}</td>
      <td style="padding:8px 10px;text-align:center;">${status}</td>
    </tr>`;
  });

  html += `</tbody></table></div></div>`;
  return html;
}

function buildTradeMonthlySection(p) {
  if (!p.trades || !p.trades.length) return '';

  // Only build sections for trades that actually have monthly snapshot history —
  const tradesWithHistory = p.trades.filter(t => t.monthlyProgress && t.monthlyProgress.length);
  if (!tradesWithHistory.length) return '';

  return tradesWithHistory.map(t => _buildSingleTradeMonthlySection(p, t)).join('');
}

function _buildSingleTradeMonthlySection(p, trade) {
  const months = trade.monthlyProgress;
  const uid = 'trademonthly-' + (p.id || '').replace(/\W/g, '') + '-' + String(trade.tarName || '').replace(/\W/g, '');

  // Totals — mirrors the HS section's "Credits at Start / Now / Total Reduced" cards, but for trade % gained instead of credits reduced.
  const completed = months.filter(m => !m.addedPostFirst && m.overallGain !== null && m.overallGain !== undefined);
  const totalGained = +completed.reduce((sum, m) => sum + m.overallGain, 0).toFixed(1);
  const earliestPct = months[0] ? months[0].endOverallPct : null;
  const latestPct   = months[months.length - 1] ? months[months.length - 1].endOverallPct : null;

  let html = `<div class="info-section">
    <h3 onclick="toggleSection('${uid}', this)" style="cursor:pointer;">
      ${ICONS.sparkline} Trade Progress Over Time
      <span style="font-size:11px;font-weight:400;color:var(--text-muted);margin-left:6px;">${esc(trade.tarName || 'Trade')} · ${months.length} month${months.length !== 1 ? 's' : ''}</span>
      <span style="margin-left:auto;font-size:11px;color:var(--text-muted);">▾</span>
    </h3>
    <div id="${uid}">`;

  html += `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;">
    <div style="background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center;">
      <div style="font-size:10px;font-weight:700;color:var(--text-muted);margin-bottom:4px;">% at Start</div>
      <div style="font-size:18px;font-weight:700;color:var(--text);">${earliestPct != null ? earliestPct.toFixed(1) + '%' : '—'}</div>
    </div>
    <div style="background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center;">
      <div style="font-size:10px;font-weight:700;color:var(--text-muted);margin-bottom:4px;">% Now</div>
      <div style="font-size:18px;font-weight:700;color:var(--text);">${latestPct != null ? latestPct.toFixed(1) + '%' : '—'}</div>
    </div>
    <div style="background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center;">
      <div style="font-size:10px;font-weight:700;color:var(--text-muted);margin-bottom:4px;">Total Gained</div>
      <div style="font-size:18px;font-weight:700;color:${totalGained > 0 ? 'var(--low)' : totalGained < 0 ? 'var(--high)' : 'var(--text)'};">${totalGained > 0 ? '+' + totalGained : totalGained}%</div>
    </div>
  </div>`;

  html += `<table style="width:100%;border-collapse:collapse;font-size:12px;">
    <thead>
      <tr style="background:var(--bg4);border-bottom:2px solid var(--border);">
        <th style="padding:7px 10px;text-align:left;color:var(--text-muted);font-size:11px;font-weight:700;text-transform:uppercase;">Month</th>
        <th style="padding:7px 10px;text-align:center;color:var(--text-muted);font-size:11px;font-weight:700;text-transform:uppercase;">% at End</th>
        <th style="padding:7px 10px;text-align:center;color:var(--text-muted);font-size:11px;font-weight:700;text-transform:uppercase;">Gain</th>
        <th style="padding:7px 10px;text-align:center;color:var(--text-muted);font-size:11px;font-weight:700;text-transform:uppercase;">Status</th>
      </tr>
    </thead>
    <tbody>`;

  months.forEach(m => {
    // Treat null/undefined the same way the HS section does — a strict === null check alone would let undefined slip through into NaN.
    const gained = (m.overallGain === null || m.overallGain === undefined) ? null : m.overallGain;
    const isNew  = m.addedPostFirst === true;

    const color   = isNew           ? 'var(--text-muted)'
                  : gained === null ? 'var(--text-muted)'
                  : gained >= 3     ? 'var(--low)'
                  : gained > 0      ? 'var(--medium)'
                  : gained === 0    ? 'var(--medium)'
                  : 'var(--high)';

    const gainStr = isNew            ? '—'
                  : gained === null  ? '—'
                  : gained > 0       ? '+' + gained + '%'
                  : gained === 0     ? '0%'
                  : gained + '%' + ' ' + _warnGlyph;

    const status  = isNew            ? '<span style="color:var(--text-muted);">Added Mid-Program</span>'
                  : gained === null  ? '<span style="color:var(--text-muted);">No Data</span>'
                  : gained < 0       ? `<span style="color:var(--high);">${_warnGlyph} Lost Ground</span>`
                  : gained < 3       ? '<span style="color:var(--medium);">Stalled</span>'
                  : '<span style="color:var(--low);">✓ Progress</span>';

    html += `<tr style="border-bottom:1px solid var(--border);">
      <td style="padding:8px 10px;font-weight:600;color:var(--accent-mid);">${esc(m.month)}</td>
      <td style="padding:8px 10px;text-align:center;">${m.endOverallPct != null ? m.endOverallPct.toFixed(1) + '%' : '—'}</td>
      <td style="padding:8px 10px;text-align:center;font-weight:700;color:${color};">${gainStr}</td>
      <td style="padding:8px 10px;text-align:center;">${status}</td>
    </tr>`;
  });

  html += `</tbody></table></div></div>`;
  return html;
}

function saveOverride(type) {
  if (!currentModalProfile) return;
  const id = currentModalProfile.id;
  let value = '';
  if      (type === 'academic_status') { value = document.getElementById('ovAcademicStatus').value; if (!value) { clearOverride(type); return; } }
  else if (type === 'trade_status')    { value = document.getElementById('ovTradeStatus').value;    if (!value) { clearOverride(type); return; } }
  else if (type === 'trade_name')      { value = document.getElementById('ovTradeName').value;      if (!value) { clearOverride(type); return; } }
  else if (type === 'hsd_class')       { value = document.getElementById('ovHsdClass').value;       if (!value) { clearOverride(type); return; } }
  applyOverrideLocally(id, type, value);
  google.script.run.withFailureHandler(err => onOverrideError(id, err)).setOverride(id, type, value, '', _currentEmployeeId, _currentRole);
}

function clearOverride(type) {
  if (!currentModalProfile) return;
  const id = currentModalProfile.id;
  applyOverrideLocally(id, type, '');
  google.script.run.withFailureHandler(err => onOverrideError(id, err)).setOverride(id, type, '', '', 'staff');
}

// ── Row highlight after save ───────────────────────────────────
// After saving, it's easy to lose track of which row you were just on, especially once the table re-sorts.
function _flashRowSaved(id) {
  if (!id) return;
  const checkbox = document.querySelector('.row-check[data-id="' + CSS.escape(String(id)) + '"]');
  const row = checkbox ? checkbox.closest('tr') : null;
  if (!row) return;
  row.classList.remove('row-just-saved');
  void row.offsetWidth; // force reflow so the animation restarts if it's already mid-flash
  row.classList.add('row-just-saved');
  setTimeout(() => row.classList.remove('row-just-saved'), 2200);
}

function applyOverrideLocally(id, type, value) {
  const p = allProfiles.find(x => x.id === id);
  if (!p) return;
  if      (type === 'academic_status') p.academicStatusOverride = value || null;
  else if (type === 'trade_status')    p.tradeStatusOverride    = value || null;
  else if (type === 'trade_name')      p.tradeNameOverride      = value || null;
  else if (type === 'hsd_class')       p.hsdOverride            = value || null;
  currentModalProfile = p;
  applyFilters();
  _flashRowSaved(id);
  openModal(id);
  const flash = document.getElementById('overrideSaved');
  if (flash) { flash.classList.add('show'); setTimeout(() => flash.classList.remove('show'), 2500); }
}

function onOverrideError(id, err) {
  const msg = typeof err === 'string' ? err : (err?.message || 'Save failed — please try again.');
  const box = document.getElementById('overrideError');
  if (box) { box.textContent = msg; box.classList.add('show'); setTimeout(() => box.classList.remove('show'), 4000); }
}

function toggleSection(uid, headerEl) {
  const body = document.getElementById(uid);
  if (!body) return;
  const isHidden = body.classList.contains('hidden') || body.style.display === 'none';
  body.classList.toggle('hidden', !isHidden);
  body.style.display = ''; // clear any leftover inline override from before this fix
  const chevron = headerEl.querySelector('.sidebar-chevron') || headerEl.querySelector('span:last-child');
  if (chevron) chevron.textContent = isHidden ? '▾' : '▸';
}
