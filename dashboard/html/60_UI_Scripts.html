          ${_dlRow('Days to ETAR', t.daysToETAR != null ? t.daysToETAR + ' days' : null)}
        </div>`;
    });
    html += `</div></div>`;
  } else if (p.tradeComplete && p.completedTrades && p.completedTrades.length) {
    html += `<div class="section"><div class="section-title"><span>Trades</span></div><div class="section-body">
      ${p.completedTrades.map(n => `<div style="font-size:9.5px;">${_escP(n)} \u2014 Trade Complete</div>`).join('')}
    </div></div>`;
  }

  if (p.intervention) {
    const iv = p.intervention;
    const metaParts = [];
    if (iv.gradGap) metaParts.push('Grad window: ' + iv.gradGap.trim());
    if (iv.adminPriority) metaParts.push('Admin priority: ' + iv.adminPriority);
    if (iv.urgency) metaParts.push('Urgency: ' + iv.urgency);
    html += `
      <div class="section">
        <div class="section-title"><span>Weekly Check-In Report</span><span class="st-count">${_escP(iv.weekLabel || '')}</span></div>
        <div class="section-body">
          ${metaParts.length || iv.reason ? `<div class="callout">
            ${metaParts.length ? `<div class="callout-label">${_escP(metaParts.join(' \u00B7 '))}</div>` : ''}
            ${iv.reason ? _escP(iv.reason) : ''}
          </div>` : ''}
          <div class="dl-grid">
            ${_dlRow('Progress', pctStr(iv.percent))}
            ${_dlRow('This week', iv.thisWeekHours)}
            ${_dlRow('Credits', iv.credits)}
            ${_dlRow('Course days', iv.courseDaysLeft)}
            ${_dlRow('Trajectory', iv.trajectory)}
          </div>
        </div>
      </div>`;
  }

  // Schedule + TABE side by side, built synchronously from cached data if available (schedule is fetched async elsewhere in the app —
  let scheduleHtml = '';
  const scheduleContainer = document.getElementById('schedule-' + String(p.academicId || p.id || '').replace(/\W/g, ''));
  if (scheduleContainer && scheduleContainer.dataset.printRows) {
    scheduleHtml = scheduleContainer.dataset.printRows;
  }

  let tabeHtml = '';
  if (p.tabe && (p.tabe.math || p.tabe.reading)) {
    const rows = [];
    if (p.tabe.math) rows.push(['Mathematics', p.tabe.math]);
    if (p.tabe.reading) rows.push(['Reading', p.tabe.reading]);

        <div class="section-title"><span>TABE Scores</span></div>
        <table class="doc-table">
          <thead><tr><th>Subject</th><th>Prev</th><th>Curr</th><th>Gain</th></tr></thead>

              <td>${sub.previous ? sub.previous.scale : '\u2014'}</td>
              <td>${sub.current ? sub.current.scale : '\u2014'}</td>

          </tbody>
        </table>
      </div>`;
  }

  if (scheduleHtml || tabeHtml) {
    html += `<div class="two-col">${scheduleHtml}${tabeHtml}</div>`;

  if (p.academicId && _hsMonthlyByStudent[p.academicId] && _hsMonthlyByStudent[p.academicId].months.length) {
    const months = _hsMonthlyByStudent[p.academicId].months;
    html += `
      <div class="section">
        <div class="section-title"><span>Academic Progress Over Time</span></div>
        <table class="doc-table">
          <thead><tr><th>Month</th><th>Start credits</th><th>End credits</th><th>Reduced</th><th>Status</th></tr></thead>
          <tbody>
            ${months.map(m => `<tr>
              <td>${_escP(m.month)}</td>
              <td>${m.startCredits ?? '\u2014'}</td>
              <td>${m.inProgress ? 'Pending' : (m.endCredits ?? '\u2014')}</td>
              <td>${m.inProgress ? '\u2014' : (m.creditsGained != null ? (m.creditsGained > 0 ? '-' : '') + Math.abs(m.creditsGained) : '\u2014')}</td>
              <td>${m.inProgress ? 'In progress' : (m.creditsGained > 0 ? 'Progress' : m.creditsGained === 0 ? 'No change' : 'Credits added')}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }

  html += _printFooter();
  return html;
}

function _buildPrintTranscriptDoc(p, transcriptData) {
  let html = _printMasthead(p, 'Academic Transcript', 'TR');

  const courses = (transcriptData && transcriptData.courses) || [];
  const credits = TargetDateEngine.calculateCredits(courses, _getCourseIdCategoryMap());
  const totalEarned = credits.reduce((s, c) => s + c.earned, 0);
  const totalMax    = credits.reduce((s, c) => s + c.max, 0);
  const totalRemaining = Math.max(totalMax - totalEarned, 0);
  const completedCount = courses.filter(c => c.completed).length;
  const inProgress     = courses.filter(c => !c.completed && !c.transfer).length;

  html += `
    <div class="summary-strip">
      <div class="summary-cell"><div class="sc-label">Credits Earned</div><div class="sc-value">${totalEarned.toFixed(1)}</div></div>
      <div class="summary-cell"><div class="sc-label">Credits Remaining</div><div class="sc-value">${totalRemaining.toFixed(1)}</div></div>
      <div class="summary-cell"><div class="sc-label">Completed</div><div class="sc-value">${completedCount}</div></div>
      <div class="summary-cell"><div class="sc-label">In Progress</div><div class="sc-value">${inProgress}</div></div>
    </div>

    <div class="credit-bars">
      <div class="credit-bars-title">Credits by Category</div>
      ${credits.map(c => {
        const pctFill = c.max > 0 ? Math.min((c.earned / c.max) * 100, 100) : 0;
        return `<div class="credit-row">
          <span class="credit-label">${_escP(c.category)}</span>
          <div class="credit-track"><div class="credit-fill" style="width:${pctFill}%;"></div></div>
          <span class="credit-num">${c.earned.toFixed(1)} / ${c.max}</span>
        </div>`;
      }).join('')}
    </div>`;

  [1, 2].forEach(blockNum => {
    const blockCourses = courses.filter(c => c.block === blockNum);
    if (!blockCourses.length) return;
    html += `
      <div class="section">
        <div class="section-title"><span>Year ${blockNum}</span><span class="st-count">${blockCourses.length} course${blockCourses.length !== 1 ? 's' : ''}</span></div>
        <table class="doc-table">
          <thead><tr><th>Course</th><th>Subject</th><th>Credit</th><th>Hours</th><th>Start</th><th>Target date</th><th>Status</th></tr></thead>
          <tbody>
            ${blockCourses.map(c => {
              const status = TargetDateEngine.getStatus(c.targetDate, c.completed, c.transfer);
              const statusLabel = { overdue: 'Overdue', 'on-track': 'On track', completed: 'Completed', transfer: 'Transfer', 'no-date': '\u2014' }[status] || status;
              const statusCls = { overdue: 'status-overdue', 'on-track': 'status-ontrack', completed: 'status-complete' }[status] || '';
              return `<tr>
                <td>${_escP(c.courseName)}</td>
                <td>${_escP(c.subject || '\u2014')}</td>
                <td>${c.credit || 0}</td>
                <td>${c.classHours || 0}</td>
                <td>${_escP(c.adjStart || c.startDate || '\u2014')}</td>
                <td>${c.completed ? '\u2014' : _escP(c.targetDate || '\u2014')}</td>
                <td class="status-tag ${statusCls}">${statusLabel}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  });

  html += _printFooter();
  return html;
}

function _ensurePrintDocEl() {
  let el = document.getElementById('printDoc');
  if (!el) {
    el = document.createElement('div');
    el.id = 'printDoc';
    document.body.appendChild(el);
  }
  return el;
}

function printOverview() {
  if (!currentModalProfile) return;
  const el = _ensurePrintDocEl();
  el.innerHTML = _buildPrintOverviewDoc(currentModalProfile);
  window.print();
}

function printTranscript() {
  if (!currentModalProfile || !currentModalProfile.academicId) {
    showToast('No academic ID on file for this student \u2014 nothing to print.', 'error');
    return;
  }

  const alreadyLoaded = _transcriptData && _transcriptStudentId === currentModalProfile.academicId;
  if (alreadyLoaded) {
    const el = _ensurePrintDocEl();
    el.innerHTML = _buildPrintTranscriptDoc(currentModalProfile, _transcriptData);
    window.print();
    return;
  }

  showToast('Loading transcript\u2026');
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result || result.success === false) {
        showToast((result && result.error) || 'Could not load transcript for printing.', 'error');
        return;
      }
      const el = _ensurePrintDocEl();
      el.innerHTML = _buildPrintTranscriptDoc(currentModalProfile, result);
      window.print();
    })
    .withFailureHandler(function(err) {
      showToast((err && err.message) || 'Failed to load transcript.', 'error');
    })
    .getStudentTranscript(currentModalProfile.academicId);
}

window.addEventListener('afterprint', function() {
  const el = document.getElementById('printDoc');
  if (el) el.innerHTML = '';
});

// 29. Role-based presets
const ROLE_PRESETS = {
  manager:   { risk: 'ALL',  type: 'ALL',          search: '', sort: 'risk',        label: 'Manager view' },
  counselor: { risk: 'ALL',  type: 'INTERVENTION', search: '', sort: 'risk',        label: 'Counselor view' },
  teacher:   { risk: 'HIGH', type: 'ALL',          search: '', sort: 'academicPct', label: 'Teacher view' },
};

function applyRolePreset(role) {
  if (!role) return;
  try { localStorage.setItem('dashRole', role); } catch(e) {}
  const preset = ROLE_PRESETS[role];
  if (!preset) return;
  const riskBtn = document.querySelector(`[data-risk="${preset.risk}"]`);
  if (riskBtn) { document.querySelectorAll('[data-risk]').forEach(b => b.classList.remove('active')); riskBtn.classList.add('active'); activeRisk = preset.risk; }
  const typeBtn = document.querySelector(`[data-type="${preset.type}"]`);
  if (typeBtn) { document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active')); typeBtn.classList.add('active'); activeType = preset.type; }
  const sortEl   = document.getElementById('sortSelect');
  if (sortEl && preset.sort) sortEl.value = preset.sort;
  const searchEl = document.getElementById('searchInput');
  if (searchEl) searchEl.value = preset.search || '';
  applyFilters();
}

// 30. Email digest
function triggerDigest() {
  const highCount   = allProfiles.filter(p => p.risk && p.risk.level === 'HIGH').length;
  const mediumCount = allProfiles.filter(p => p.risk && p.risk.level === 'MEDIUM').length;
  const preview     = document.getElementById('digestPreview');
  if (preview) preview.textContent = `${highCount} high-risk and ${mediumCount} watch-closely students will be included.`;
  try { const saved = localStorage.getItem('digestRecipients'); const input = document.getElementById('digestEmailInput'); if (saved && input) input.value = saved; } catch(e) {}
  document.getElementById('digestError').classList.remove('show');
  document.getElementById('digestSuccess').classList.remove('show');
  document.getElementById('digestModal').classList.remove('hidden');
}

function closeDigestModal(e) {
  if (e && e.target !== document.getElementById('digestModal')) return;
  document.getElementById('digestModal').classList.add('hidden');
}

function confirmDigest() {
  const raw        = (document.getElementById('digestEmailInput').value || '');
  const recipients = raw.split(/[\n,]+/).map(s => s.trim()).filter(s => s.includes('@'));
  if (!recipients.length) {
    const errEl = document.getElementById('digestError');
    errEl.textContent = 'Please enter at least one valid email address.';
    errEl.classList.add('show');
    return;
  }
  try { localStorage.setItem('digestRecipients', raw); } catch(e) {}
  const btn = document.getElementById('digestSendBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  document.getElementById('digestError').classList.remove('show');
  google.script.run
    .withSuccessHandler(result => {
      if (btn) { btn.disabled = false; btn.textContent = 'Send'; }
      const ok = document.getElementById('digestSuccess');
      ok.textContent = `Sent to ${result.sent} recipient${result.sent !== 1 ? 's' : ''} — ${result.highRisk} high-risk and ${result.mediumRisk || 0} watch-closely students included.`;
      ok.classList.add('show');
      setTimeout(() => { ok.classList.remove('show'); document.getElementById('digestModal').classList.add('hidden'); }, 2500);
    })
    .withFailureHandler(err => {
      if (btn) { btn.disabled = false; btn.textContent = 'Send'; }
      const errEl = document.getElementById('digestError');
      errEl.textContent = err?.message || 'Send failed — please try again.';
      errEl.classList.add('show');
    })
    .sendDigest(recipients, _currentRole);
}

// 31. Schedule section (student modal)
function buildScheduleSection(p) {
  const studentId = p.academicId || p.id || '';
  if (!studentId) return '';

  const uid = 'schedule-' + studentId.replace(/\W/g, '');

  google.script.run
    .withSuccessHandler(function(result) {
      const container = document.getElementById(uid);
      if (!container) return;
      if (result.error) {
        container.innerHTML = '';
        return;
      }
      const hasRealSchedule = !!result.weekLabel;

      // Categorize WHY there's no schedule, using data already on
      // the profile (trade assignment, academic enrollment) instead
      // of guessing at hours from history. MyPace 1/2 shows up as a
      // trade-overview row but represents pre-assignment orientation,
      // not a real trade — checked separately so a brand-new student
      // doesn't get mistaken for "in trades."
      const realTrades  = (p.trades || []).filter(t => !/mypace/i.test(t.tarName || ''));
      const isMyPaceOnly = !realTrades.length && (p.trades || []).some(t => /mypace/i.test(t.tarName || ''));
      const hasRealTrade = realTrades.length > 0;
      const hasAcademicEnrollment = !!p.academic || !!p.hasAcademic;

      let noScheduleState;
      if (hasRealTrade) {
        noScheduleState = { label: 'In Trades', note: null };
      } else if (isMyPaceOnly) {
        noScheduleState = { label: 'No HSD or Trade Yet', note: null };
      } else if (hasAcademicEnrollment) {
        noScheduleState = { label: '0.0 h', note: 'No schedule uploaded yet for this week.' };
      } else {
        noScheduleState = { label: 'No Current Schedule', note: null };
      }

      const isWeekend  = result.isWeekend;
      const todayLabel = result.todayLabel;

      let html = `<div class="info-section">
        <h3>${ICONS.calendar} Schedule${hasRealSchedule ? ` <span style="font-weight:400;font-size:11px;color:var(--text-muted);">${esc(result.weekLabel)}</span>` : ''}</h3>`;

      if (!isWeekend && hasRealSchedule && result.expectedWeekHours > 0) {
        html += `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;">
          <div style="background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center;">
            <div style="font-size:10px;font-weight:700;color:var(--text-muted);margin-bottom:4px;">Expected This Week</div>
            <div style="font-size:18px;font-weight:700;color:var(--text);">${result.expectedWeekHours} h</div>
          </div>
          <div style="background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center;">
            <div style="font-size:10px;font-weight:700;color:var(--text-muted);margin-bottom:4px;">Expected Today</div>
            <div style="font-size:18px;font-weight:700;color:var(--text);">${result.expectedTodayHours !== null ? result.expectedTodayHours + ' h' : '—'}</div>
          </div>
          <div style="background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center;">
            <div style="font-size:10px;font-weight:700;color:var(--text-muted);margin-bottom:4px;">Worked This Week</div>
            <div style="font-size:18px;font-weight:700;color:${
              (() => {
                const twd = computeThisWeekDisplay_(p);
                const isRealWorkedNumber = twd.kind === 'worked' || twd.kind === 'worked-zero';
                return (isRealWorkedNumber && result.expectedWeekHours > 0)
                  ? (+p.thisWeekWorkedHours >= result.expectedWeekHours * 0.5 ? 'var(--low)' : 'var(--high)')
                  : 'var(--text)';
              })()
            };">${
              esc(computeThisWeekDisplay_(p).label)
            }</div>
          </div>
        </div>`;
      } else if (!hasRealSchedule) {
        html += `<div style="background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:14px;text-align:center;margin-bottom:14px;">
          <div style="font-size:16px;font-weight:700;color:var(--text);">${esc(noScheduleState.label)}</div>
          ${noScheduleState.note ? `<div style="font-size:11px;color:var(--text-muted);font-style:italic;margin-top:6px;">${esc(noScheduleState.note)}</div>` : ''}
        </div>`;
        container.innerHTML = html + '</div>';
        return;
      }

      if (!isWeekend && todayLabel) {
        html += `<div style="font-size:11px;font-weight:700;color:var(--accent-mid);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">${esc(todayLabel)}'s Schedule</div>`;
        const todaySched = result.todaySchedule || {};
        const slots = Object.keys(todaySched).sort((a, b) =>
          (parseInt(a.replace('Period ','')) || 0) - (parseInt(b.replace('Period ','')) || 0)
        );
        if (!slots.length) {
          html += `<div style="font-size:12px;color:var(--text-muted);font-style:italic;">No classes scheduled today.</div>`;
        } else {
          slots.forEach(slot => {
            const entry = todaySched[slot];
            const ACADEMIC_NAMES = ['HSD 2', 'HSD3', 'HSE/HSD1'];
            const isAcademic = ACADEMIC_NAMES.some(n => (entry.class || '').toLowerCase().includes(n.toLowerCase()));
            html += `<div class="info-row">
              <span class="label" style="font-size:11px;white-space:nowrap;">
                ${esc(slot)}${isAcademic ? '<span style="color:var(--accent-mid);font-size:10px;margin-left:4px;">●</span>' : ''}
              </span>
              <span class="value" style="text-align:right;">
                <div style="font-size:13px;">${esc(entry.class || '—')}</div>
                ${entry.location ? `<div style="font-size:11px;color:var(--text-muted);margin-top:1px;">${esc(entry.location)}</div>` : ''}
              </span>
            </div>`;
          });
        }

        const schedule = result.schedule || {};
        const DAYS = ['M','T','W','TH','F'];
        const DAY_LABELS = { M:'Mon', T:'Tue', W:'Wed', TH:'Thu', F:'Fri' };
        const allPeriods = [...new Set(Object.keys(schedule))].sort((a,b) =>
          (parseInt(a.replace('Period ',''))||0) - (parseInt(b.replace('Period ',''))||0)
        );
        if (allPeriods.length) {
          const weekUid = 'sched-week-' + uid;
          html += `<div style="margin-top:12px;">
            <button onclick="
              const el=document.getElementById('${weekUid}');const open=el.style.display!=='none';
              el.style.display=open?'none':'block';this.textContent=open?'▸ Full week schedule':'▾ Full week schedule';
            " style="background:none;border:none;cursor:pointer;font-size:11px;font-weight:600;color:var(--text-muted);padding:4px 0;">
              ▸ Full week schedule
            </button>
            <div id="${weekUid}" style="display:none;margin-top:8px;overflow-x:auto;">
              <table style="width:100%;border-collapse:collapse;font-size:12px;">
                <thead>
                  <tr>
                    <th style="padding:5px 8px;background:var(--bg4);border:1px solid var(--border);text-align:left;color:var(--text-muted);font-size:10px;text-transform:uppercase;">Period</th>
                    ${DAYS.map(d => `<th style="padding:5px 8px;background:var(--bg4);border:1px solid var(--border);text-align:left;color:var(--text-muted);font-size:10px;">${DAY_LABELS[d]}</th>`).join('')}
                  </tr>
                </thead>
                <tbody>
                  ${allPeriods.map(period => {
                    if (period === 'Period 4') return '';
                    return `<tr>
                      <td style="padding:6px 8px;border:1px solid var(--border);background:var(--bg4);font-weight:600;color:var(--accent-mid);white-space:nowrap;">${esc(period)}</td>
                      ${DAYS.map(day => {
                        const entry = (schedule[period] || {})[day];
                        return `<td style="padding:6px 8px;border:1px solid var(--border);vertical-align:top;">
                          ${entry ? `<div style="font-weight:600;color:var(--text);">${esc(entry.class)}</div>${entry.location ? `<div style="color:var(--text-muted);font-size:11px;">${esc(entry.location)}</div>` : ''}` : '<span style="color:var(--border-bright);">—</span>'}
                        </td>`;
                      }).join('')}
                    </tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>`;
        }

      } else if (isWeekend) {
        html += `<div style="font-size:12px;color:var(--text-muted);font-style:italic;">No schedule on weekends.</div>`;
      }

      if (!result.schedule || !Object.keys(result.schedule).length) {
        html += `<div style="font-size:12px;color:var(--text-muted);font-style:italic;margin-top:8px;">No schedule on file for this week.</div>`;
      }

      html += '</div>';
      container.innerHTML = html;

      try {
        const printRows = (result.todaySchedule && Object.keys(result.todaySchedule).length)
          ? `<div class="section">
               <div class="section-title"><span>Schedule</span><span class="st-count">${esc(result.weekLabel || '')}</span></div>
               <table class="doc-table">
                 <thead><tr><th>Period</th><th>Class</th></tr></thead>
                 <tbody>
                   ${Object.keys(result.todaySchedule)
                     .sort((a,b) => (parseInt(a.replace('Period ',''))||0) - (parseInt(b.replace('Period ',''))||0))
                     .map(period => {
                       const entry = result.todaySchedule[period];
                       return `<tr><td>${esc(period.replace('Period ',''))}</td><td>${esc(entry.class || '\u2014')}</td></tr>`;
                     }).join('')}
                 </tbody>
               </table>
             </div>`
          : '';
        container.dataset.printRows = printRows;
      } catch (e) { /* non-fatal — print will just omit the schedule section */ }
    })
    .withFailureHandler(function() {
      const container = document.getElementById(uid);
      if (container) container.innerHTML = '';
    })
    .getStudentSchedule(studentId);

  return `<div id="${uid}">
    <div class="info-section">
      <h3>${ICONS.calendar} Schedule</h3>
      <div style="display:flex;gap:8px;align-items:center;padding:8px 0;">
        <div class="skeleton-cell med" style="height:11px;width:60%;"></div>
      </div>
    </div>
  </div>`;
}

// 32. TABE section (student modal)
function buildTABESection(p) {
  if (!p.tabe || (!p.tabe.math && !p.tabe.reading)) return '';

  const t = p.tabe;
  const uid = 'tabe-' + (p.id || '').replace(/\W/g, '');

  function scoreColor(scale) {
    if (!scale) return 'var(--text-muted)';
    if (scale >= 566) return 'var(--low)';       // High Intermediate+
    if (scale >= 511) return 'var(--low)';        // Low Intermediate+
    if (scale >= 461) return 'var(--medium)';     // Beginning Basic
    return 'var(--high)';                         // Beginning Literacy
  }

  function gainHtml(gain) {
    if (gain === null || gain === undefined) return '<span style="color:var(--text-muted)">—</span>';
    const color = gain > 0 ? 'var(--low)' : gain < 0 ? 'var(--high)' : 'var(--text-muted)';
    const arrow = gain > 0 ? '▲' : gain < 0 ? '▼' : '→';
    return `<span style="font-weight:700;color:${color};">${arrow} ${gain > 0 ? '+' : ''}${gain}</span>`;
  }

  function subtestBlock(label, sub) {
    if (!sub) return `
      <div style="background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:14px 16px;">
        <div style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;">${label}</div>
        <div style="font-size:12px;color:var(--text-muted);font-style:italic;">No test record on file.</div>
      </div>`;

    const curr = sub.current;
    const prev = sub.previous;
    const best = sub.best;

    return `
      <div style="background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:14px 16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <div style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">${label}</div>
          <div style="font-size:11px;color:var(--text-muted);">${sub.attempts} attempt${sub.attempts !== 1 ? 's' : ''}</div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;">
          <div style="background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:10px;text-align:center;">
            <div style="font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:4px;">Previous</div>
            <div style="font-size:20px;font-weight:800;color:${prev ? scoreColor(prev.scale) : 'var(--text-muted)'};">
              ${prev ? prev.scale : '—'}
            </div>
            <div style="font-size:10px;color:var(--text-muted);margin-top:2px;">${prev ? prev.date : ''}</div>
          </div>
          <div style="background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:10px;text-align:center;">
            <div style="font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:4px;">Current</div>
            <div style="font-size:20px;font-weight:800;color:${scoreColor(curr.scale)};">${curr.scale}</div>
            <div style="font-size:10px;color:var(--text-muted);margin-top:2px;">${curr.date}</div>
          </div>
          <div style="background:var(--bg3);border:1px solid ${best.scale === curr.scale ? 'color-mix(in srgb, var(--low) 30%, transparent)' : 'var(--border)'};border-radius:5px;padding:10px;text-align:center;">
            <div style="font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:4px;">Best</div>
            <div style="font-size:20px;font-weight:800;color:${scoreColor(best.scale)};">${best.scale}</div>
            <div style="font-size:10px;color:var(--text-muted);margin-top:2px;">${best.date}</div>
          </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;">
          <span style="font-size:12px;color:var(--text-muted);font-weight:600;">Gain / Loss</span>
          <span style="font-size:14px;">${gainHtml(sub.gain)}</span>
        </div>

        ${curr.eflLevel ? `
        <div style="margin-top:8px;padding:7px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:11px;color:var(--text-muted);font-weight:600;">Current EFL</span>
          <span style="font-size:12px;font-weight:700;color:${scoreColor(curr.scale)};">${curr.efl !== null ? curr.efl : '—'}</span>
        </div>` : ''}
      </div>`;
  }

  return `
    <div class="info-section">
      <h3 onclick="toggleSection('${uid}', this)" style="cursor:pointer;">

let _transcriptData     = null;   // last-loaded payload from getStudentTranscript
let _transcriptStudentId = null;  // which student it belongs to, so we know to reload on switch
let _transcriptSettings  = null;  // { weeklyHours, activeWeeks }
// Set of rowIds currently expanded for editing (was a single value —
// changed so several existing rows can be open and corrected at once,
// e.g. right after auto-populate, then saved together in one batch.
let _transcriptEditingRows = new Set();

function _resetTranscriptStateIfNewStudent(p) {
  if (_transcriptStudentId !== p.academicId) {
    _transcriptData      = null;
    _transcriptSettings  = null;
    _transcriptEditingRows = new Set();
    _hoursRequiredData   = null;
    _transcriptStudentId = p.academicId || null;
  }
  const modalBox = document.querySelector('#detailModal .modal-box');
  if (modalBox) modalBox.classList.remove('tr-wide');
}

// tabIds map is used (not string-guessed capitalization) precisely because 'timelog' → 'modalTabTimeLog' has an internal capital L that a
function switchModalTab(tab) {
  const overviewBtn    = document.getElementById('modalTabOverview');
  const transcriptBtn  = document.getElementById('modalTabTranscript');
  const testingBtn     = document.getElementById('modalTabTesting');
  const timeLogBtn     = document.getElementById('modalTabTimeLog');
  const tradesBtn      = document.getElementById('modalTabTrades');
  const overviewView   = document.getElementById('modalOverviewView');
  const transcriptView = document.getElementById('modalTranscriptView');
  const testingView    = document.getElementById('modalTestingView');
  const timeLogView    = document.getElementById('modalTimeLogView');
  const tradesView     = document.getElementById('modalTradesView');

  const tabIds = {
    overview: null, transcript: 'modalTabTranscript', testing: 'modalTabTesting',
    timelog: 'modalTabTimeLog', trades: 'modalTabTrades',
  };
  if (tab !== 'overview' && !document.getElementById(tabIds[tab])) return; // tab not rendered for this role/student

  [overviewBtn, transcriptBtn, testingBtn, timeLogBtn, tradesBtn].forEach(b => b && b.classList.remove('active'));
  [overviewView, transcriptView, testingView, timeLogView, tradesView].forEach(v => v && v.classList.add('hidden'));

  const btnMap  = { overview: overviewBtn, transcript: transcriptBtn, testing: testingBtn, timelog: timeLogBtn, trades: tradesBtn };
  const viewMap = { overview: overviewView, transcript: transcriptView, testing: testingView, timelog: timeLogView, trades: tradesView };
  if (btnMap[tab])  btnMap[tab].classList.add('active');
  if (viewMap[tab]) viewMap[tab].classList.remove('hidden');

  const modalBox = document.querySelector('#detailModal .modal-box');
  if (modalBox) modalBox.classList.toggle('tr-wide', ['transcript','timelog','trades','testing'].includes(tab));

  if (tab === 'transcript') _loadTranscriptTab();
  if (tab === 'testing')    _loadTestingTab();
  if (tab === 'timelog')    _loadTimeLogTab();
  if (tab === 'trades')     _loadTradesTab();
}

// ── Testing tab (HiSET / GED) ─────────────────────────────────
const TESTING_SUBTESTS = {
  HiSET: ['Language Arts – Reading', 'Language Arts – Writing', 'Mathematics', 'Science', 'Social Studies'],
  GED:   ['Reasoning Through Language Arts', 'Mathematical Reasoning', 'Science', 'Social Studies'],
};
let _testingData = null;
let _testingStudentId = null;

function _loadTestingTab() {
  const p = currentModalProfile;
  const studentId = p ? (p.academicId || p.id) : null;
  const container = document.getElementById('testingTabContent');
  if (!studentId || !container) return;

  container.innerHTML = '<div style="padding:16px;text-align:center;color:var(--text-muted);">Loading…</div>';

  google.script.run
    .withSuccessHandler(function(result) {
      if (!result || result.success === false) {
        container.innerHTML = '<div style="padding:16px;text-align:center;color:var(--high);">' +
          esc((result && result.error) || 'Failed to load.') + '</div>';
        return;
      }
      _testingData = result;
      _testingStudentId = studentId;
      _renderTestingTab();
    })
    .withFailureHandler(function(err) {
      container.innerHTML = '<div style="padding:16px;text-align:center;color:var(--high);">' +
        esc(err && err.message ? err.message : 'Failed to load.') + '</div>';
    })
    .getStudentTestingData(studentId); // SERVER function — lives in TestingAttempts.gs
}

function _renderTestingTab() {
  const container = document.getElementById('testingTabContent');
  const data = _testingData;
  if (!container || !data) return;

  const program = data.examProgram;
  const subtestNames = TESTING_SUBTESTS[program] || [];
  const subtestMap = {};
  (data.subtests || []).forEach(s => { subtestMap[s.name] = s; });

  container.innerHTML = subtestNames.map(name => {
    const s = subtestMap[name] || { name, status: 'Not Taken', attempts: [] };
    const statusColor = s.status === 'Pass' ? 'var(--low)' : s.status === 'Fail' ? 'var(--high)' : 'var(--text-muted)';
    const uid = 'testing-' + name.replace(/\W/g, '');

    return `<div class="info-section">
      <h3 onclick="toggleSection('${uid}', this)" style="cursor:pointer;display:flex;align-items:center;gap:8px;">
        ${esc(name)}
        <span class="type-tag" style="background:${statusColor};color:#fff;margin:0;">${esc(s.status)}</span>
        <span style="margin-left:auto;font-size:11px;color:var(--text-muted);">${s.attempts.length} attempt${s.attempts.length !== 1 ? 's' : ''} ▾</span>
      </h3>
      <div id="${uid}">
        <table class="tr-table" style="width:100%;margin-bottom:10px;">
          <thead><tr><th>Date</th><th>Score</th><th>Result</th></tr></thead>
          <tbody>
            ${s.attempts.length ? s.attempts.map(a => `
              <tr>
                <td>${esc(a.date || '—')}</td>
                <td>${a.score ?? '—'}</td>
                <td style="color:${a.result === 'Pass' ? 'var(--low)' : 'var(--high)'};font-weight:600;">${esc(a.result || '—')}</td>
              </tr>`).join('') : `<tr><td colspan="3" style="text-align:center;color:var(--text-muted);font-style:italic;">No attempts logged yet.</td></tr>`}
          </tbody>
        </table>
        ${_canEditTesting() ? `
        <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;">
          <div><label style="font-size:11px;color:var(--text-muted);display:block;">Date</label>
            <input type="date" id="${uid}-date" style="background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:6px 8px;font-size:12.5px;"></div>
          <div><label style="font-size:11px;color:var(--text-muted);display:block;">Score</label>
            <input type="number" id="${uid}-score" style="width:70px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:6px 8px;font-size:12.5px;"></div>
          <div><label style="font-size:11px;color:var(--text-muted);display:block;">Result</label>
            <select id="${uid}-result" style="background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:6px 8px;font-size:12.5px;">
              <option value="Pass">Pass</option>
              <option value="Fail">Fail</option>
            </select></div>
          <button class="btn-override" onclick="_saveTestingAttempt('${esc(name)}', '${uid}')">Log Attempt</button>
        </div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function _canEditTesting() {
  return _can('edit_transcript'); // reuses the same permission as transcript edits — adjust if you want a separate permission
}

function _saveTestingAttempt(subtestName, uid) {
  const date   = document.getElementById(uid + '-date').value;
  const score  = document.getElementById(uid + '-score').value;
  const result = document.getElementById(uid + '-result').value;
  if (!date || !result) { showToast('Pick a date and result first.', 'error'); return; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || res.success === false) { showToast((res && res.error) || 'Save failed.', 'error'); return; }
      showToast('Attempt logged.');
      _testingData = null;
      _loadTestingTab();
    })
    .withFailureHandler(function(err) {
      showToast((err && err.message) || 'Save failed — please try again.', 'error');
    })
    .saveTestingAttempt(_testingStudentId, _testingData.examProgram, subtestName, date, score ? parseFloat(score) : null, result, _currentEmployeeId, _currentRole); // SERVER function — lives in TestingAttempts.gs
}

// ── Academic transcript tab ────────────────────────────────────
const TRANSCRIPT_COURSE_CATEGORIES = ['English','Math','Science','Social Studies','Language','Fine Arts','Electives'];

let _courseCatalogue = null; // cached across the session — course list rarely changes
let _hoursRequiredData = null; // { minRequired, maxRequired, matchedCount, unmatchedCourses } from getHoursRequiredForTranscript — reset per student, see _resetTranscriptStateIfNewStudent

function _getCourseIdCategoryMap() {
  const map = {};
  (_courseCatalogue || []).forEach(c => {
    if (c.classId) map[c.classId] = c.category;
  });
  return map;
}

function _loadTranscriptTab() {
  const studentId = currentModalProfile ? currentModalProfile.academicId : null;
  if (!studentId) {
    document.getElementById('transcriptLoading').style.display = 'none';
    document.getElementById('transcriptContent').classList.remove('hidden');
    document.getElementById('transcriptContent').innerHTML =
      '<div style="padding:24px;text-align:center;color:var(--text-muted);font-style:italic;">No academic ID on file for this student — transcript cannot be loaded.</div>';
    return;
  }

  if (_transcriptData && _transcriptStudentId === studentId) {
    _renderTranscriptTab();
    return;
  }

  document.getElementById('transcriptLoading').style.display = 'block';
  document.getElementById('transcriptContent').classList.add('hidden');

  google.script.run
    .withSuccessHandler(function(result) {
      document.getElementById('transcriptLoading').style.display = 'none';
      document.getElementById('transcriptContent').classList.remove('hidden');

      if (!result || result.success === false) {
        document.getElementById('transcriptContent').innerHTML =
          '<div style="padding:24px;text-align:center;color:var(--high);">' +
          esc(result && result.error ? result.error : 'Failed to load transcript.') + '</div>';
        return;
      }

      _transcriptData      = result;
      _transcriptStudentId = studentId;
      _transcriptSettings  = result.settings || { weeklyHours: 10, activeWeeks: { w1:true, w2:true, w3:true, w4:true } };
      _transcriptEditingRows = new Set();

      _renderTranscriptTab();

      google.script.run
        .withSuccessHandler(function(hoursResult) {
          _hoursRequiredData = (hoursResult && hoursResult.success) ? hoursResult : null;
          const transcriptView = document.getElementById('modalTranscriptView');
          if (transcriptView && !transcriptView.classList.contains('hidden') && _transcriptData) {
            _renderTranscriptTab();
            _reopenTranscriptEditPanels();
          }
        })
        .withFailureHandler(function() { _hoursRequiredData = null; })
        .getHoursRequiredForTranscript(studentId);

      if (!_courseCatalogue) {
        google.script.run
        .withSuccessHandler(function(catResult) {
          _courseCatalogue = (catResult && catResult.success) ? catResult.courses : [];

            const transcriptView = document.getElementById('modalTranscriptView');
          if (transcriptView && !transcriptView.classList.contains('hidden') && _transcriptData) {
            _renderTranscriptTab();
            _reopenTranscriptEditPanels();
            }
          })
          .withFailureHandler(function() { _courseCatalogue = []; })
          .getCourseCatalogue();
      }
    })
    .withFailureHandler(function(err) {
      document.getElementById('transcriptLoading').style.display = 'none';
      document.getElementById('transcriptContent').classList.remove('hidden');
      document.getElementById('transcriptContent').innerHTML =
        '<div style="padding:24px;text-align:center;color:var(--high);">Failed to load: ' +
        esc(err && err.message ? err.message : 'unknown error') + '</div>';
    })
    .getStudentTranscript(studentId);
}

function _renderTranscriptTab() {
  const data = _transcriptData;
  if (!data) return;

  const courses = data.courses || [];
  const credits  = TargetDateEngine.calculateCredits(courses, _getCourseIdCategoryMap());
  const totalEarned    = credits.reduce((s, c) => s + c.earned, 0);
  const totalMax       = credits.reduce((s, c) => s + c.max, 0);
  const totalRemaining = Math.max(totalMax - totalEarned, 0);
  const completedCount = courses.filter(c => c.completed).length;
  const inProgress     = courses.filter(c => !c.completed && !c.transfer).length;
  const overdueCount   = courses.filter(c => {
    const status = TargetDateEngine.getStatus(c.targetDate, c.completed, c.transfer);
    return status === 'overdue';
  }).length;

  let html = `
    <div class="tr-chip-row">
      <div class="tr-chip"><div class="tr-chip-label">Credits Earned</div><div class="tr-chip-value">${totalEarned.toFixed(1)}</div></div>
      <div class="tr-chip"><div class="tr-chip-label">Credits Remaining</div><div class="tr-chip-value">${totalRemaining.toFixed(1)}</div></div>
      <div class="tr-chip"><div class="tr-chip-label">Courses Completed</div><div class="tr-chip-value">${completedCount}</div></div>
      <div class="tr-chip"><div class="tr-chip-label">In Progress</div><div class="tr-chip-value">${inProgress}</div></div>
      ${overdueCount > 0 ? `<div class="tr-chip" style="border-color:color-mix(in srgb, var(--high) 35%, transparent);"><div class="tr-chip-label" style="color:var(--high);">Overdue</div><div class="tr-chip-value" style="color:var(--high);">${overdueCount}</div></div>` : ''}
      <div class="tr-chip" title="Minimum Amount of Hours Required — summed from Master Schedule Hours across this student's incomplete transcript courses only"><div class="tr-chip-label">Min Hours Required</div><div class="tr-chip-value">${_hoursRequiredData ? _hoursRequiredData.minRequired : '…'}</div></div>
      <div class="tr-chip" title="Maximum Amount of Hours Required — summed from Master Schedule Hours across this student's incomplete transcript courses only"><div class="tr-chip-label">Max Hours Required</div><div class="tr-chip-value">${_hoursRequiredData ? _hoursRequiredData.maxRequired : '…'}</div></div>
    </div>
    ${(_hoursRequiredData && _hoursRequiredData.unmatchedCourses && _hoursRequiredData.unmatchedCourses.length) ? `
      <div style="font-size:11px;color:var(--text-muted);margin:-10px 0 14px;">
        ${_hoursRequiredData.unmatchedCourses.length} course${_hoursRequiredData.unmatchedCourses.length === 1 ? '' : 's'} not found in Master Schedule Hours, so ${_hoursRequiredData.unmatchedCourses.length === 1 ? "it isn't" : "they aren't"} counted above: ${esc(_hoursRequiredData.unmatchedCourses.join(', '))}
      </div>
    ` : ''}

    <div style="margin-bottom:18px;">
      <div style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;">Credits by Category</div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        ${credits.map(c => {
          const pctFill = c.max > 0 ? Math.min((c.earned / c.max) * 100, 100) : 0;
          const barColor = pctFill >= 100 ? 'var(--low)' : pctFill >= 50 ? 'var(--medium)' : 'var(--accent-dim)';
          return `<div style="display:flex;align-items:center;gap:10px;">
            <span style="width:110px;font-size:12px;color:var(--text-soft);flex-shrink:0;">${esc(c.category)}</span>
            <div style="flex:1;height:8px;background:var(--bg4);border-radius:4px;overflow:hidden;">
              <div style="height:100%;width:${pctFill}%;background:${barColor};border-radius:4px;"></div>
            </div>
            <span style="width:70px;text-align:right;font-size:12px;font-weight:600;color:var(--text-muted);flex-shrink:0;">${c.earned.toFixed(1)} / ${c.max}</span>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
      <button class="btn-override" onclick="_openTranscriptSettings()" style="font-size:12px;padding:6px 12px;">
        ⚙ Pacing Settings (${_transcriptSettings.weeklyHours}h/wk)
      </button>
      <span style="font-size:11px;color:var(--text-muted);font-style:italic;">
        Target dates recalculate live as you edit hours or start dates below.
      </span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
      <button class="btn-override" onclick="_openTranscriptSettings()" style="font-size:12px;padding:6px 12px;">
        ⚙ Pacing Settings (${_transcriptSettings.weeklyHours}h/wk)
      </button>
      <button class="btn-override" onclick="_autoPopulateTranscript()" style="font-size:12px;padding:6px 12px;">
        Auto-Populate Transcript
      </button>
      <span style="font-size:11px;color:var(--text-muted);font-style:italic;">
        Target dates recalculate live as you edit hours or start dates below.
      </span>
    </div>
  `;

  html += _renderTranscriptBlock(1, 'Year 1', courses.filter(c => c.block === 1));
  html += _renderTranscriptBlock(2, 'Year 2', courses.filter(c => c.block === 2));

  document.getElementById('transcriptContent').innerHTML = html;
}

function _renderTranscriptBlock(blockNum, label, courses) {
  const uid = 'tr-block-' + blockNum;

  let rows = courses.map(c => _renderTranscriptRow(c)).join('');
  if (!courses.length) {
    rows = `<tr><td colspan="8" style="padding:16px;text-align:center;color:var(--text-muted);font-style:italic;">No courses in ${esc(label)} yet.</td></tr>`;
  }

  return `
    <div class="tr-block-header" style="display:flex;align-items:center;justify-content:space-between;">
      <span>${label}</span>
      ${courses.length ? `
        <span style="display:flex;gap:8px;">
          <button class="btn-override-toggle" style="font-size:11px;" onclick="_openAllTranscriptEditsInBlock(${blockNum})" title="Open every row in ${esc(label)} for editing at once">
            Bulk Edit
          </button>
          <button class="btn-override-toggle" style="font-size:11px;" onclick="_closeAllTranscriptEditsInBlock(${blockNum})" title="Collapse every open row in ${esc(label)} (does not save)">
            Collapse All
          </button>
        </span>
      ` : ''}
    </div>
    <table class="tr-table" id="${uid}" data-block="${blockNum}">
      <thead>
        <tr>
          <th>Course</th>
          <th>Subject</th>
          <th>Credit</th>
          <th>Hours</th>
          <th>Start</th>
          <th>Target Date</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="${uid}-body">
        ${rows}
        <tr class="tr-row-add" onclick="_openTranscriptAddRow(${blockNum})">
          <td colspan="8" style="padding:10px;">+ Add Course to ${esc(label)}</td>
        </tr>
      </tbody>
    </table>
  `;
}

function _renderTranscriptRow(c) {
  const status    = TargetDateEngine.getStatus(c.targetDate, c.completed, c.transfer);
  const statusMap = {
    'overdue':   { cls: 'tr-status-overdue',  label: 'Overdue' },
    'on-track':  { cls: 'tr-status-ontrack',  label: 'On Track' },
    'completed': { cls: 'tr-status-complete', label: 'Completed' },
    'transfer':  { cls: 'tr-status-transfer', label: 'Transfer' },
    'no-date':   { cls: 'tr-status-nodate',   label: 'No Date' },
  };
  const s = statusMap[status] || statusMap['no-date'];
  const rowKey = 'row-' + c.rowId;
  const isEditing = _transcriptEditingRows.has(String(c.rowId));

  const mainRow = `
    <tr class="tr-row ${isEditing ? 'editing' : ''}" onclick="_toggleTranscriptEdit('${esc(String(c.rowId))}')" id="${rowKey}">
      <td>${esc(c.courseName || '—')}</td>
      <td>${esc(c.subject || '—')}</td>
      <td>${c.credit || 0}</td>
      <td>${c.classHours || 0}</td>
      <td>${esc(c.adjStart || c.startDate || '—')}</td>
      <td>${c.completed ? '—' : (c.targetDate ? TargetDateEngine.formatDisplay(c.targetDate) : '—')}</td>
      <td><span class="tr-status-pill ${s.cls}">${s.label}</span></td>
      <td style="text-align:right;color:var(--text-muted);font-size:11px;">${isEditing ? '▾' : '▸'} Edit</td>
    </tr>`;

  const editPanelId = 'edit-' + c.rowId;
  const editPanel = `
    <tr id="${editPanelId}-row" class="${isEditing ? '' : 'hidden'}">
      <td colspan="8" style="padding:0;border-bottom:1px solid var(--border);">
        <div id="${editPanelId}" class="tr-edit-panel tr-existing-edit-panel" data-row-id="${esc(String(c.rowId))}" data-block="${c.block ?? ''}" style="margin:10px 14px;"></div>
      </td>
    </tr>`;

  return mainRow + editPanel;
}

// Opens ONE row's edit panel via direct DOM manipulation — no full
// table re-render, so any unsaved typing in OTHER currently-open
// panels is completely untouched. This was the actual bug: the old
// _toggleTranscriptEdit called _renderTranscriptTab() (a full rebuild
// of every row's HTML) just to reveal one panel, which wiped every
// other open panel's live input values back to their saved state.
function _openTranscriptRowForEdit(rowId) {
  const key = String(rowId);
  if (_transcriptEditingRows.has(key)) return; // already open — nothing to do
  _transcriptEditingRows.add(key);

  const mainRow  = document.getElementById('row-' + key);
  const panelRow = document.getElementById('edit-' + key + '-row');
  if (mainRow) {
    mainRow.classList.add('editing');
    const chevronCell = mainRow.querySelector('td:last-child');
    if (chevronCell) chevronCell.textContent = '▾ Edit';
  }
  if (panelRow) panelRow.classList.remove('hidden');

  const course = (_transcriptData.courses || []).find(c => String(c.rowId) === key);
  if (course) {
    _renderTranscriptEditForm('edit-' + key, course, false);
    _updateExistingEditsBar(course.block);
  }
}

// Closes ONE row's edit panel, same direct-DOM approach — doesn't
// touch any other row.
function _closeTranscriptRowEdit(rowId) {
  const key = String(rowId);
  if (!_transcriptEditingRows.has(key)) return;
  _transcriptEditingRows.delete(key);

  const mainRow  = document.getElementById('row-' + key);
  const panelRow = document.getElementById('edit-' + key + '-row');
  if (mainRow) {
    mainRow.classList.remove('editing');
    const chevronCell = mainRow.querySelector('td:last-child');
    if (chevronCell) chevronCell.textContent = '▸ Edit';
  }
  if (panelRow) panelRow.classList.add('hidden');

  const course = (_transcriptData.courses || []).find(c => String(c.rowId) === key);
  if (course) _updateExistingEditsBar(course.block);
}

// Opens every row in a block for editing at once — the "Bulk Edit"
// button next to each block's header. Goes through the same
// per-row DOM path as a single click (not a full table re-render),
// so it's safe to use even if some rows in the block are already
// open with unsaved changes — those are simply left alone.
function _openAllTranscriptEditsInBlock(blockNum) {
  const courses = (_transcriptData.courses || []).filter(c => c.block === blockNum);
  courses.forEach(c => _openTranscriptRowForEdit(c.rowId));
  _updateExistingEditsBar(blockNum);
}

// Closes every row in a block that's currently open for editing —
// "Collapse All." Does NOT save anything; it's a pure UI close, same
// as clicking each row's own toggle to close it individually.
function _closeAllTranscriptEditsInBlock(blockNum) {
  const courses = (_transcriptData.courses || []).filter(c => c.block === blockNum);
  courses.forEach(c => _closeTranscriptRowEdit(c.rowId));
  _updateExistingEditsBar(blockNum);
}

function _toggleTranscriptEdit(rowId) {
  const key = String(rowId);
  if (_transcriptEditingRows.has(key)) {
    _closeTranscriptRowEdit(key);
  } else {
    _openTranscriptRowForEdit(key);
  }
}

// After _renderTranscriptTab() rebuilds the DOM from scratch, every
// row's edit panel div is empty again — this re-populates the form
// for each rowId still in _transcriptEditingRows, and refreshes each
// affected block's "Save All Changes" bar.
function _reopenTranscriptEditPanels() {
  const blocksTouched = new Set();
  _transcriptEditingRows.forEach(rowId => {
    const course = (_transcriptData.courses || []).find(c => String(c.rowId) === rowId);
    if (course) {
      _renderTranscriptEditForm('edit-' + rowId, course, false);
      blocksTouched.add(course.block);
    }
  });
  // Also refresh bars for blocks that just lost their last open row
  // (bar needs to disappear), not just ones that still have rows open.
  document.querySelectorAll('.tr-table').forEach(table => {
    const blockNum = Number(table.dataset.block);
    if (!isNaN(blockNum)) blocksTouched.add(blockNum);
  });
  blocksTouched.forEach(blockNum => _updateExistingEditsBar(blockNum));
}

// Shows/hides/updates the "Save All Changes (N)" bar for existing-row
// edits in a block — separate from _updateBulkSaveBar (new rows),
// since a block could have both new rows being added AND existing
// rows being corrected at the same time.
function _updateExistingEditsBar(blockNum) {
  const bodyId = 'tr-block-' + blockNum + '-body';
  const body   = document.getElementById(bodyId);
  if (!body) return;

  const openPanels = Array.from(body.querySelectorAll('.tr-existing-edit-panel[data-block="' + blockNum + '"]'))
    .filter(p => !p.closest('tr').classList.contains('hidden'));
  let bar = body.querySelector('.tr-bulk-edit-bar[data-block="' + blockNum + '"]');

  if (openPanels.length < 2) {
    // With 0 or 1 row open, the per-row Save button already covers
    // it — the bulk bar only earns its place once there's actually
    // more than one row to save together.
    if (bar) bar.remove();
    return;
  }

  if (!bar) {
    bar = document.createElement('tr');
    bar.className = 'tr-bulk-edit-bar';
    bar.dataset.block = blockNum;
    const addRow = body.querySelector('.tr-row-add');
    body.insertBefore(bar, addRow);
  } else {
    // Re-anchor in case row order shifted after the re-render.
    const addRow = body.querySelector('.tr-row-add');
    body.insertBefore(bar, addRow);
  }

  bar.innerHTML = `
    <td colspan="8" style="padding:10px 14px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="btn-override" onclick="_saveAllTranscriptEdits(${blockNum})">
          Save All Changes (${openPanels.length})
        </button>
        <span id="tr-bulk-edit-status-${blockNum}" style="font-size:12px;color:var(--text-muted);"></span>
      </div>
    </td>`;
}

// Saves every currently-open EXISTING-row edit panel in a block in one
// batched call (saveTranscriptRows) — the actual fix for going through
// several auto-populated rows and correcting them without a
// save-then-reopen-next round trip for each one.
function _saveAllTranscriptEdits(blockNum) {
  const studentId = _transcriptStudentId;
  const bodyId    = 'tr-block-' + blockNum + '-body';
  const body      = document.getElementById(bodyId);
  if (!body) return;

  const panels = Array.from(body.querySelectorAll('.tr-existing-edit-panel[data-block="' + blockNum + '"]'))
    .filter(p => !p.closest('tr').classList.contains('hidden'));
  if (!panels.length) return;

  const statusEl = document.getElementById('tr-bulk-edit-status-' + blockNum);
  const rowsData = [];
  for (const panel of panels) {
    const rowId = panel.dataset.rowId;
    const collected = _collectTranscriptRowData(panel.id, rowId, blockNum);
    if (!collected.ok) {
      const panelStatus = document.getElementById(panel.id + '-status');
      if (panelStatus) { panelStatus.textContent = collected.error; panelStatus.style.color = 'var(--high)'; }
      if (statusEl) { statusEl.textContent = 'Fix the highlighted row before saving.'; statusEl.style.color = 'var(--high)'; }
      panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    rowsData.push(collected.rowData);
  }

  if (statusEl) { statusEl.textContent = 'Saving ' + rowsData.length + ' rows…'; statusEl.style.color = 'var(--text-muted)'; }

  google.script.run
    .withSuccessHandler(onSaved)
    .withFailureHandler(onFailed)
    .saveTranscriptRows(studentId, rowsData);

  function onSaved(result) {
    if (!result || result.success === false) { onFailed(result); return; }
    showToast(rowsData.length === 1 ? 'Course updated.' : rowsData.length + ' courses updated.');

    rowsData.forEach(rowData => {
      const idx = _transcriptData.courses.findIndex(c => String(c.rowId) === String(rowData.rowId));
      if (idx !== -1) {
        _transcriptData.courses[idx] = Object.assign({}, _transcriptData.courses[idx], rowData, {
          lastModified: new Date().toISOString(),
        });
      }
      _transcriptEditingRows.delete(String(rowData.rowId));
    });

    _renderTranscriptTab();
    _reopenTranscriptEditPanels();
  }
  function onFailed(err) {
    const msg = (err && err.error) || (err && err.message) || 'Save failed — please try again.';
    if (statusEl) { statusEl.textContent = msg; statusEl.style.color = 'var(--high)'; }
  }
}

let _transcriptNewRowCounter = 0;

function _openTranscriptAddRow(blockNum) {
  const bodyId = 'tr-block-' + blockNum + '-body';
  const body   = document.getElementById(bodyId);
  if (!body) return;

  // Unlike before, this does NOT remove any existing new-row panel —
  // several blank rows can be open at once in the same block, so a
  // whole semester's classes can be typed in before saving anything.
  const panelNum = _transcriptNewRowCounter++;
  const panelId  = 'tr-new-panel-' + blockNum + '-' + panelNum;

  const wrap = document.createElement('tr');
  wrap.className = 'tr-new-row-wrap';
  wrap.dataset.block = blockNum;
  wrap.innerHTML = `<td colspan="8" style="padding:0;">
    <div id="${panelId}" class="tr-edit-panel tr-new-panel" data-block="${blockNum}" style="margin:10px 14px;"></div>
  </td>`;
  // Insert right before the bulk-save bar (or the "+ Add Course" row
  // if no bulk-save bar exists yet for this block).
  const anchor = body.querySelector('.tr-bulk-save-bar[data-block="' + blockNum + '"]') || body.querySelector('.tr-row-add');
  body.insertBefore(wrap, anchor);

  const blankCourse = {
    rowId: null, block: blockNum, classNumber: '', courseId: '', courseName: '',
    instance: '', transfer: false, subject: '', credit: 0.5, classHours: 0,
    startDate: null, adjStart: null, targetDate: null, completed: false,
  };
  _renderTranscriptEditForm(panelId, blankCourse, true);
  _updateBulkSaveBar(blockNum);
}

// Shows/hides/updates the "Save All New Rows (N)" bar for a block,
// based on how many blank new-row panels are currently open in it.
// Created once per block, right before the "+ Add Course" row.
function _updateBulkSaveBar(blockNum) {
  const bodyId = 'tr-block-' + blockNum + '-body';
  const body   = document.getElementById(bodyId);
  if (!body) return;

  const openPanels = body.querySelectorAll('.tr-new-panel[data-block="' + blockNum + '"]');
  let bar = body.querySelector('.tr-bulk-save-bar[data-block="' + blockNum + '"]');

  if (!openPanels.length) {
    if (bar) bar.remove();
    return;
  }

  if (!bar) {
    bar = document.createElement('tr');
    bar.className = 'tr-bulk-save-bar';
    bar.dataset.block = blockNum;
    const addRow = body.querySelector('.tr-row-add');
    body.insertBefore(bar, addRow);
  }

  bar.innerHTML = `
    <td colspan="8" style="padding:10px 14px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="btn-override" onclick="_saveAllNewTranscriptRows(${blockNum})">
          Save All New Rows (${openPanels.length})
        </button>
        <button class="btn-override danger" onclick="_cancelAllNewTranscriptRows(${blockNum})">
          Cancel All
        </button>
        <span id="tr-bulk-status-${blockNum}" style="font-size:12px;color:var(--text-muted);"></span>
      </div>
    </td>`;
}

function _renderTranscriptEditForm(panelId, course, isNew) {
  const panel = document.getElementById(panelId);
  if (!panel) return;

  const catalogueOptions = (_courseCatalogue || [])
    .map(c => `<option value="${esc(c.className)}" data-subject="${esc(c.category)}" ${c.className === course.courseName ? 'selected' : ''}>${esc(c.className)}</option>`)
    .join('');

  panel.innerHTML = `
    <div class="tr-edit-grid">
      <div class="tr-edit-field" style="grid-column:span 2;">
        <label>Course Name</label>
        ${catalogueOptions
          ? `<select id="${panelId}-courseName" onchange="_onTranscriptCourseSelect('${panelId}')">
               <option value="">— Select or type below —</option>
               ${catalogueOptions}
             </select>`
          : ''}
        <input type="text" id="${panelId}-courseNameFree" value="${esc(course.courseName || '')}" placeholder="Course name" style="margin-top:${_courseCatalogue && _courseCatalogue.length ? '6px' : '0'};">
      </div>
      <div class="tr-edit-field">
        <label>Category</label>
        <select id="${panelId}-subject">
          <option value="">— Select category —</option>
          ${TRANSCRIPT_COURSE_CATEGORIES.map(cat =>
            `<option value="${esc(cat)}" ${course.subject === cat ? 'selected' : ''}>${esc(cat)}</option>`
          ).join('')}
        </select>
      </div>

      <div class="tr-edit-field">
        <label>Credit</label>
        <input type="number" step="0.1" id="${panelId}-credit" value="${course.credit || 0}">
      </div>
      <div class="tr-edit-field">
        <label>Class Hours</label>
        <input type="number" step="1" id="${panelId}-classHours" value="${course.classHours || 0}" oninput="_recalcTranscriptPreview('${panelId}')">
      </div>
      <div class="tr-edit-field">
        <label>Instance</label>
        <input type="text" id="${panelId}-instance" value="${esc(course.instance || '')}" placeholder="1">
      </div>

      <div class="tr-edit-field">
        <label>Start Date</label>
        <input type="date" id="${panelId}-startDate" value="${course.startDate || ''}" oninput="_recalcTranscriptPreview('${panelId}')">
      </div>
      <div class="tr-edit-field">
        <label>Adjusted Start</label>
        <input type="date" id="${panelId}-adjStart" value="${course.adjStart || ''}" oninput="_recalcTranscriptPreview('${panelId}')">
      </div>
      <div class="tr-edit-field checkbox-field">
        <input type="checkbox" id="${panelId}-completed" ${course.completed ? 'checked' : ''} onchange="_recalcTranscriptPreview('${panelId}')">
        <label for="${panelId}-completed">Completed</label>
      </div>

      <div class="tr-edit-field checkbox-field">
        <input type="checkbox" id="${panelId}-transfer" ${course.transfer ? 'checked' : ''} onchange="_recalcTranscriptPreview('${panelId}')">
        <label for="${panelId}-transfer">Transfer Credit</label>
      </div>
    </div>

    <div class="tr-target-preview" id="${panelId}-preview"></div>

    <div class="tr-edit-actions">
      ${isNew
        ? `<button class="btn-override danger tr-remove-new-btn" data-panel-id="${panelId}" data-block="${course.block ?? ''}">
             Remove this row
           </button>`
        : `<button class="btn-override tr-save-btn" data-panel-id="${panelId}" data-row-id="${course.rowId ?? ''}" data-block="${course.block ?? ''}" data-is-new="0">
             Save Changes
           </button>
           <button class="btn-override danger tr-cancel-btn" data-panel-id="${panelId}" data-row-id="${course.rowId ?? ''}" data-is-new="0">
             Cancel
           </button>`}
      <span id="${panelId}-status" style="font-size:12px;color:var(--text-muted);align-self:center;"></span>
    </div>
  `;

  if (isNew) {
    panel.querySelector('.tr-remove-new-btn').addEventListener('click', function() {
      _removeNewTranscriptRow(this.dataset.panelId, Number(this.dataset.block));
    });
  } else {
    panel.querySelector('.tr-save-btn').addEventListener('click', function() {
      const rowId = this.dataset.rowId || null;
      const block = this.dataset.block ? Number(this.dataset.block) : null;
      _saveTranscriptRow(this.dataset.panelId, rowId, block);
    });
    panel.querySelector('.tr-cancel-btn').addEventListener('click', function() {
      _toggleTranscriptEdit(this.dataset.rowId);
    });
  }
  if (!_canEdit('transcript')) {
    panel.querySelectorAll('input, select, button').forEach(el => el.disabled = true);
    const status = panel.querySelector(`#${panelId}-status`);
    if (status) { status.textContent = 'View only — you do not have permission to edit transcripts.'; status.style.color = 'var(--text-muted)'; }
  }
  _recalcTranscriptPreview(panelId);
}

function _onTranscriptCourseSelect(panelId) {
  const sel = document.getElementById(panelId + '-courseName');
  if (!sel || !sel.value) return;
  document.getElementById(panelId + '-courseNameFree').value = sel.value;
  const subjectEl = document.getElementById(panelId + '-subject');
  const opt = sel.options[sel.selectedIndex];
  const subject = opt ? opt.getAttribute('data-subject') : '';
  if (subjectEl && subject) subjectEl.value = subject;
  _recalcTranscriptPreview(panelId);
}

function _recalcTranscriptPreview(panelId) {
  const hoursEl     = document.getElementById(panelId + '-classHours');
  const startEl     = document.getElementById(panelId + '-startDate');
  const adjStartEl  = document.getElementById(panelId + '-adjStart');
  const completedEl = document.getElementById(panelId + '-completed');
  const transferEl  = document.getElementById(panelId + '-transfer');
  const previewEl   = document.getElementById(panelId + '-preview');
  if (!previewEl) return;

  const hours     = parseFloat(hoursEl ? hoursEl.value : 0) || 0;
  const startDate = (adjStartEl && adjStartEl.value) ? adjStartEl.value : (startEl ? startEl.value : '');
  const completed = completedEl ? completedEl.checked : false;
  const transfer  = transferEl  ? transferEl.checked  : false;

  if (completed) {
    previewEl.innerHTML = `<span style="color:var(--low);font-weight:700;">✓ Marked Completed</span> — no target date needed.`;
    return;
  }
  if (transfer) {
    previewEl.innerHTML = `<span style="color:var(--text-muted);font-weight:700;">Transfer Credit</span> — no target date calculated.`;
    return;
  }

  const target = TargetDateEngine.calculate(hours, startDate, _transcriptSettings, completed, transfer);
  if (!target) {
    previewEl.innerHTML = `<span style="color:var(--text-muted);">Enter class hours and a start date to see the projected target date.</span>`;
    return;
  }
  const status = TargetDateEngine.getStatus(target, false, false);
  const color  = status === 'overdue' ? 'var(--high)' : 'var(--low)';
  previewEl.innerHTML = `<span style="color:var(--text-muted);">Projected Target Date:</span> <strong style="color:${color};">${TargetDateEngine.formatDisplay(target)}</strong>
    <span style="color:var(--text-muted);font-size:11px;">(based on ${_transcriptSettings.weeklyHours}h/wk pacing settings)</span>`;
}

// Extracts + validates one panel's fields. Shared by both the
// single-row edit-save path and the bulk new-rows save path, so
// validation rules only live in one place.
function _collectTranscriptRowData(panelId, rowId, block) {
  const subjectVal = document.getElementById(panelId + '-subject').value;
  const startDateVal = document.getElementById(panelId + '-startDate').value || '';
  const adjStartVal   = document.getElementById(panelId + '-adjStart').value  || '';
  const hasStarted = !!(startDateVal || adjStartVal);

  // Category is only required once the class has actually started —
  // an auto-populated row sitting with no start date yet (hasn't been
  // scheduled/begun) shouldn't force staff to pick a category before
  // they even know one, e.g. during a first pass through a new
  // student's whole transcript.
  if (hasStarted && !subjectVal) return { ok: false, error: 'Please select a category.' };

  const courseName = (document.getElementById(panelId + '-courseNameFree') || {}).value || '';
  if (!courseName.trim()) return { ok: false, error: 'Course name is required.' };

  const hours     = parseFloat(document.getElementById(panelId + '-classHours').value) || 0;
  const startDate = startDateVal || null;
  const adjStart  = adjStartVal  || null;
  const completed = document.getElementById(panelId + '-completed').checked;
  const transfer  = document.getElementById(panelId + '-transfer').checked;
  const effectiveStart = adjStart || startDate;
  const targetDate = (completed || transfer) ? null : TargetDateEngine.calculate(hours, effectiveStart, _transcriptSettings, completed, transfer);

  const rowData = {
    rowId: rowId || null,
    block,
    courseId:   '',
    courseName: courseName.trim(),
    instance:   document.getElementById(panelId + '-instance').value || '',
    transfer,
    subject:    subjectVal,
    credit:     parseFloat(document.getElementById(panelId + '-credit').value) || 0,
    classHours: hours,
    startDate,
    adjStart,
    targetDate,
    completed,
  };
  return { ok: true, rowData };
}

// Saves an EDIT to an existing row. New-row adds no longer go through
// here — see _saveAllNewTranscriptRows() below, which handles every
// pending new row in a block in one batched call.
function _saveTranscriptRow(panelId, rowId, block) {
  const studentId = _transcriptStudentId;
  const statusEl  = document.getElementById(panelId + '-status');

  const collected = _collectTranscriptRowData(panelId, rowId, block);
  if (!collected.ok) {
    if (statusEl) { statusEl.textContent = collected.error; statusEl.style.color = 'var(--high)'; }
    return;
  }
  const rowData = collected.rowData;

  if (statusEl) { statusEl.textContent = 'Saving…'; statusEl.style.color = 'var(--text-muted)'; }

  google.script.run
    .withSuccessHandler(onSaved)
    .withFailureHandler(onFailed)
    .saveTranscriptRow(studentId, rowData);

  function onSaved(result) {
    if (!result || result.success === false) { onFailed(result); return; }
    showToast('Course updated.');

    const savedRow = Object.assign({}, rowData, {
      rowId: (result && result.rowId) || rowId,
      lastModified: new Date().toISOString(),
    });
    if (!_transcriptData) _transcriptData = {};
    if (!_transcriptData.courses) _transcriptData.courses = [];
    const idx = _transcriptData.courses.findIndex(c => String(c.rowId) === String(savedRow.rowId));
    if (idx !== -1) {
      _transcriptData.courses[idx] = Object.assign({}, _transcriptData.courses[idx], savedRow);
    } else {
      _transcriptData.courses.push(savedRow);
    }

    _transcriptEditingRows.delete(String(savedRow.rowId));
    _renderTranscriptTab();
    _reopenTranscriptEditPanels();
  }
  function onFailed(err) {
    const msg = (err && err.error) || (err && err.message) || 'Save failed — please try again.';
    if (statusEl) { statusEl.textContent = msg; statusEl.style.color = 'var(--high)'; }
  }
}

// Saves every currently-open blank new-row panel in a block in ONE
// batched server call (addTranscriptRows) — this is the actual fix
// for "fill in one row, save, fill in the next" friction. Validates
// every open panel first; if any one is incomplete, nothing is saved
// and that panel's status shows the error, so a typo three rows back
// doesn't silently drop that row.
function _saveAllNewTranscriptRows(blockNum) {
  const studentId = _transcriptStudentId;
  const bodyId    = 'tr-block-' + blockNum + '-body';
  const body      = document.getElementById(bodyId);
  if (!body) return;

  const panels = Array.from(body.querySelectorAll('.tr-new-panel[data-block="' + blockNum + '"]'));
  if (!panels.length) return;

  const statusEl = document.getElementById('tr-bulk-status-' + blockNum);
  const rowsData = [];
  for (const panel of panels) {
    const collected = _collectTranscriptRowData(panel.id, null, blockNum);
    if (!collected.ok) {
      const panelStatus = document.getElementById(panel.id + '-status');
      if (panelStatus) { panelStatus.textContent = collected.error; panelStatus.style.color = 'var(--high)'; }
      if (statusEl) { statusEl.textContent = 'Fix the highlighted row before saving.'; statusEl.style.color = 'var(--high)'; }
      panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return; // nothing saved — all-or-nothing, so a bad row doesn't silently vanish
    }
    rowsData.push(collected.rowData);
  }

  if (statusEl) { statusEl.textContent = 'Saving ' + rowsData.length + ' rows…'; statusEl.style.color = 'var(--text-muted)'; }

  google.script.run
    .withSuccessHandler(onSaved)
    .withFailureHandler(onFailed)
    .addTranscriptRows(studentId, rowsData);

  function onSaved(result) {
    if (!result || result.success === false) { onFailed(result); return; }
    showToast(rowsData.length === 1 ? 'Course added.' : rowsData.length + ' courses added.');

    if (!_transcriptData) _transcriptData = {};
    if (!_transcriptData.courses) _transcriptData.courses = [];
    rowsData.forEach((rowData, i) => {
      _transcriptData.courses.push(Object.assign({}, rowData, {
        rowId: (result.rowIds && result.rowIds[i]) || null,
        lastModified: new Date().toISOString(),
      }));
    });

    _renderTranscriptTab();
    _reopenTranscriptEditPanels();
  }
  function onFailed(err) {
    const msg = (err && err.error) || (err && err.message) || 'Save failed — please try again.';
    if (statusEl) { statusEl.textContent = msg; statusEl.style.color = 'var(--high)'; }
  }
}

// Removes a single pending new-row panel without saving it.
function _removeNewTranscriptRow(panelId, blockNum) {
  const panel = document.getElementById(panelId);
  const wrap  = panel ? panel.closest('.tr-new-row-wrap') : null;
  if (wrap) wrap.remove();
  _updateBulkSaveBar(blockNum);
}

// Discards every pending new-row panel in a block at once.
function _cancelAllNewTranscriptRows(blockNum) {
  const bodyId = 'tr-block-' + blockNum + '-body';
  const body   = document.getElementById(bodyId);
  if (!body) return;
  body.querySelectorAll('.tr-new-row-wrap[data-block="' + blockNum + '"]').forEach(el => el.remove());
  _updateBulkSaveBar(blockNum);
}

// Most recent Monday, formatted as yyyy-MM-dd for the date input.
function _defaultTimeLogWeek_() {
  const today = new Date();
  const day = today.getDay(); // 0=Sun..6=Sat
  const diffToMonday = (day === 0 ? 6 : day - 1);
  const monday = new Date(today);
  monday.setDate(today.getDate() - diffToMonday);
  const y = monday.getFullYear();
  const m = String(monday.getMonth() + 1).padStart(2, '0');
  const d = String(monday.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

// WIR generation should default to LAST week, not the current
// (still in-progress) one — a week's data isn't complete until it's
// actually over, so generating for "this week" mid-week would run
// against incomplete hours/progress numbers. This was previously
// sharing _defaultTimeLogWeek_ (current week), which meant opening
// this modal and clicking Generate without manually changing the
// date would silently target the wrong week — nothing stops you
// from picking a different week here if you genuinely need to, this
// only changes what shows up before you touch it.
function _defaultWIRGenerateWeek_() {
  const today = new Date();
  const day = today.getDay(); // 0=Sun..6=Sat
  const diffToMonday = (day === 0 ? 6 : day - 1);
  const thisMonday = new Date(today);
  thisMonday.setDate(today.getDate() - diffToMonday);
  const lastMonday = new Date(thisMonday);
  lastMonday.setDate(thisMonday.getDate() - 7);
  const y = lastMonday.getFullYear();
  const m = String(lastMonday.getMonth() + 1).padStart(2, '0');
  const d = String(lastMonday.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function _submitWeeklyTimeLog() {
  if (!_canEdit('timelog')) {
    showToast('You do not have permission to edit time logs.', 'error');
    return;
  }
  const studentId = currentModalProfile ? (currentModalProfile.academicId || currentModalProfile.id) : null;
  const week   = document.getElementById('timeLogWeekInput').value;
  const log    = document.getElementById('timeLogPasteInput').value;
  const status = document.getElementById('timeLogStatus');
  const btn    = document.getElementById('timeLogSaveBtn');

  if (!studentId) { status.textContent = 'No student ID on file.';    status.style.color = 'var(--high)'; return; }
  if (!log.trim()) { status.textContent = 'Paste a session log first.'; status.style.color = 'var(--high)'; return; }

  btn.disabled = true;
  btn.textContent = 'Saving…';
  status.textContent = 'Parsing log…';
  status.style.color = 'var(--text-muted)';

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      btn.textContent = 'Save This Week';
      if (!result || result.success === false) {
        status.textContent = (result && result.error) || 'Save failed.';
        status.style.color = 'var(--high)';
        return;
      }
      const weeks = result.weeks || [];
      if (!weeks.length) {
        status.textContent = 'Saved, but no weeks were found in the pasted log.';
        status.style.color = 'var(--medium)';
      } else if (weeks.length === 1) {
        const w = weeks[0];
        status.textContent = '✓ Week of ' + w.weekLabel + ': ' +
          w.actualWorkedTime.toFixed(2) + 'h worked (of ' + w.assignedHours.toFixed(1) + 'h assigned), ' +
          w.idleTime.toFixed(2) + 'h idle.';
        if (w.courses && w.courses.length) {
          status.textContent += ' Courses: ' + w.courses.map(c => c.courseName + ' (' + c.activitiesCompleted + ')').join(', ') + '.';
        }
        if (w.courseCountMismatch) {
          status.textContent += ' ⚠ Course activity counts didn\'t add up to the week total — the per-course breakdown may be incomplete, but hours were saved fine.';
        }
      } else {
        const totalHours = weeks.reduce((s, w) => s + w.actualWorkedTime, 0);
        status.textContent = '✓ Saved ' + weeks.length + ' weeks (' + weeks[0].weekLabel + ' \u2192 ' + weeks[weeks.length - 1].weekLabel + '), ' +
          totalHours.toFixed(1) + 'h total worked.';
        const mismatchCount = weeks.filter(w => w.courseCountMismatch).length;
        if (mismatchCount) {
          status.textContent += ' \u26a0 ' + mismatchCount + ' week(s) had a course-count mismatch — hours saved fine, but double-check the course breakdown for those weeks.';
        }
      }
      status.style.color = weeks.some(w => w.courseCountMismatch) ? 'var(--medium)' : 'var(--low)';
      document.getElementById('timeLogPasteInput').value = '';
      _refreshTimeLogHistory(studentId);
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      btn.textContent = 'Save This Week';
      status.textContent = err && err.message ? err.message : 'Save failed — please try again.';
      status.style.color = 'var(--high)';
    })
    .saveWeeklyTimeLog(studentId, week, log, _currentRole, _currentEmployeeId);
}
